// Cancha animada para el partido en vivo (canvas) y sonidos simples.
DT.Sound = (function () {
  const S = { ctx: null };
  function ctx() {
    if (S.ctx) return S.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { S.ctx = new AC(); } catch (e) { S.ctx = null; }
    return S.ctx;
  }
  const on = () => DT.G && DT.G.settings.sound !== false;
  S.unlock = () => { const c = ctx(); if (c && c.state === 'suspended') c.resume(); };
  function tone(freq, start, dur, vol, type) {
    const c = ctx();
    if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0, c.currentTime + start);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + start + 0.01);
    g.gain.linearRampToValueAtTime(0, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start);
    o.stop(c.currentTime + start + dur + 0.02);
  }
  // Silbato: n pitazos
  S.whistle = (n) => {
    if (!on()) return;
    for (let i = 0; i < (n || 1); i++) {
      tone(2900, i * 0.32, i === (n || 1) - 1 ? 0.5 : 0.18, 0.12, 'square');
      tone(3150, i * 0.32, i === (n || 1) - 1 ? 0.5 : 0.18, 0.05, 'sine');
    }
  };
  // Grito de gol: ruido filtrado que crece y se apaga
  S.goal = () => {
    if (!on()) return;
    const c = ctx();
    if (!c) return;
    const len = 2.4;
    const buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 900;
    f.Q.value = 0.6;
    const g = c.createGain();
    const t = c.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.35, t + 0.25);
    g.gain.linearRampToValueAtTime(0.25, t + 1.4);
    g.gain.linearRampToValueAtTime(0, t + len);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  };
  S.card = () => { if (on()) tone(1800, 0, 0.12, 0.08, 'square'); };
  return S;
})();

// Cancha: cada minuto simulado se convierte en una jugada que se ve. El equipo con la pelota
// avanza con pases y conducciones, el rival presiona y se acomoda, y los remates terminan en
// gol, atajada o afuera según lo que decidió el motor del partido (DT.Match).
DT.Pitch = function (canvas, sim, hooks) {
  hooks = hooks || {};
  const G = DT.G;
  const L = 105, Wd = 68, M = 3; // metros de cancha y margen
  const TW = L + M * 2, TH = Wd + M * 2;
  const U = DT.U;
  let raf = null, last = 0, tickMs = 950, scale = 1;
  const pl = {}; // pid -> estado de dibujo
  const ball = { x: L / 2, y: Wd / 2, z: 0, owner: null, fly: null };
  let poss = 0; // equipo que tiene la pelota en la animación
  let queue = []; // acciones pendientes del minuto
  let act = null; // acción en curso
  let roles = {}; // pid -> destino especial durante la jugada (desmarques, arquero que vuela)
  let mode = 'play'; // play | celebrate | reset
  let modeUntil = 0, holdUntil = 0, celeb = null;
  let shotUntil = 0; // hay un remate pendiente de mostrarse: el reloj del partido espera
  let surge = -1; // equipo que llega al área en este minuto
  const trails = [];
  const marks = [];
  let overlay = null, caption = null;
  const css = getComputedStyle(document.documentElement);
  const grassA = css.getPropertyValue('--pitch-a').trim() || '#2f7d4f';
  const grassB = css.getPropertyValue('--pitch-b').trim() || '#2a7247';

  // Camisetas: si los colores se parecen mucho, el visitante usa la alternativa.
  const hex = (h) => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  const dist = (a, b) => { const x = hex(a), y = hex(b); return Math.sqrt((x[0] - y[0]) ** 2 + (x[1] - y[1]) ** 2 + (x[2] - y[2]) ** 2); };
  const th = G.teams[sim.s[0].tid], ta = G.teams[sim.s[1].tid];
  // parecido entre camisetas: color principal y color promedio (rayas incluidas)
  const mix = (k) => { const a = hex(k.fill), b = hex(k.stripe); return '#' + a.map((v, i) => Math.round(v * 0.62 + b[i] * 0.38).toString(16).padStart(2, '0')).join(''); };
  const kitGap = (a, b) => Math.min(dist(a.fill, b.fill), dist(mix(a), mix(b)) * 1.15);
  const kits = [{ fill: th.c1, stripe: th.c2 }, { fill: ta.c1, stripe: ta.c2 }];
  if (kitGap(kits[0], kits[1]) < 110) {
    const alts = [{ fill: ta.c2, stripe: ta.c1 }, { fill: '#f1f1f1', stripe: '#3a3a3a' }, { fill: '#1f2833', stripe: '#e6e6e6' }, { fill: '#c62828', stripe: '#ffffff' }, { fill: '#f2c200', stripe: '#1a1a1a' }];
    kits[1] = alts.reduce((best, k) => (kitGap(kits[0], k) > kitGap(kits[0], best) ? k : best), alts[0]);
  }
  const gkKits = [{ fill: '#e8b400', stripe: '#e8b400' }, { fill: '#3b3b3b', stripe: '#3b3b3b' }];
  if (dist(kits[0].fill, gkKits[0].fill) < 80) gkKits[0] = { fill: '#9c27b0', stripe: '#9c27b0' };

  DT.P.ensureNumbers(th);
  DT.P.ensureNumbers(ta);

  // Coordenadas "propias": distancia al arco que defiende cada equipo (el local ataca hacia la derecha).
  const dirOf = (s) => (s === 0 ? 1 : -1);
  const own = (s, x) => (s === 0 ? x : L - x);
  const fromOwn = (s, u) => (s === 0 ? u : L - u);
  const pace = () => 950 / tickMs; // 1 = velocidad normal
  const vmax = () => 15 * Math.pow(pace(), 0.85); // metros por segundo en pantalla
  const short = (id) => {
    const p = G.players[id];
    if (!p) return '';
    const parts = p.n.split(' ');
    return parts.length > 1 ? parts.slice(1).join(' ') : p.n;
  };
  const say = (text, ms) => { caption = { text, until: performance.now() + (ms || Math.max(900, tickMs * 1.4)) }; };

  function basePos(side, idx) {
    const F = DT.FORMATIONS[sim.s[side].tac.f];
    const xy = F.xy[idx] || [50, 50];
    const depth = (90 - xy[1]) / 75;
    let x = 4 + depth * 45;
    let y = (xy[0] / 100) * Wd;
    if (side === 1) { x = L - x; y = Wd - y; }
    return { x, y };
  }

  function sync(initial) {
    // agrega/quita jugadores según los que están en cancha (cambios, expulsiones)
    const alive = new Set();
    for (let s = 0; s < 2; s++) {
      for (const o of sim.s[s].on) {
        alive.add(o.id);
        if (!pl[o.id]) {
          const b = basePos(s, o.i);
          // el que entra de cambio aparece desde el costado de la cancha
          const sx = initial ? b.x : L / 2 + (s === 0 ? -3 : 3), sy = initial ? b.y : Wd + 2;
          pl[o.id] = { x: sx, y: sy, tx: b.x, ty: b.y, side: s, idx: o.i, ph: Math.random() * 6.28 };
        }
        const P = pl[o.id];
        P.side = s; P.idx = o.i; P.gk = o.slot === 'P';
        P.num = G.players[o.id] ? G.players[o.id].num : '';
      }
    }
    for (const id in pl) {
      if (!alive.has(+id)) {
        delete pl[id];
        if (ball.owner === +id) ball.owner = null;
      }
    }
  }

  const ids = (s, outfield) => Object.keys(pl).map(Number).filter((id) => pl[id].side === s && (!outfield || !pl[id].gk));
  const gkOf = (s) => ids(s).find((id) => pl[id].gk);
  function nearest(s, x, y, outfield, except) {
    let best = null, bd = 1e9;
    for (const id of ids(s, outfield)) {
      if (id === except) continue;
      const d = Math.hypot(pl[id].x - x, pl[id].y - y);
      if (d < bd) { bd = d; best = id; }
    }
    return best;
  }

  function kickoff(side) {
    sync(true);
    const ks = side === undefined ? (sim.half === 2 ? 1 : 0) : side;
    for (const id in pl) {
      const P = pl[id];
      const b = basePos(P.side, P.idx);
      P.x = P.tx = b.x; P.y = P.ty = b.y;
    }
    placeKickoff(ks);
    queue = []; act = null; roles = {}; mode = 'play'; celeb = null;
  }
  // pelota al medio y la toca el jugador más adelantado del equipo que saca
  function placeKickoff(ks) {
    ball.x = L / 2; ball.y = Wd / 2; ball.z = 0; ball.fly = null;
    const k = nearest(ks, L / 2, Wd / 2, true);
    ball.owner = k;
    poss = ks;
    if (k) { roles = {}; roles[k] = { x: L / 2 - dirOf(ks) * 0.8, y: Wd / 2 }; }
  }

  // ---------- jugada de cada minuto ----------
  function minute() {
    sync();
    const lst = sim.last;
    if (!lst) return;
    const now = performance.now();
    const budget = tickMs * 0.9;
    const a = lst.att;
    const plan = [];
    roles = {};
    const ownerSide = ball.owner && pl[ball.owner] ? pl[ball.owner].side : -1;
    if (ownerSide !== a) plan.push({ k: 'win', s: a, w: 0.7 });
    if (lst.shot) {
      const sh = lst.shot.pid, aid = lst.shot.aid && pl[lst.shot.aid] ? lst.shot.aid : null;
      // desmarques: el que remata entra al área y el que asiste abre la cancha
      if (pl[sh]) roles[sh] = { x: fromOwn(a, U.rf(83, 93)), y: Wd / 2 + U.rf(-9, 9), run: true, v: 2.2 };
      if (aid) roles[aid] = { x: fromOwn(a, U.rf(70, 86)), y: Wd / 2 + (Math.random() < 0.5 ? -1 : 1) * U.rf(10, 24), run: true, v: 2.2 };
      surge = a;
      shotUntil = now + budget * 3 + 1500;
      const build = budget > 1300 ? 2 : budget > 650 ? 1 : 0;
      for (let i = 0; i < build; i++) plan.push(Math.random() < 0.7 ? { k: 'pass', s: a, w: 1 } : { k: 'carry', s: a, w: 0.8 });
      if (aid) plan.push({ k: 'pass', s: a, to: aid, w: 1 });
      plan.push({ k: 'pass', s: a, to: sh, w: 1 });
      if (budget > 500) plan.push({ k: 'carry', s: a, w: 0.5, inward: true });
      const res = lst.shot.goal ? 'goal' : lst.shot.on ? 'save' : 'miss';
      plan.push({ k: 'shot', s: a, res, w: 0.75 });
      plan.push({ k: 'idle', w: 0.5 });
      if (lst.shot.goal) holdUntil = now + budget + 3600; // se ajusta cuando la pelota entra
    } else {
      surge = -1;
      const n = budget > 1300 ? U.ri(2, 4) : budget > 650 ? U.ri(1, 3) : U.ri(1, 2);
      for (let i = 0; i < n; i++) plan.push(Math.random() < 0.72 ? { k: 'pass', s: a, w: 1 } : { k: 'carry', s: a, w: 0.8 });
      if (Math.random() < 0.3) plan.push({ k: 'lose', s: a, w: 1 });
      else plan.push({ k: 'idle', w: 0.3 });
    }
    const tot = plan.reduce((t, x) => t + x.w, 0);
    for (const x of plan) x.dur = (budget * x.w) / tot;
    queue = plan;
    act = null;
    for (const c of lst.cards) {
      marks.push({ pid: c.pid, red: c.red, until: now + Math.max(1800, tickMs * 2) });
      say(`${c.red ? 'Roja' : 'Amarilla'} para ${short(c.pid)}`);
      DT.Sound.card();
    }
  }

  // receptor de un pase: compañero bien ubicado, en lo posible más adelante
  function pickReceiver(s, from) {
    const F = pl[from];
    const d = dirOf(s);
    const cands = ids(s, true).filter((id) => id !== from);
    if (!cands.length) return null;
    const want = U.rf(2, 16);
    const ws = cands.map((id) => {
      const P = pl[id];
      const adv = (P.x - F.x) * d;
      const dd = Math.hypot(P.x - F.x, P.y - F.y);
      let w = Math.exp(-((adv - want) ** 2) / 180);
      if (dd < 6) w *= 0.15;
      if (dd > 38) w *= 0.15;
      return w + 0.01;
    });
    return U.weighted(cands, ws);
  }

  function launch(tx, ty, dur, kind, onEnd) {
    const d = Math.hypot(tx - ball.x, ty - ball.y);
    ball.fly = { fx: ball.x, fy: ball.y, tx, ty, t0: performance.now(), dur: Math.max(60, dur), h: kind === 'pass' && d > 26 ? Math.min(4, d / 10) : kind === 'shot' ? 0.8 : 0, kind, onEnd };
    ball.owner = null;
    if (kind !== 'win') {
      trails.push({ x1: ball.x, y1: ball.y, x2: tx, y2: ty, t: performance.now(), kind });
      if (trails.length > 8) trails.shift();
    }
  }

  function startAction(a, now) {
    // si la pelota todavía viaja, la acción espera
    if (ball.fly) {
      queue.unshift(a);
      act = { k: 'wait', t0: now, dur: Math.max(30, ball.fly.t0 + ball.fly.dur - now) };
      return;
    }
    a.t0 = now;
    act = a;
    if (a.k === 'idle') return;
    let own0 = ball.owner && pl[ball.owner] ? ball.owner : null;
    if (a.k === 'win') {
      const w = (own0 && pl[own0].side === a.s) ? own0 : nearest(a.s, ball.x, ball.y, own(a.s, ball.x) > 16);
      if (!w) return;
      poss = a.s;
      if (own0 && pl[own0].side !== a.s) say(`Recupera ${short(w)}`);
      const P = pl[w];
      launch(P.x, P.y, a.dur * 0.7, 'win', () => { ball.owner = w; });
      return;
    }
    if (!own0 || (a.s !== undefined && pl[own0].side !== a.s)) {
      // la pelota quedó suelta: la toma el más cercano del equipo que ataca
      const s0 = a.s !== undefined ? a.s : poss;
      own0 = nearest(s0, ball.x, ball.y, true);
      if (!own0) return;
      ball.owner = own0;
      poss = s0;
    }
    const O = pl[own0];
    const d = dirOf(O.side);
    if (a.k === 'pass' || a.k === 'lose') {
      let to = a.to && pl[a.to] ? a.to : null;
      if (to === own0) { act.dur = 1; return; } // ya la tiene
      if (!to) to = pickReceiver(O.side, own0);
      if (!to) return;
      const R = pl[to];
      // pase al espacio: a donde va a llegar el receptor cuando le llegue la pelota
      let dest;
      if (roles[to]) {
        const rr = roles[to];
        const gap = Math.hypot(rr.x - R.x, rr.y - R.y);
        const k = Math.min(1, (vmax() * (rr.v || 1) * a.dur * 0.8) / 1000 / Math.max(0.1, gap));
        dest = { x: R.x + (rr.x - R.x) * k, y: R.y + (rr.y - R.y) * k };
      } else dest = { x: U.clamp(R.x + d * U.rf(1, 4), 2, L - 2), y: U.clamp(R.y + U.rf(-2, 2), 2, Wd - 2) };
      if (a.k === 'lose') {
        // pase cortado: un rival se cruza en la línea del pase
        const mx = O.x + (dest.x - O.x) * U.rf(0.45, 0.7), my = O.y + (dest.y - O.y) * U.rf(0.45, 0.7);
        const cut = nearest(1 - O.side, mx, my, true);
        if (!cut) return;
        roles[cut] = { x: mx, y: my };
        launch(mx, my, a.dur * 0.75, 'lost', () => { ball.owner = cut; poss = pl[cut] ? pl[cut].side : poss; say(`La corta ${short(cut)}`); });
        return;
      }
      if (!roles[to]) roles[to] = dest;
      launch(dest.x, dest.y, a.dur * 0.8, 'pass', () => { ball.owner = to; });
      return;
    }
    if (a.k === 'carry') {
      const u = own(O.side, O.x);
      const nu = Math.min(L - 14, u + U.rf(5, 12));
      const ny = a.inward ? O.y + (Wd / 2 - O.y) * 0.4 : O.y + U.rf(-5, 5);
      roles[own0] = { x: fromOwn(O.side, nu), y: U.clamp(ny, 3, Wd - 3), run: true };
      return;
    }
    if (a.k === 'shot') {
      const s = O.side, def = 1 - s;
      const u0 = own(s, O.x);
      if (u0 < 76 && !a.ran) {
        // lejos del arco: primero encara hacia el área
        a.ran = true;
        const tx = fromOwn(s, U.rf(82, 88)), ty = O.y + (Wd / 2 - O.y) * 0.5;
        roles[own0] = { x: tx, y: ty, run: true, v: 2.2 };
        queue.unshift(a);
        act = { k: 'wait', t0: now, dur: Math.max(120, (Math.hypot(tx - O.x, ty - O.y) / (vmax() * 2.2)) * 1000 * 1.15) };
        return;
      }
      const gk = gkOf(def);
      const gx = fromOwn(s, L);
      say(`Remate de ${short(own0)}`);
      if (a.res === 'goal') {
        const gy = Wd / 2 + U.rf(-3, 3);
        if (gk) roles[gk] = { x: fromOwn(def, 1), y: Wd / 2 - Math.sign(gy - Wd / 2 || 1) * 2.5, dive: true };
        const scorer = own0;
        launch(gx + d * 1.6, gy, a.dur * 0.75, 'shot', () => { shotUntil = 0; goal(scorer, s); });
      } else if (a.res === 'save') {
        const gy = Wd / 2 + U.rf(-2.8, 2.8);
        const sx = fromOwn(def, 1.3);
        if (gk) roles[gk] = { x: sx, y: gy, dive: true };
        launch(sx, gy, a.dur * 0.75, 'shot', () => {
          shotUntil = 0;
          if (gk && pl[gk]) { ball.owner = gk; poss = def; say(`¡Ataja ${short(gk)}!`); }
        });
      } else {
        const gy = Wd / 2 + (Math.random() < 0.5 ? -1 : 1) * U.rf(4.6, 10);
        launch(gx + d * 2.6, gy, a.dur * 0.75, 'shot', () => {
          shotUntil = 0;
          say('Afuera. Saque de arco.');
          // saque de arco: la pelota vuelve al área chica del que defiende
          setTimeout(() => {
            if (ball.fly || mode !== 'play') return;
            ball.x = fromOwn(def, 5.5); ball.y = Wd / 2 + (gy > Wd / 2 ? 1 : -1) * 6; ball.z = 0;
            if (gk && pl[gk]) { pl[gk].x = ball.x - dirOf(def) * 0.8; pl[gk].y = ball.y; ball.owner = gk; }
            poss = def;
          }, Math.min(450, tickMs * 0.4));
        });
      }
    }
  }

  function goal(scorer, side) {
    const now = performance.now();
    const p = G.players[scorer];
    overlay = { text: '¡GOL!', sub: p ? p.n : '', until: now + 2300 };
    DT.Sound.goal();
    if (hooks.onGoal) hooks.onGoal();
    mode = 'celebrate';
    modeUntil = now + 2300;
    holdUntil = now + 3300;
    const sp = pl[scorer] || { y: Wd / 2 };
    celeb = { pid: scorer, side, x: fromOwn(side, L - 3), y: sp.y < Wd / 2 ? 3 : Wd - 3 };
    queue = []; act = null; roles = {};
  }

  // ---------- movimiento ----------
  function shapeTarget(id, P, now, pressers) {
    const r = roles[id];
    if (mode === 'celebrate' && celeb) {
      if (P.side === celeb.side && !P.gk) {
        if (id === celeb.pid) return { x: celeb.x, y: celeb.y, v: 1.1 };
        const k = (P.idx * 2.4) % 6.28;
        return { x: celeb.x - dirOf(celeb.side) * (3 + (P.idx % 3) * 1.5) + Math.cos(k) * 1.5, y: celeb.y + Math.sin(k) * 3 + (celeb.y < Wd / 2 ? 3 : -3), v: 0.9 };
      }
      const b = basePos(P.side, P.idx);
      return { x: b.x, y: b.y, v: 0.35 };
    }
    if (mode === 'reset' && id === ball.owner) return { x: L / 2 - dirOf(P.side) * 0.8, y: Wd / 2, v: 1.4 };
    if (mode === 'reset') { const b = basePos(P.side, P.idx); return { x: b.x, y: b.y, v: 1.2 }; }
    if (r) return { x: r.x, y: r.y, v: r.v || (r.dive ? 2.4 : r.run ? 0.9 : 1) };
    const b = basePos(P.side, P.idx);
    const bu = own(P.side, b.x);
    const ub = own(P.side, ball.x);
    const wob = Math.sin(P.ph + now / 700) * 1.1;
    if (P.gk) {
      const u = ub < 25 ? 2 : ub < 55 ? 4 : 9;
      return { x: fromOwn(P.side, u), y: Wd / 2 + (ball.y - Wd / 2) * (ub < 30 ? 0.3 : 0.12), v: 0.8 };
    }
    if (id === ball.owner) return { x: P.x + dirOf(P.side) * 2, y: P.y, v: 0.25 };
    if (pressers[0] === id) return { x: ball.x - dirOf(P.side) * 1.2, y: ball.y + (P.y > ball.y ? 0.9 : -0.9), v: 1 };
    if (pressers[1] === id) {
      const gx = fromOwn(P.side, 0);
      return { x: ball.x + (gx - ball.x) * 0.15, y: ball.y + (Wd / 2 - ball.y) * 0.25, v: 0.9 };
    }
    let u, y;
    if (P.side === poss) {
      u = bu + (ub - 35) * 0.55 + 4 + (surge === P.side ? 9 : 0);
      u = Math.min(u, Math.max(ub + 16, bu + 4), L - 7);
      y = b.y + (ball.y - Wd / 2) * 0.25;
    } else {
      u = bu + (ub - 55) * 0.5;
      u = Math.max(3, Math.min(u, ub + 10));
      y = b.y * 0.8 + (Wd / 2) * 0.2 + (ball.y - Wd / 2) * 0.4;
    }
    return { x: fromOwn(P.side, u) + wob, y: U.clamp(y + Math.cos(P.ph + now / 900), 1.5, Wd - 1.5), v: 0.75 };
  }

  function step(now, dt) {
    // acciones del minuto
    if (mode === 'play') {
      if (!act || now >= act.t0 + act.dur) {
        if (act && act.k === 'carry' && ball.owner && roles[ball.owner] && roles[ball.owner].run) delete roles[ball.owner];
        act = null;
        if (queue.length) startAction(queue.shift(), now);
      }
    } else if (mode === 'celebrate' && now >= modeUntil) {
      mode = 'reset';
      const conceding = celeb ? 1 - celeb.side : 0;
      ball.fly = null;
      placeKickoff(conceding);
      roles = {};
    } else if (mode === 'reset' && now >= holdUntil) {
      mode = 'play';
      celeb = null;
    }
    // presión: los dos rivales más cercanos a la pelota
    const pressers = [];
    if (mode === 'play') {
      const ds = 1 - poss;
      const list = ids(ds, true).map((id) => [id, Math.hypot(pl[id].x - ball.x, pl[id].y - ball.y)]).sort((a, b) => a[1] - b[1]);
      if (list[0]) pressers.push(list[0][0]);
      if (list[1]) pressers.push(list[1][0]);
    }
    const vm = vmax();
    for (const id in pl) {
      const P = pl[id];
      const T = shapeTarget(+id, P, now, pressers);
      P.tx = U.clamp(T.x, -1, L + 1); P.ty = U.clamp(T.y, -1, Wd + 2);
      const dx = P.tx - P.x, dy = P.ty - P.y;
      const dd = Math.hypot(dx, dy);
      if (dd > 0.01) {
        const stp = Math.min(dd, vm * (T.v || 1) * dt * Math.min(1, 0.35 + dd / 5));
        P.x += (dx / dd) * stp; P.y += (dy / dd) * stp;
      }
    }
    // pelota
    if (ball.fly) {
      const f = ball.fly;
      const t = U.clamp((now - f.t0) / f.dur, 0, 1);
      const e = f.kind === 'shot' ? t : 1 - (1 - t) * (1 - t);
      ball.x = f.fx + (f.tx - f.fx) * e;
      ball.y = f.fy + (f.ty - f.fy) * e;
      ball.z = f.h * 4 * t * (1 - t);
      if (t >= 1) { ball.fly = null; ball.z = 0; if (f.onEnd) f.onEnd(); }
    } else if (ball.owner && pl[ball.owner]) {
      const O = pl[ball.owner];
      const fx = O.x + dirOf(O.side) * 0.9, fy = O.y + 0.3;
      const k = Math.min(1, dt * 16);
      ball.x += (fx - ball.x) * k; ball.y += (fy - ball.y) * k;
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 340;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round((w * TH / TW) * dpr);
    scale = canvas.width / TW;
  }

  function draw(now) {
    const c = canvas.getContext('2d');
    const s = scale;
    const X = (x) => (x + M) * s, Y = (y) => (y + M) * s;
    // césped a franjas
    c.fillStyle = grassA;
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = grassB;
    for (let i = 0; i < 12; i += 2) c.fillRect(X((L / 12) * i), 0, (L / 12) * s, canvas.height);
    // líneas
    c.strokeStyle = 'rgba(255,255,255,0.6)';
    c.lineWidth = Math.max(1, s * 0.25);
    c.strokeRect(X(0), Y(0), L * s, Wd * s);
    c.beginPath(); c.moveTo(X(L / 2), Y(0)); c.lineTo(X(L / 2), Y(Wd)); c.stroke();
    c.beginPath(); c.arc(X(L / 2), Y(Wd / 2), 9.15 * s, 0, Math.PI * 2); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.beginPath(); c.arc(X(L / 2), Y(Wd / 2), s * 0.5, 0, Math.PI * 2); c.fill();
    for (const side of [0, 1]) {
      const x0 = side === 0 ? 0 : L;
      const d = side === 0 ? 1 : -1;
      c.strokeRect(X(Math.min(x0, x0 + d * 16.5)), Y(Wd / 2 - 20.15), 16.5 * s, 40.3 * s);
      c.strokeRect(X(Math.min(x0, x0 + d * 5.5)), Y(Wd / 2 - 9.15), 5.5 * s, 18.3 * s);
      c.beginPath(); c.arc(X(x0 + d * 11), Y(Wd / 2), s * 0.4, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(X(x0 + d * 11), Y(Wd / 2), 9.15 * s, d > 0 ? -0.93 : Math.PI - 0.93, d > 0 ? 0.93 : Math.PI + 0.93); c.stroke();
      // arco: la red se ilumina cuando entra la pelota
      c.save();
      const inNet = mode !== 'play' && celeb && celeb.side !== side && mode === 'celebrate';
      c.strokeStyle = 'rgba(255,255,255,0.9)';
      c.fillStyle = inNet ? 'rgba(255,227,107,0.45)' : 'rgba(255,255,255,0.12)';
      const gx = side === 0 ? X(-2) : X(L);
      c.fillRect(gx, Y(Wd / 2 - 3.66), 2 * s, 7.32 * s);
      c.strokeRect(gx, Y(Wd / 2 - 3.66), 2 * s, 7.32 * s);
      c.restore();
    }
    // estela de los pases y remates
    const life = Math.max(700, tickMs * 1.6);
    for (const t of trails) {
      const age = (now - t.t) / life;
      if (age >= 1) continue;
      c.save();
      c.globalAlpha = (1 - age) * (t.kind === 'shot' ? 0.9 : 0.6);
      c.strokeStyle = t.kind === 'shot' ? '#ffe36b' : t.kind === 'lost' ? '#ff8a7a' : '#ffffff';
      c.lineWidth = Math.max(1, s * (t.kind === 'shot' ? 0.45 : 0.28));
      c.setLineDash(t.kind === 'shot' ? [] : [s * 1.2, s * 1]);
      c.beginPath(); c.moveTo(X(t.x1), Y(t.y1)); c.lineTo(X(t.x2), Y(t.y2)); c.stroke();
      c.restore();
    }
    // jugadores
    const R = Math.max(7, s * 2.6);
    const list = Object.entries(pl).sort((a, b) => a[1].y - b[1].y);
    const carrier = ball.owner && !ball.fly ? String(ball.owner) : null;
    for (const [id, P] of list) {
      const kit = P.gk ? gkKits[P.side] : kits[P.side];
      const px = X(P.x), py = Y(P.y);
      c.save();
      c.beginPath(); c.arc(px + R * 0.15, py + R * 0.25, R, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fill();
      c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2); c.closePath();
      c.fillStyle = kit.fill; c.fill();
      c.clip();
      if (kit.stripe !== kit.fill) {
        c.fillStyle = kit.stripe;
        for (let k = -2; k <= 2; k += 2) c.fillRect(px + k * R * 0.42 - R * 0.17, py - R, R * 0.34, R * 2);
      }
      c.restore();
      c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2);
      c.lineWidth = id === carrier ? Math.max(2, R * 0.28) : Math.max(1, R * 0.14);
      c.strokeStyle = id === carrier ? '#ffe36b' : 'rgba(20,20,20,0.75)';
      c.stroke();
      // número con fondo para que se lea sobre las rayas
      c.font = `700 ${Math.round(R * 1.05)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = Math.max(2, R * 0.35);
      c.strokeStyle = 'rgba(255,255,255,0.95)';
      c.strokeText(String(P.num || ''), px, py + R * 0.05);
      c.fillStyle = '#111';
      c.fillText(String(P.num || ''), px, py + R * 0.05);
      // tarjetas
      const mk = marks.find((m) => m.pid === +id && m.until > now);
      if (mk) {
        c.fillStyle = mk.red ? '#d63a2f' : '#f2c200';
        c.fillRect(px + R * 0.6, py - R * 2.1, R * 0.8, R * 1.1);
      }
    }
    // nombre del que tiene la pelota (o del goleador mientras festeja)
    const tag = mode === 'celebrate' && celeb ? String(celeb.pid) : carrier;
    if (tag && pl[tag]) {
      const P = pl[tag];
      const txt = short(+tag);
      c.font = `700 ${Math.round(R * 0.95)}px 'Barlow', sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.lineWidth = Math.max(2, R * 0.3);
      c.strokeStyle = 'rgba(0,0,0,0.7)';
      c.strokeText(txt, X(P.x), Y(P.y) - R * 1.25);
      c.fillStyle = '#fff';
      c.fillText(txt, X(P.x), Y(P.y) - R * 1.25);
    }
    // pelota (con sombra; sube en los pases largos)
    const br = Math.max(2.6, R * 0.42) * (1 + ball.z * 0.08);
    const lift = ball.z * s * 0.9;
    c.beginPath(); c.arc(X(ball.x) + br * 0.3, Y(ball.y) + br * 0.4, Math.max(2, br * 0.9), 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,0.35)'; c.fill();
    c.beginPath(); c.arc(X(ball.x), Y(ball.y) - lift, br, 0, Math.PI * 2); c.fillStyle = '#ffffff'; c.fill();
    c.lineWidth = 1; c.strokeStyle = '#222'; c.stroke();
    // relato corto de la jugada
    if (caption && caption.until > now && !(overlay && overlay.until > now)) {
      const fs = Math.max(11, Math.round(canvas.height * 0.045));
      c.font = `600 ${fs}px 'Barlow', sans-serif`;
      const w = c.measureText(caption.text).width + fs * 1.2;
      c.globalAlpha = Math.min(1, (caption.until - now) / 250);
      c.fillStyle = 'rgba(8,14,22,0.7)';
      c.fillRect(fs * 0.4, canvas.height - fs * 2.1, w, fs * 1.6);
      c.fillStyle = '#fff';
      c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(caption.text, fs, canvas.height - fs * 1.3);
      c.globalAlpha = 1;
    }
    // cartel de gol / entretiempo
    if (overlay && overlay.until > now) {
      // franja arriba de la cancha para que se siga viendo la jugada y el festejo
      c.fillStyle = 'rgba(8,14,22,0.6)';
      c.fillRect(0, 0, canvas.width, canvas.height * 0.25);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = '#ffe36b';
      c.font = `700 ${Math.round(canvas.height * 0.12)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`;
      c.fillText(overlay.text, canvas.width / 2, canvas.height * (overlay.sub ? 0.09 : 0.125));
      if (overlay.sub) {
        c.fillStyle = '#fff';
        c.font = `600 ${Math.round(canvas.height * 0.055)}px 'Barlow', sans-serif`;
        c.fillText(overlay.sub, canvas.width / 2, canvas.height * 0.19);
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.1, (now - (last || now)) / 1000);
    last = now;
    step(now, dt);
    draw(now);
    raf = requestAnimationFrame(frame);
  }

  resize();
  kickoff(0);
  return {
    start() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } },
    stop() { if (raf) cancelAnimationFrame(raf); raf = null; },
    setTick(ms) { tickMs = ms; },
    minute,
    kickoff,
    resize,
    holding() { const t = performance.now(); return !!raf && (t < holdUntil || t < shotUntil); },
    banner(text, sub, ms) { overlay = { text, sub, until: performance.now() + (ms || 1800) }; },
  };
};

// ---- src/ui/match_ui.js ----
// Pantalla de partido: previa, partido en vivo con cancha animada y cambios, y resultado.
DT.MatchUI = (function () {
  const U = DT.U;
  const UI = DT.UI;
  const A = UI.A;
  const MU = {};
  // velocidad: valor guardado, nombre y milisegundos por minuto de juego
  const SPEEDS = [[1, 'Lento', 1700], [2, 'Normal', 950], [4, 'Rápido', 380]];
  const tickFor = (v) => (SPEEDS.find((s) => s[0] === v) || SPEEDS[2])[2];
  let sim = null, match = null, timer = null, side = 0, selOut = null, seen = 0, pitch = null, tab = 'feed', showLineups = false, started = false;

  const ov = () => document.getElementById('overlay');
  function show(html) {
    const el = ov();
    el.innerHTML = `<div class="wrap">${html}</div>`;
    el.hidden = false;
  }
  function hide() {
    if (pitch) { pitch.stop(); pitch = null; }
    const el = ov();
    el.hidden = true;
    el.innerHTML = '';
  }
  const $ = (id) => document.getElementById(id);
  window.addEventListener('resize', () => { if (pitch) pitch.resize(); });

  function oppPreview(team, opp, home) {
    const xi = DT.AI.pickXI(team);
    return DT.Match.preview(team, { f: team.tac.f, m: DT.AI.mentalityVs(team, opp, home), p: team.tac.p }, xi);
  }
  function compareBar(label, a, b) {
    const tot = Math.max(1, a + b);
    return `<div class="statline"><b class="tab-nums">${a}</b><div class="stack" style="gap:2px"><span class="tiny muted" style="text-align:center">${label}</span><div class="bars"><i style="width:${(a / tot) * 100}%"></i><i style="width:${(b / tot) * 100}%"></i></div></div><b class="tab-nums" style="text-align:right">${b}</b></div>`;
  }

  // ---------- previa ----------
  MU.open = function (m) {
    const G = DT.G;
    match = m;
    const me = DT.userTeam();
    side = m.h === me.id ? 0 : 1;
    if (me.autoXI || DT.AI.lineupIssues(me).length) DT.AI.autoLineup(me);
    const h = G.teams[m.h], a = G.teams[m.a];
    const ph = side === 0 ? DT.Match.preview(me) : oppPreview(h, a, true);
    const pa = side === 1 ? DT.Match.preview(me) : oppPreview(a, h, false);
    const comp = G.season.comps[m.c];
    const issues = DT.AI.lineupIssues(me);
    const warns = DT.AI.lineupWarnings(me);
    const derby = DT.isDerby(m.h, m.a);
    let tieInfo = '';
    if (m.tie && m.leg === 2) {
      const tie = G.season.ties[m.tie];
      const l1 = G.season.matches[tie.legs[0]];
      tieInfo = `<div class="small" style="text-align:center">Ida: ${G.teams[l1.h].s} ${l1.hg}-${l1.ag} ${G.teams[l1.a].s}. Si empatan en el global, penales.</div>`;
    } else if (m.tie && G.season.ties[m.tie].single) tieInfo = '<div class="small muted" style="text-align:center">Partido único: si empatan, penales.</div>';
    show(`
      <div class="row between"><span class="kicker">${U.esc(DT.S.matchLabel(m))}</span><button class="btn sm" data-a="mClose">Volver</button></div>
      ${derby ? `<div style="text-align:center"><span class="pill gold">${U.esc(derby)}</span></div>` : ''}
      <div class="matchup">
        <div class="t">${UI.badge(h, 'xl')}<b>${U.esc(h.n)}</b><span>${UI.formChips(h.form)}</span></div>
        <div class="vs">vs</div>
        <div class="t">${UI.badge(a, 'xl')}<b>${U.esc(a.n)}</b><span>${UI.formChips(a.form)}</span></div>
      </div>
      <div class="small muted" style="text-align:center">${U.esc(m.n ? (comp.venue || 'Cancha neutral') : h.stad)}</div>
      ${tieInfo}
      <section class="card">
        ${compareBar('Media', DT.AI.rating(h), DT.AI.rating(a))}
        ${compareBar('Ataque', ph.att, pa.att)}
        ${compareBar('Mediocampo', ph.mid, pa.mid)}
        ${compareBar('Defensa', ph.def, pa.def)}
      </section>
      <section class="card">
        <div class="row between"><b>Tu equipo: ${U.esc(me.tac.f)}</b><button class="btn sm" data-a="mEditXI">Editar once</button></div>
        ${issues.length ? `<div class="msg pending small" style="border-left-color:var(--loss)">${issues.map(U.esc).join(' ')}</div>` : ''}
        ${warns.length ? `<div class="msg pending small">${warns.map(U.esc).join('<br>')}</div>` : ''}
        <div class="small muted">${me.xi.map((id) => G.players[id]).filter(Boolean).map((p) => U.esc(p.n.split(' ').slice(-1)[0])).join(', ')}</div>
        <span class="up">Mentalidad</span>
        <div class="seg">${DT.MENTALITY.map((x, i) => `<button class="${me.tac.m === i ? 'on' : ''}" data-a="mMent" data-v="${i}">${['M. def', 'Def', 'Equil', 'Of', 'M. of'][i]}</button>`).join('')}</div>
        <span class="up">Presión</span>
        <div class="seg">${DT.PRESSURE.map((x, i) => `<button class="${me.tac.p === i ? 'on' : ''}" data-a="mPress" data-v="${i}">${x}</button>`).join('')}</div>
      </section>
      <button class="btn primary block big" data-a="mLive">Ir a la cancha</button>
      <button class="btn block" data-a="mQuick">Simular resultado</button>`);
  };
  A.mClose = () => { hide(); UI.render(); };
  A.mEditXI = () => { hide(); UI.tab = 'squad'; UI.sub.squad = 'xi'; UI.render(); };
  A.mMent = (d) => { DT.userTeam().tac.m = +d.v; MU.open(match); };
  A.mPress = (d) => { DT.userTeam().tac.p = +d.v; MU.open(match); };

  // Resultado directo, sin pantalla previa.
  MU.quick = function (m) {
    match = m;
    side = m.h === DT.G.user ? 0 : 1;
    const me = DT.userTeam();
    if (me.autoXI || DT.AI.lineupIssues(me).length) DT.AI.autoLineup(me);
    A.mQuick();
  };
  A.mQuick = () => {
    sim = DT.Match.create(match);
    sim.autoSubs = true;
    while (!sim.done) { DT.Match.step(sim); sim.paused = null; }
    finish();
  };

  // ---------- en vivo ----------
  A.mLive = () => {
    sim = DT.Match.create(match);
    sim.autoSubs = true; // activados por defecto; se pueden apagar en Cambios y táctica
    selOut = null;
    seen = 0;
    tab = 'feed';
    started = false;
    renderLive();
  };

  function play() {
    stop();
    const ms = tickFor(DT.G.settings.speed);
    if (pitch) pitch.setTick(ms);
    timer = setInterval(tick, ms);
    sim.running = true;
  }
  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    if (sim) sim.running = false;
  }
  function tick() {
    if (!sim) return stop();
    // durante el festejo de un gol el reloj espera a que se reacomoden para el saque
    if (pitch && pitch.holding()) return;
    const half = sim.half;
    DT.Match.step(sim);
    if (sim.done) {
      DT.Sound.whistle(3);
      stop();
      if (pitch) pitch.banner('FINAL', `${sim.s[0].goals} - ${sim.s[1].goals}`, 1600);
      updateLive();
      setTimeout(finish, 1300);
      return;
    }
    if (sim.half !== half) {
      DT.Sound.whistle(2);
      if (pitch) { pitch.kickoff(); pitch.banner('ENTRETIEMPO', `${sim.s[0].goals} - ${sim.s[1].goals}`, 2500); }
    } else if (pitch) pitch.minute();
    if (sim.paused) {
      stop();
      tab = 'subs';
    }
    // con la cancha a la vista, el gol se anota en el marcador cuando la pelota entra
    if (pitch && sim.last && sim.last.shot && sim.last.shot.goal) return;
    updateLive();
  }

  const WX_ICON = { Despejado: '☀', Nublado: '☁', 'Parcialmente nublado': '⛅', Lluvia: '☂', Llovizna: '☂' };
  function header() {
    const G = DT.G;
    const h = G.teams[match.h], a = G.teams[match.a];
    const min = sim.min > 90 ? `90+${sim.min - 90}'` : sim.half === 1 && sim.min > 45 ? `45+${sim.min - 45}'` : `${sim.min}'`;
    const w = sim.weather;
    const st = sim.done ? 'Final' : sim.paused === 'ht' ? 'Entretiempo' : min;
    return `<div class="mhead" id="mhead">
      <div class="mt">${UI.badge(h)}<b>${U.esc(h.n)}</b><span class="meta">${match.n ? 'Neutral' : 'Local'} · ${sim.s[0].tac.f}</span></div>
      <div class="mc"><div class="sc tab-nums">${sim.s[0].goals} – ${sim.s[1].goals}</div><div class="min">${st}</div></div>
      <div class="mt">${UI.badge(a)}<b>${U.esc(a.n)}</b><span class="meta">Visitante · ${sim.s[1].tac.f}</span></div>
      ${w ? `<div class="wx">${WX_ICON[w.sky] || ''} ${w.sky} · ${w.min}° a ${w.max}°</div>` : ''}
    </div>`;
  }
  function controls() {
    const sp = DT.G.settings.speed;
    const running = sim.running;
    const label = !started ? 'Empezar' : running ? 'Pausa' : sim.paused === 'ht' ? '2º tiempo' : 'Seguir';
    return `<div class="mctl">
      <button class="btn sm ${running ? '' : 'primary'}" data-a="mToggle">${running ? '❚❚' : '▶'} ${label}</button>
      <div class="seg sm">${SPEEDS.map(([v, l]) => `<button class="${(sp === v || (v === 4 && sp === 8)) ? 'on' : ''}" data-a="mSpeed" data-v="${v}">${l}</button>`).join('')}</div>
      <button class="btn sm ${DT.G.settings.sound !== false ? 'gold' : ''}" data-a="mSound">${DT.G.settings.sound !== false ? '✓ ' : ''}Sonido</button>
      <button class="btn sm" data-a="mLineups">${showLineups ? '▴ Ocultar planteo' : '▾ Ver planteo'}</button>
    </div>`;
  }
  function note() {
    if (sim.paused === 'ht') return '<div class="msg pending small">Entretiempo. Hacé cambios o ajustá la táctica antes del segundo tiempo.</div>';
    if (sim.paused === 'inj' && sim.injuredPid) return `<div class="msg pending small">${U.esc(DT.G.players[sim.injuredPid].n)} se lesionó. Elegí un reemplazo en Cambios.</div>`;
    return '';
  }
  function lineups() {
    if (!showLineups) return '';
    const G = DT.G;
    const col = (i) => {
      const s = sim.s[i];
      const t = G.teams[s.tid];
      return `<div class="stack" style="gap:2px;min-width:0"><b class="small">${U.esc(t.s)} · ${s.tac.f}</b>${s.on.map((x) => {
        const p = G.players[x.id];
        return `<div class="tiny row" style="gap:6px"><b class="tab-nums" style="min-width:18px;text-align:right">${p.num || ''}</b><span class="ellipsis">${U.esc(p.n)}</span></div>`;
      }).join('')}</div>`;
    };
    return `<section class="card"><div class="grid2">${col(0)}${col(1)}</div></section>`;
  }
  function stats() {
    const s0 = sim.s[0], s1 = sim.s[1];
    const pt = Math.max(1, s0.poss + s1.poss);
    const p0 = Math.round((s0.poss / pt) * 100);
    const line = (l, a, b, pa, pb) => `<div class="statline"><b class="tab-nums">${a}</b><div class="stack" style="gap:2px"><span class="tiny muted" style="text-align:center">${l}</span><div class="bars"><i style="width:${pa}%"></i><i style="width:${pb}%"></i></div></div><b class="tab-nums" style="text-align:right">${b}</b></div>`;
    const sh = Math.max(1, s0.shots + s1.shots), so = Math.max(1, s0.sot + s1.sot), ye = Math.max(1, s0.yel + s1.yel);
    return line('Posesión', p0 + '%', 100 - p0 + '%', p0, 100 - p0) + line('Remates', s0.shots, s1.shots, (s0.shots / sh) * 100, (s1.shots / sh) * 100) + line('Al arco', s0.sot, s1.sot, (s0.sot / so) * 100, (s1.sot / so) * 100) + line('Amarillas', s0.yel, s1.yel, (s0.yel / ye) * 100, (s1.yel / ye) * 100);
  }
  function feed() {
    const evs = sim.events.slice().reverse().slice(0, 40);
    const fresh = sim.events.length - seen;
    seen = sim.events.length;
    return evs.map((e, i) => {
      const ic = e.type === 'yellow' ? '<span class="ic yellow"></span>' : e.type === 'red' ? '<span class="ic red"></span>' : '';
      const team = e.side >= 0 ? DT.G.teams[sim.s[e.side].tid].s : '';
      return `<div class="ev ${e.type} ${i < fresh ? 'new' : ''}"><span class="m">${e.m}'</span>${ic}<span class="grow">${team ? `<b class="tiny muted">${U.esc(team)}</b> ` : ''}${U.esc(e.text)}</span></div>`;
    }).join('') || '<div class="small muted">Tocá Empezar para que ruede la pelota.</div>';
  }
  function subsPanel() {
    const G = DT.G;
    const s = sim.s[side];
    const slotOrder = (x) => 'PDMA'.indexOf(x.slot);
    const onList = s.on.slice().sort((a, b) => slotOrder(a) - slotOrder(b));
    const on = UI.grouped(onList, (x) => {
      const p = G.players[x.id];
      return `<div class="li ${selOut === x.id ? 'sel' : ''}" data-a="mSelOut" data-id="${x.id}"><span class="pos ${x.slot}">${U.posName[x.slot]}</span><div class="name">${p.num ? `<span class="muted tab-nums">${p.num}</span> ` : ''}${U.esc(p.n)}${p.inj > 0 ? ' <span class="pill bad">Lesionado</span>' : ''}${s.cards && s.cards[x.id] ? ' <span class="pill warn">Amonestado</span>' : ''}<div class="sub">Nota ${(s.rating[x.id] || 6).toFixed(1)}</div></div>${UI.fitBar(p.fit)}<span class="ovr">${p.ovr}</span></div>`;
    }, (x) => x.slot);
    const benchPs = s.bench.map((id) => G.players[id]).filter(Boolean).sort(UI.byPos);
    const bench = UI.grouped(benchPs, (p) => `<div class="li" data-a="mSelIn" data-id="${p.id}">${UI.pos(p)}<div class="name">${U.esc(p.n)}</div>${UI.fitBar(p.fit)}<span class="ovr">${p.ovr}</span></div>`);
    return `<div class="row between"><h3>Cambios</h3><span class="pill">${5 - s.subs} disponibles</span></div>
      <div class="small muted">${selOut ? 'Ahora tocá el suplente que entra.' : 'Tocá el jugador que sale y después el que entra. Conviene pausar antes.'}</div>
      <div class="list">${on}</div>
      <div class="up">Banco</div><div class="list">${bench || '<div class="small muted">Sin suplentes.</div>'}</div>
      <span class="up">Mentalidad</span>
      <div class="seg">${DT.MENTALITY.map((x, i) => `<button class="${s.tac.m === i ? 'on' : ''}" data-a="mLiveMent" data-v="${i}">${['M. def', 'Def', 'Equil', 'Of', 'M. of'][i]}</button>`).join('')}</div>
      <span class="up">Presión</span>
      <div class="seg">${DT.PRESSURE.map((x, i) => `<button class="${s.tac.p === i ? 'on' : ''}" data-a="mLivePress" data-v="${i}">${x}</button>`).join('')}</div>
      <label class="toggle small"><input type="checkbox" id="autosubs" data-c="mAutoSubs" ${sim.autoSubs ? 'checked' : ''}> Cambios automáticos por cansancio</label>`;
  }
  function tabBody() {
    if (tab === 'stats') return stats();
    if (tab === 'subs') return subsPanel();
    return `<div class="feed">${feed()}</div>`;
  }
  function tabs() {
    return `<div class="seg" id="mtabs">${[['feed', 'Relato'], ['stats', 'Estadísticas'], ['subs', 'Cambios y táctica']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="mTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  }
  function renderLive() {
    show(`<div class="live"><div class="live-main">
      <span class="kicker">${U.esc(DT.S.matchLabel(match))}${sim.derby ? ` · ${U.esc(sim.derby)}` : ''}</span>
      ${header()}
      <div class="pitchwrap"><canvas id="pitchcv" aria-label="Cancha con la posición de los jugadores y la pelota"></canvas></div>
      <div id="ctl">${controls()}</div>
      <div id="note">${note()}</div>
      </div><div class="live-side">
      <div id="lineups">${lineups()}</div>
      <div id="tabswrap">${tabs()}</div>
      <section class="card" id="mtab">${tabBody()}</section>
      <button class="btn block" data-a="mEnd">Ir al final</button>
      </div></div>`);
    if (pitch) pitch.stop();
    pitch = DT.Pitch($('pitchcv'), sim, { onGoal: () => updateLive() });
    pitch.setTick(tickFor(DT.G.settings.speed));
    pitch.start();
  }
  function updateLive(full) {
    if (!$('mhead')) return;
    $('mhead').outerHTML = header();
    $('ctl').innerHTML = controls();
    $('note').innerHTML = note();
    $('tabswrap').innerHTML = tabs();
    if (full || tab === 'stats' || (tab === 'feed' && sim.events.length !== seen) || (tab === 'subs' && (sim.paused || !sim.running))) $('mtab').innerHTML = tabBody();
  }

  A.mTab = (d) => { tab = d.v; updateLive(true); };
  A.mLineups = () => { showLineups = !showLineups; $('lineups').innerHTML = lineups(); $('ctl').innerHTML = controls(); };
  A.mSound = () => { DT.G.settings.sound = DT.G.settings.sound === false; DT.Sound.unlock(); $('ctl').innerHTML = controls(); };
  A.mToggle = () => {
    DT.Sound.unlock();
    if (sim.running) { stop(); updateLive(true); return; }
    if (!started) { started = true; DT.Sound.whistle(1); }
    // al reanudar, si quedó un lesionado en cancha, entra el mejor suplente
    if (sim.paused === 'inj' && sim.injuredPid) {
      const s = sim.s[side];
      const x = s.on.find((o) => o.id === sim.injuredPid);
      if (x) {
        const repl = DT.Match.bestBenchFor(sim, side, x.slot);
        if (repl && s.subs < 5) DT.Match.sub(sim, side, x.id, repl);
        else { s.on = s.on.filter((o) => o.id !== x.id); s.out.push(x.id); }
      }
    }
    if (sim.paused === 'ht') DT.Sound.whistle(1);
    sim.paused = null;
    sim.injuredPid = null;
    if (tab === 'subs') tab = 'feed';
    play();
    updateLive(true);
  };
  A.mSpeed = (d) => {
    DT.G.settings.speed = +d.v;
    if (sim.running) play();
    else if (pitch) pitch.setTick(tickFor(+d.v));
    $('ctl').innerHTML = controls();
  };
  A.mEnd = () => {
    stop();
    sim.autoSubs = true;
    while (!sim.done) { DT.Match.step(sim); sim.paused = null; }
    finish();
  };
  A.mSelOut = (d) => { selOut = +d.id; $('mtab').innerHTML = tabBody(); };
  A.mSelIn = (d) => {
    if (!selOut) { UI.toast('Primero tocá el jugador que sale.'); return; }
    const s = sim.s[side];
    if (s.subs >= 5) { UI.toast('Ya hiciste los 5 cambios.'); return; }
    const outId = selOut;
    if (DT.Match.sub(sim, side, outId, +d.id)) {
      if (sim.injuredPid === outId) sim.injuredPid = null;
      selOut = null;
      updateLive(true);
    }
  };
  A.mLiveMent = (d) => { sim.s[side].tac.m = +d.v; $('mtab').innerHTML = tabBody(); };
  A.mLivePress = (d) => { sim.s[side].tac.p = +d.v; $('mtab').innerHTML = tabBody(); };
  A.mAutoSubs = (d, el) => { sim.autoSubs = el.checked; };

  // ---------- final ----------
  function finish() {
    const G = DT.G;
    if (!sim) return;
    stop();
    if (pitch) { pitch.stop(); pitch = null; }
    if (DT.S.needsPens(match, sim.s[0].goals, sim.s[1].goals)) DT.Match.penalties(sim);
    DT.Match.apply(sim);
    DT.S.record(match, sim);
    const slotW = G.week, slotS = G.slot;
    DT.S.afterUserMatch();
    const h = G.teams[match.h], a = G.teams[match.a];
    const s = sim.s[side];
    const mine = s.goals, theirs = sim.s[1 - side].goals;
    let res = mine > theirs ? 'Victoria' : mine < theirs ? 'Derrota' : 'Empate';
    if (sim.pens) res = sim.pens[side] > sim.pens[1 - side] ? 'Clasificado por penales' : 'Eliminado por penales';
    const tie = match.tie ? G.season.ties[match.tie] : null;
    if (tie && tie.winner && !sim.pens) res += tie.winner === G.user ? ' · ¡Avanzás de ronda!' : (tie.single || match.leg === 2 ? ' · Eliminado' : '');
    const scorers = (sim.scorers || []).map((x) => `<div class="small">${x.m}' ${U.esc(G.players[x.pid] ? G.players[x.pid].n : '')} <span class="muted">(${U.esc(G.teams[sim.s[x.side].tid].s)})</span></div>`).join('');
    const pens = sim.pens ? `<div class="small"><b>Penales ${sim.pens[0]}-${sim.pens[1]}</b>: ${sim.pensLog.map((k) => `${k.ok ? '✓' : '✗'} ${U.esc(k.n.split(' ').slice(-1)[0])}`).join(', ')}</div>` : '';
    const ratings = [...s.played].map((pid) => ({ p: G.players[pid], r: s.rating[pid] || 6 })).filter((x) => x.p).sort((x, y) => 'PDMA'.indexOf(x.p.pos) - 'PDMA'.indexOf(y.p.pos) || y.r - x.r);
    const others = DT.S.slotMatches(slotW, slotS).filter((m) => m.c === match.c && m.i !== match.i && m.p).slice(0, 15);
    const mvp = match.mvp && G.players[match.mvp];
    show(`<span class="kicker">${U.esc(DT.S.matchLabel(match))}</span>
      <div class="scoreboard"><div class="t">${UI.badge(h, 'l')}<b>${U.esc(h.s)}</b></div><div><div class="sc tab-nums">${sim.s[0].goals} - ${sim.s[1].goals}</div><div class="min">Final</div></div><div class="t">${UI.badge(a, 'l')}<b>${U.esc(a.s)}</b></div></div>
      <h2 style="text-align:center;color:${res.startsWith('Victoria') || res.startsWith('Clasificado') ? 'var(--win)' : res.startsWith('Derrota') || res.startsWith('Eliminado') ? 'var(--loss)' : 'var(--ink)'}">${res}</h2>
      <section class="card">${scorers || '<div class="small muted">Sin goles.</div>'}${pens}${mvp ? `<div class="small">Figura: <b>${U.esc(mvp.n)}</b></div>` : ''}${match.att ? `<div class="small muted">Público: ${U.num(match.att)}${match.h === G.user && !match.n ? ` · recaudación ${U.money(match.att * h.ticket * 0.65)}` : ''}</div>` : ''}</section>
      <section class="card"><h3>Notas de tu equipo</h3><div class="list">${UI.grouped(ratings, (x) => `<div class="li" data-a="player" data-id="${x.p.id}">${UI.pos(x.p)}<div class="name">${U.esc(x.p.n)}</div>${UI.fitBar(x.p.fit)}<span class="ovr" style="color:${x.r >= 7.5 ? 'var(--win)' : x.r < 5.5 ? 'var(--loss)' : 'inherit'}">${x.r.toFixed(1)}</span></div>`, (x) => x.p.pos)}</div></section>
      ${others.length ? `<div class="others"><button class="linkbtn" data-a="mOthers" aria-expanded="false">Otros resultados (${others.length}) ▾</button><section class="card" id="others" hidden><div class="list">${others.map(DT.Screens.resultRow).join('')}</div></section></div>` : ''}
      <button class="btn primary block big" data-a="mDone">Continuar</button>`);
    ov().scrollTop = 0;
    sim = null;
    DT.Main.autosave();
  }
  A.mOthers = (d, el) => {
    const box = $('others');
    if (!box) return;
    box.hidden = !box.hidden;
    el.setAttribute('aria-expanded', String(!box.hidden));
    el.textContent = el.textContent.replace(/[▾▴]/, box.hidden ? '▾' : '▴');
  };
  A.mDone = () => {
    hide();
    UI.render();
    window.scrollTo(0, 0);
  };

  return MU;
})();

// ---- src/ui/main.js ----
// Arranque, pantalla inicial, avance del juego y guardado automático.
DT.Main = (function () {
  const U = DT.U;
  const UI = DT.UI;
  const A = UI.A;
  const Main = { downloads: null };
  let saveCount = 0;
  const start = { step: 1, cc: 'ARG', name: '', team: null, diff: 'arcade' };
  const DIFFS = [
    ['arcade', 'Arcade', 'Elegís cualquier club, de los grandes a los chicos.'],
    ['real', 'Realista', 'Arrancás en un club modesto y hacés carrera hasta llegar a los grandes.'],
  ];
  // Clubes para empezar: en modo realista solo la segunda división y los más modestos de primera.
  Main.startClubs = function (cc, diff) {
    const C = DT.COUNTRIES[cc];
    const mk = (r, div) => ({ code: r[0], n: r[1], s: r[2], stad: r[3], cap: r[4], rep: r[5], c1: r[6], c2: r[7], div, id: cc + '_' + r[0], cc });
    const first = DT.TEAMS[cc].map((r) => mk(r, 1)).sort((a, b) => b.rep - a.rep);
    const second = ((DT.TEAMS2 || {})[cc] || []).map((r) => mk(r, 2)).sort((a, b) => b.rep - a.rep);
    if (diff === 'real') {
      const k = Math.ceil(first.length * (second.length ? 0.2 : 0.3));
      const cut = first[first.length - k].rep;
      first.forEach((x) => (x.ok = x.rep <= cut));
      second.forEach((x) => (x.ok = true));
    } else first.concat(second).forEach((x) => (x.ok = true));
    return { first, second, C };
  };

  Main.autosave = async function (force) {
    if (!DT.G) return false;
    const ok = await DT.Save.local();
    saveCount++;
    if (DT.Save.cloud.ready && (force || saveCount % 4 === 0)) DT.Save.cloudSave();
    return ok;
  };

  Main.afterLoad = function () {
    // partidas guardadas con versiones anteriores
    const ut = DT.userTeam();
    if (ut.capBase === undefined) DT.E.resetCap(ut);
    if (DT.G.settings.speed === 8) DT.G.settings.speed = 4;
    UI.tab = 'home';
    UI.compSel = null;
    UI.compCountry = null;
    UI.closeModal();
    document.getElementById('overlay').hidden = true;
    if (DT.G.pendingOffers) Main.showJobs();
    UI.render();
  };

  // ---------- pantalla inicial ----------
  Main.showStart = async function (fresh) {
    DT.G = null;
    document.getElementById('tabs').hidden = true;
    document.getElementById('cta').innerHTML = '';
    document.getElementById('top').innerHTML = '';
    const meta = fresh ? null : DT.Save.localMeta();
    const cloudMeta = fresh ? null : await DT.Save.cloudMeta();
    start.step = 1;
    renderStart(meta, cloudMeta);
  };

  function renderStart(meta, cloudMeta) {
    const main = document.getElementById('main');
    if (start.step === 1) {
      main.innerHTML = `
        <div class="hero">
          <svg class="trophy" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M20 8h24v14a12 12 0 0 1-24 0z"/><path d="M20 12h-8a8 8 0 0 0 10 12M44 12h8a8 8 0 0 1-10 12"/><path d="M32 34v10M24 56h16M26 44h12v12H26z"/></svg>
          <h1>DT <span>Sudamericano</span></h1>
          <div class="muted">Dirigí a tu club en las 10 ligas de Sudamérica, la Libertadores y la Sudamericana.</div>
          ${UI.layoutSwitch()}
        </div>
        ${meta ? `<section class="card"><span class="up">Partida guardada</span><div><b>${U.esc(meta.team)}</b> · ${U.esc(meta.mgr)} · temporada ${meta.year}, semana ${meta.week}</div><button class="btn primary block big" data-a="loadLocal">Continuar partida</button></section>` : ''}
        ${cloudMeta && (!meta || cloudMeta.at > meta.at) ? `<section class="card"><span class="up">En tu cuenta</span><div><b>${U.esc(cloudMeta.team)}</b> · temporada ${cloudMeta.year}, semana ${cloudMeta.week}</div><button class="btn block" data-a="loadCloud">Cargar desde la nube</button></section>` : ''}
        <section class="card">
          <h2>Nueva partida</h2>
          <label class="small" for="mgrname">Tu nombre de entrenador</label>
          <input type="text" id="mgrname" maxlength="30" placeholder="Ej: Marcelo Gallardo" value="${U.esc(start.name)}">
          <span class="up">Dificultad</span>
          <div class="diffpick">${DIFFS.map(([k, l, d]) => `<button class="${start.diff === k ? 'on' : ''}" data-a="stDiff" data-v="${k}" aria-pressed="${start.diff === k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>
          <span class="up">Elegí el país</span>
          <div class="chips" style="flex-wrap:wrap">${DT.COUNTRY_ORDER.map((cc) => `<button class="chip ${start.cc === cc ? 'on' : ''}" data-a="stCountry" data-cc="${cc}">${DT.COUNTRIES[cc].flag} ${DT.COUNTRIES[cc].name}</button>`).join('')}</div>
          <button class="btn primary block" data-a="stNext">Elegir club</button>
        </section>
        <section class="card flat small muted">Tu partida se guarda sola en este dispositivo. Desde Club → Partida podés exportarla como copia de seguridad.</section>`;
      return;
    }
    const { first, second, C } = Main.startClubs(start.cc, start.diff);
    const real = start.diff === 'real';
    const diff = (r) => (r.div === 2 ? ['Ascenso', ''] : r.rep >= 85 ? ['Grande', 'gold'] : r.rep >= 74 ? ['Competitivo', 'ok'] : r.rep >= 64 ? ['Medio', ''] : ['Chico: difícil', 'warn']);
    const list = (rows) => rows.filter((r) => r.ok).map((r) => {
      const [lbl, cls] = diff(r);
      return `<div class="li" data-a="stPick" data-code="${r.code}">${UI.badge(r)}<div class="name">${U.esc(r.n)}<div class="sub">${U.esc(r.stad)} · ${U.num(r.cap)}</div></div><span class="pill ${cls}">${lbl}</span></div>`;
    }).join('');
    const block = (title, rows, note) => (rows.some((r) => r.ok) ? `<section class="card"><h3>${U.esc(title)}</h3>${note ? `<div class="small muted">${note}</div>` : ''}<div class="list">${list(rows)}</div></section>` : '');
    main.innerHTML = `
      <div class="row between"><button class="btn sm" data-a="stBack">◀ Volver</button><h2>${C.flag} ${U.esc(C.name)}</h2></div>
      <div class="small muted">${real ? 'Modo realista: solo podés arrancar en clubes modestos. Con buenas campañas te van a llamar clubes más grandes.' : 'Los clubes grandes tienen más plata y planteles fuertes, pero la directiva exige títulos. Los chicos son un desafío financiero.'}</div>
      ${block(C.league, first, real ? 'Los más modestos de primera: pelean por no descender.' : '')}
      ${C.div2 ? block(C.div2.name, second, `Segunda división: suben los ${C.rel} primeros.`) : ''}`;
  }
  // vuelve a dibujar la pantalla inicial (al cambiar entre modo celular y ordenador)
  Main.refreshStart = async function () {
    if (start.step === 1) renderStart(DT.Save.localMeta(), DT.Save.cloud.ready ? await DT.Save.cloudMeta() : null);
    else renderStart();
  };
  A.stCountry = (d) => {
    start.name = (document.getElementById('mgrname') || {}).value || start.name;
    start.cc = d.cc;
    renderStart(DT.Save.localMeta(), null);
  };
  A.stNext = () => {
    start.name = (document.getElementById('mgrname') || {}).value || '';
    start.step = 2;
    renderStart();
    window.scrollTo(0, 0);
  };
  A.stDiff = (d) => {
    start.name = (document.getElementById('mgrname') || {}).value || start.name;
    start.diff = d.v === 'real' ? 'real' : 'arcade';
    renderStart(DT.Save.localMeta(), null);
  };
  A.stBack = () => { start.step = 1; renderStart(DT.Save.localMeta(), null); };
  A.stPick = (d) => {
    const name = (start.name || '').trim() || 'El Profe';
    DT.W.newGame(start.cc + '_' + d.code, name, start.diff);
    UI.tab = 'home';
    Main.autosave(true);
    UI.render();
    window.scrollTo(0, 0);
  };
  A.loadLocal = async () => {
    try {
      const ok = await DT.Save.loadLocal();
      if (!ok) { UI.toast('No se encontró la partida.'); return; }
      Main.afterLoad();
    } catch (e) {
      UI.toast('La partida guardada está dañada. Empezá una nueva o importá una copia.');
    }
  };
  A.loadCloud = async () => {
    const ok = await DT.Save.cloudLoad();
    if (!ok) { UI.toast('No se pudo cargar desde la nube.'); return; }
    Main.afterLoad();
  };

  // ---------- avance ----------
  A.advance = () => {
    if (UI.busy) return;
    const G = DT.G;
    const um = DT.S.userMatchNow();
    if (um) { DT.MatchUI.open(um); return; }
    UI.busy = true;
    let ev;
    try {
      ev = DT.S.advance();
    } finally {
      UI.busy = false;
    }
    if (ev.type === 'match') {
      UI.render();
      DT.MatchUI.open(ev.match);
    } else if (ev.type === 'seasonEnd') {
      Main.autosave(true);
      Main.showSeasonSummary(G.history[0]);
      UI.render();
    } else if (ev.type === 'jobs') {
      Main.showJobs();
      UI.render();
    } else {
      if (ev.type === 'inbox') {
        UI.tab = 'home';
        UI.toast('Tenés decisiones pendientes.');
      }
      Main.autosave();
      UI.render();
    }
  };

  Main.showSeasonSummary = function (h) {
    const G = DT.G;
    const t = DT.userTeam();
    const cc = t.cc;
    const names = { LIB: 'Copa Libertadores', SUD: 'Copa Sudamericana', REC: 'Recopa', INT: 'Intercontinental' };
    const myTitles = G.manager.titles.filter((x) => x.y === h.y);
    UI.modal(`<span class="kicker">Fin de temporada ${h.y}</span>
      <h2>${myTitles.length ? `¡${myTitles.length} ${myTitles.length === 1 ? 'título' : 'títulos'} para ${U.esc(h.user.team)}!` : `${U.esc(h.user.team)} terminó ${h.user.pos}º${h.user.div ? ` en ${U.esc(h.user.div)}` : ''}`}</h2>
      ${myTitles.length ? `<div class="stack">${myTitles.map((x) => `<span class="pill gold">${U.esc(x.c)}</span>`).join('')}</div>` : ''}
      <section class="card">
        ${Object.keys(names).filter((k) => h.champs[k]).map((k) => `<div class="row between small"><span class="muted">${names[k]}</span><b>${U.esc(h.champs[k][1])}</b></div>`).join('')}
        ${h.champs['L_' + cc] ? `<div class="row between small"><span class="muted">${U.esc(DT.COUNTRIES[cc].league)}</span><b>${U.esc(h.champs['L_' + cc][1])}</b></div>` : ''}
        ${h.champs['B_' + cc] ? `<div class="row between small"><span class="muted">${U.esc(DT.COUNTRIES[cc].div2.name)}</span><b>${U.esc(h.champs['B_' + cc][1])}</b></div>` : ''}
        ${h.champs['C_' + cc] ? `<div class="row between small"><span class="muted">${U.esc(DT.COUNTRIES[cc].cup)}</span><b>${U.esc(h.champs['C_' + cc][1])}</b></div>` : ''}
        ${h.scorers[cc] && h.scorers[cc][0] ? `<div class="row between small"><span class="muted">Goleador</span><b>${U.esc(h.scorers[cc][0][0])} (${h.scorers[cc][0][2]})</b></div>` : ''}
        ${h.champs['REL_' + cc] ? `<div class="small muted">Descienden: ${h.champs['REL_' + cc].map(U.esc).join(', ')}. Ascienden: ${(h.champs['UP_' + cc] || []).map(U.esc).join(', ')}.</div>` : ''}
      </section>
      <div class="small">Arranca la temporada ${G.year}: revisá los mensajes (sponsor, juveniles y contratos) y el mercado de pases.</div>
      <button class="btn primary block" data-a="closeModal">Seguir</button>`);
  };

  Main.showJobs = function () {
    const G = DT.G;
    const po = G.pendingOffers;
    if (!po) return;
    UI.modal(`<h2>Te quedaste sin club</h2><div class="small">${U.esc(po.reason)}</div><div class="small muted">Elegí tu próximo desafío:</div>
      <div class="list">${po.offers.map((id) => {
        const t = G.teams[id];
        return `<div class="li" data-a="takeJob" data-id="${id}">${UI.badge(t)}<div class="name">${U.esc(t.n)}<div class="sub">${DT.COUNTRIES[t.cc].flag} ${U.esc(DT.COUNTRIES[t.cc].league)} · media ${DT.AI.rating(t)}</div></div><span class="btn sm primary">Aceptar</span></div>`;
      }).join('')}</div>`);
    // el modal de ofertas no se puede cerrar sin elegir
    const close = document.querySelector('#modal .close');
    if (close) close.remove();
  };
  A.takeJob = (d) => {
    DT.Board.takeJob(d.id);
    UI.closeModal();
    UI.tab = 'home';
    UI.compSel = null;
    Main.autosave(true);
    UI.render();
    UI.toast(`Nuevo desafío: ${DT.userTeam().n}.`);
  };

  // ---------- arranque ----------
  Main.boot = async function (hotData) {
    UI.loadLayout();
    UI.bind();
    // capacidades opcionales del visor (nube y descargas)
    const capInit = (async () => {
      try {
        if (window.claude && window.claude.use) {
          await DT.Save.initCloud();
          Main.downloads = await window.claude.use('downloads');
        }
      } catch (e) { /* sin capacidades: se usa solo el guardado local */ }
    })();
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(() => ({ json: DT.G ? DT.Save.toJSON() : null }));
    }
    if (hotData && hotData.json) {
      try {
        DT.Save.deserialize(JSON.parse(hotData.json));
        Main.afterLoad();
        return;
      } catch (e) { /* sigue al inicio normal */ }
    }
    await Main.showStart(false);
    capInit.then(async () => {
      if (!DT.G && DT.Save.cloud.ready) {
        const cm = await DT.Save.cloudMeta();
        if (cm) renderStart(DT.Save.localMeta(), cm);
      }
    });
  };

  return Main;
})();

(function () {
  const go = (data) => DT.Main.boot(data || {});
  const hot = typeof window !== 'undefined' && window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(go);
  else go(hot && hot.data);
})();

</script>

      body: `La directiva de ${t.n} espera: ${G.manager.obj.text} El plantel es el ${G.manager.obj.rank}º más fuerte de la liga.`,
      kind: 'board',
    });
    const offers = DT.E.sponsorOffers(t);
    DT.inbox({
      title: 'Elegí el sponsor principal',
      body: 'Tres marcas quieren estar en la camiseta esta temporada. Si no elegís, la directiva firma la primera.',
      kind: 'money',
      actions: offers.map((o, i) => ({ id: 'sponsor', i, label: `${o.name}: ${U.money(o.amt)}${o.bonus ? ` + ${U.money(o.bonus)} ${o.kind === 'titulos' ? 'por título' : 'por objetivo'}` : ''}`, sub: o.txt })),
      data: { offers },
    });
    t.sponsor = Object.assign({}, offers[0]);
  };

  B.expected = function (match) {
    const G = DT.G;
    const me = DT.userTeam();
    const opp = G.teams[match.h === me.id ? match.a : match.h];
    const home = !match.n && match.h === me.id ? 1.5 : !match.n ? -1.5 : 0;
    return U.clamp(0.5 + (DT.AI.rating(me) - DT.AI.rating(opp) + home) * 0.045, 0.08, 0.92);
  };

  B.afterMatch = function (match) {
    const G = DT.G;
    const me = G.user;
    const mine = match.h === me ? match.hg : match.ag;
    const theirs = match.h === me ? match.ag : match.hg;
    const res = mine > theirs ? 1 : mine < theirs ? 0 : 0.5;
    const M = G.manager;
    M.pj++;
    if (res === 1) M.g++; else if (res === 0) M.p++; else M.e++;
    const exp = B.expected(match);
    const derby = DT.isDerby(match.h, match.a);
    M.conf = U.clamp(M.conf + (res - exp) * 7 * (derby ? 1.6 : 1), 0, 100);
    const opp = G.teams[match.h === me ? match.a : match.h];
    G.lastResult = { res, derby, opp: opp.n, mine, theirs, w: G.week, y: G.year };
    if (derby) {
      // los clásicos pegan fuerte en el ánimo del plantel
      const d = res === 1 ? 5 : res === 0 ? -5 : 0;
      for (const pid of DT.userTeam().squad) { const p = G.players[pid]; p.mor = U.clamp(p.mor + d, 10, 100); }
    }
  };

  // Pedido de ampliación del tope salarial.
  B.askCapRaise = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const M = G.manager;
    t.capAsks = t.capAsks || 0;
    if (t.capAsks >= 2) return { ok: false, msg: 'La directiva ya escuchó dos pedidos esta temporada. Volvé a intentarlo el año que viene.' };
    t.capAsks++;
    const rev = DT.E.estimateRevenue(t);
    if (t.cash < -rev * 0.1) return { ok: false, msg: 'Con la caja en rojo, la directiva rechaza subir el tope. Primero hay que vender o recortar.' };
    if (M.conf >= 70 || (t.cash > rev * 0.4 && M.conf >= 45)) {
      t.capBonus = (t.capBonus || 0) + 0.12;
      return { ok: true, msg: `Aprobado: el tope sube 12% (${U.money(DT.E.wageCap(t))} anuales). La directiva confía en vos.` };
    }
    if (M.conf >= 40) {
      t.capBonus = (t.capBonus || 0) + 0.06;
      M.conf = Math.max(0, M.conf - 4);
      return { ok: true, msg: `Aprobado a regañadientes: el tope sube 6% (${U.money(DT.E.wageCap(t))}), pero la directiva espera resultados.` };
    }
    return { ok: false, msg: 'Rechazado: la directiva no confía lo suficiente en tu gestión para gastar más en sueldos.' };
  };

  B.weekly = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const M = G.manager;
    const rev = DT.E.estimateRevenue(t);
    if (t.cash < -rev * 0.25) {
      M.conf -= 1.5;
      if (G.week % 6 === 0) DT.inbox({ title: 'Alarma financiera', body: `La deuda del club es preocupante (${U.money(t.cash)}). La directiva exige vender o recortar gastos. Mientras haya saldo negativo grande, no se aprueban compras.`, kind: 'board' });
    } else if (t.cash < 0) {
      M.conf -= 0.5;
    }
    if (DT.E.payroll(t) > DT.E.wageCap(t) * 1.1) M.conf -= 0.4;
    M.conf = U.clamp(M.conf, 0, 100);
    if (G.week === 20) {
      DT.inbox({ title: 'Mitad de temporada', body: `La directiva evalúa tu trabajo: confianza ${Math.round(M.conf)}/100. ${M.conf >= 60 ? 'Están conformes con el rumbo.' : M.conf >= 35 ? 'Esperan una mejora en la segunda mitad.' : 'Tu puesto corre peligro.'}`, kind: 'board' });
    }
    if (G.week === 30) {
      const ending = t.squad.map((id) => G.players[id]).filter((p) => p.cy <= 1);
      if (ending.length) DT.inbox({ title: 'Contratos que vencen', body: `Terminan contrato a fin de año: ${ending.map((p) => `${p.n} (${p.ovr})`).join(', ')}. Renovalos desde su ficha o se irán libres.`, kind: 'squad' });
    }
    if (G.week >= 10 && M.conf < 12 && !G.pendingOffers) B.fire('La directiva perdió la confianza en tu trabajo y decidió rescindir tu contrato.');
  };

  B.fire = function (reason) {
    const G = DT.G;
    const t = DT.userTeam();
    G.manager.career.push({ club: t.n, from: G.manager.clubs[G.manager.clubs.length - 1].from, to: G.year, why: 'Despedido' });
    G.manager.rep = Math.max(20, G.manager.rep - 6);
    DT.news(`${t.n} despidió a ${G.manager.n}.`, 'club');
    G.pendingOffers = { reason, offers: B.jobOffers(t.id, true) };
  };

  // Ofertas de clubes acordes a la reputación del DT.
  B.jobOffers = function (excludeId, fired) {
    const G = DT.G;
    const rep = G.manager.rep;
    const pool = Object.values(G.teams).filter((t) => DT.inLeague(t) && t.id !== excludeId && t.id !== G.user);
    const max = fired ? rep + 2 : rep + 8;
    const min = fired ? rep - 30 : rep - 6;
    let cands = pool.filter((t) => t.rep <= max && t.rep >= min);
    if (cands.length < 3) cands = pool.slice().sort((a, b) => a.rep - b.rep).slice(0, 12);
    U.shuffle(cands);
    return cands.slice(0, fired ? 4 : 2).map((t) => t.id);
  };

  B.takeJob = function (tid) {
    const G = DT.G;
    G.pendingOffers = null;
    DT.W.setUserTeam(tid);
    const t = DT.userTeam();
    if (G.week === 0) {
      B.seasonStart();
      return;
    }
    G.manager.obj = B.makeObjective(t);
    DT.inbox({ title: `Bienvenido a ${t.n}`, body: `Firmaste como nuevo DT. Objetivo: ${G.manager.obj.text}`, kind: 'board' });
  };

  // Evaluación de fin de temporada (antes de ascensos/descensos).
  B.seasonEnd = function (finalPos, relegated, promoted) {
    const G = DT.G;
    const M = G.manager;
    const t = DT.userTeam();
    const o = M.obj;
    let msg;
    if (relegated) {
      M.conf = 0;
      msg = `${t.n} descendió. La directiva te despide.`;
    } else if (promoted) {
      M.conf = Math.min(100, M.conf + 35);
      M.rep = Math.min(100, M.rep + 6);
      msg = `¡Ascenso! ${t.n} terminó ${finalPos}º y vuelve a jugar en ${DT.COUNTRIES[t.cc].league}. La directiva está feliz.`;
    } else if (o && finalPos <= o.target) {
      M.conf = Math.min(100, M.conf + 25);
      M.rep = Math.min(100, M.rep + (finalPos < o.target ? 4 : 2));
      msg = `Objetivo cumplido: terminaste ${finalPos}º. La directiva está muy conforme.`;
      if (t.sponsor && t.sponsor.kind === 'objetivo' && t.sponsor.bonus) {
        DT.E.add(t, 'Sponsors', t.sponsor.bonus);
        msg += ` ${t.sponsor.name} pagó el premio por objetivo (${U.money(t.sponsor.bonus)}).`;
      }
    } else {
      const miss = finalPos - (o ? o.target : finalPos);
      const titles = M.titles.filter((x) => x.y === G.year).length;
      M.conf = Math.max(0, M.conf - (titles ? 8 : 18 + miss * 3));
      M.rep = Math.max(20, M.rep - (titles ? 0 : 2));
      msg = `No se cumplió el objetivo (terminaste ${finalPos}º).${titles ? ' Los títulos conseguidos suavizan la evaluación.' : ''}`;
    }
    M.career.push({ club: t.n, y: G.year, pos: finalPos, conf: Math.round(M.conf) });
    DT.inbox({ title: 'Evaluación de la temporada', body: msg + ` Confianza: ${Math.round(M.conf)}/100.`, kind: 'board' });
    if (relegated || M.conf < 22) {
      B.fire(relegated ? 'El equipo descendió y la directiva decidió cambiar de entrenador.' : 'La directiva decidió no renovar tu ciclo.');
      return;
    }
    // Ofertas de clubes más grandes si el DT está en alza.
    if (M.rep > t.rep - 4 && U.chance(0.6)) {
      const offers = B.jobOffers(t.id, false).filter((id) => G.teams[id].rep > t.rep);
      if (offers.length) {
        DT.inbox({
          title: 'Te quieren otros clubes',
          body: 'Tu trabajo llamó la atención. Podés aceptar una propuesta o seguir en tu club.',
          kind: 'board',
          actions: offers.map((id) => ({ id: 'job', tid: id, label: `Aceptar oferta de ${G.teams[id].n}`, sub: `Reputación ${G.teams[id].rep} · ${DT.COUNTRIES[G.teams[id].cc].name}` })).concat([{ id: 'stay', label: `Quedarme en ${t.n}` }]),
        });
      }
    }
  };

  return B;
})();

// ---- src/game/market.js ----
// Mercado de pases: compras, ventas, renovaciones y movimientos de la IA.
DT.M = (function () {
  const U = DT.U;
  const M = {};

  M.importance = function (p) {
    const G = DT.G;
    const team = G.teams[p.t];
    if (!team) return 1;
    const sorted = team.squad.map((id) => G.players[id]).sort((a, b) => b.ovr - a.ovr);
    const idx = sorted.findIndex((x) => x.id === p.id);
    return idx < 3 ? 1.5 : idx < 11 ? 1.25 : idx < 18 ? 1.05 : 0.85;
  };

  M.askingPrice = function (p) {
    if (!p.t) return 0;
    const G = DT.G;
    const team = G.teams[p.t];
    let v = DT.P.value(p) * M.importance(p);
    if (p.cy <= 1) v *= 0.7;
    if (p.lst) v *= 0.85;
    const rev = DT.E.estimateRevenue(team);
    if (team.cash > rev * 0.3) v *= 1.1;
    else if (team.cash < 0) v *= 0.85;
    return U.round(v, v > 1e6 ? 50000 : 5000);
  };

  M.reserve = (t) => DT.E.payroll(t) / 46 * 4;
  M.budget = (t) => Math.max(0, Math.round(t.cash - M.reserve(t)));

  // Oferta del usuario por un jugador de otro club.
  M.offer = function (pid, amount) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    if (!p || p.t === me.id) return { res: 'error', msg: 'Jugador no válido.' };
    if (!p.t) return { res: 'free' };
    if (!DT.S.windowOpen()) return { res: 'error', msg: 'El libro de pases está cerrado. Abre en las semanas 0–4 y 21–26.' };
    if (amount > M.budget(me)) return { res: 'error', msg: `La directiva no autoriza gastar más de ${U.money(M.budget(me))} (caja menos reserva para sueldos).` };
    G.offersMade = G.offersMade || {};
    const key = G.year + '_' + G.week + '_' + pid;
    G.offersMade[key] = (G.offersMade[key] || 0) + 1;
    if (G.offersMade[key] > 3) return { res: 'reject', msg: 'El club se cansó de las ofertas y no negocia más esta semana.' };
    const ask = M.askingPrice(p);
    const ratio = amount / ask;
    if (ratio >= 1 || (ratio >= 0.88 && U.chance(0.5))) return { res: 'accept', fee: amount };
    if (ratio >= 0.6) {
      const counter = U.round(Math.max(amount * 1.05, ask * U.rf(0.96, 1.06)), 10000);
      return { res: 'counter', fee: counter, msg: `${G.teams[p.t].n} pide ${U.money(counter)}.` };
    }
    return { res: 'reject', msg: `${G.teams[p.t].n} rechazó la oferta: la considera muy baja.` };
  };

  // Negociación de contrato con el jugador.
  M.contractTalk = function (pid, wage, years) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    const d = DT.P.demand(p, me);
    if (p.t && p.t !== me.id) {
      G.willing = G.willing || {};
      if (G.willing[pid] === undefined) G.willing[pid] = DT.P.willingToJoin(p, me);
      if (!G.willing[pid]) return { res: 'reject', msg: `${p.n} no quiere jugar en ${me.n}.` };
    }
    const payroll = DT.E.payroll(me) - (p.t === me.id ? p.w : 0);
    if (payroll + wage > DT.E.wageCap(me)) return { res: 'board', msg: `La masa salarial quedaría en ${U.money(payroll + wage)} y el tope es ${U.money(DT.E.wageCap(me))}. Liberá sueldos (vendé, cedé o rescindí) o pedile a la directiva que amplíe el tope.` };
    const r = wage / d.w;
    if (r >= 1 || (r >= 0.92 && U.chance(0.6))) return { res: 'accept', wage, years };
    return { res: 'counter', w: d.w, years: d.years, msg: `${p.n} pide ${U.money(d.w)} por año.` };
  };

  M.completeSigning = function (pid, fee, wage, years) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    const seller = p.t ? G.teams[p.t] : null;
    if (fee) {
      DT.E.add(me, 'Fichajes', -fee);
      if (seller) DT.E.add(seller, 'Venta de jugadores', fee);
      if (seller) M.settleSellOn(p, fee, seller);
    }
    DT.AI.addToTeam(me, p, wage, years);
    p.mor = 80;
    DT.news(`${me.n} incorporó a ${p.n}${seller ? ` desde ${seller.n}` : ' (libre)'}${fee ? ` por ${U.money(fee)}` : ''}.`, 'transfer');
    if (seller) DT.AI.ensureSquad(seller);
  };

  // Venta de un jugador del usuario a otro club.
  M.sellUser = function (pid, buyerId, fee, buyerName) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    if (!p || p.t !== me.id) return false;
    DT.E.add(me, 'Venta de jugadores', fee);
    M.settleSellOn(p, fee, me);
    if (buyerId && G.teams[buyerId]) {
      const b = G.teams[buyerId];
      DT.E.add(b, 'Fichajes', -fee);
      DT.AI.addToTeam(b, p, Math.max(p.w, DT.P.fairWage(p, b.cc)), U.ri(2, 4));
      DT.news(`${me.n} vendió a ${p.n} a ${b.n} por ${U.money(fee)}.`, 'transfer');
    } else {
      DT.AI.release(me, p);
      p.from = me.n;
      M.goAbroad(p, fee, buyerName || 'el exterior');
      DT.news(`${me.n} vendió a ${p.n} a ${buyerName || 'el exterior'} por ${U.money(fee)}.`, 'transfer');
    }
    return true;
  };

  M.goAbroad = function (p, fee, club) {
    const G = DT.G;
    G.abroad.unshift({ n: p.n, y: G.year, club, fee, from: p.from || '' });
    if (G.abroad.length > 60) G.abroad.length = 60;
    delete G.players[p.id];
  };

  // Rescindir contrato: se paga la mitad de lo que resta.
  M.releaseCost = (p) => Math.round(p.w * Math.max(1, p.cy) * 0.5);
  M.releaseUser = function (pid) {
    const me = DT.userTeam();
    const p = DT.G.players[pid];
    const cost = M.releaseCost(p);
    DT.E.add(me, 'Sueldos', -cost);
    DT.AI.release(me, p);
    DT.news(`${me.n} rescindió el contrato de ${p.n}.`, 'transfer');
  };

  // Renovación de contrato del usuario.
  M.renewDemand = function (p) {
    const me = DT.userTeam();
    const d = DT.P.demand(p, me);
    d.w = Math.max(d.w, U.round(p.w * 1.05, 1000));
    return d;
  };
  M.renew = function (pid, wage, years) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    if (p.mor < 30) return { res: 'reject', msg: `${p.n} está disconforme y no quiere renovar.` };
    G.renewTries = G.renewTries || {};
    const key = G.year + '_' + pid;
    G.renewTries[key] = (G.renewTries[key] || 0) + 1;
    if (G.renewTries[key] > 4) return { res: 'reject', msg: `${p.n} cortó las negociaciones por esta temporada.` };
    const d = M.renewDemand(p);
    const payroll = DT.E.payroll(me) - p.w;
    // renovar sin subir el sueldo siempre está permitido
    if (wage > p.w && payroll + wage > DT.E.wageCap(me)) return { res: 'board', msg: `Ese sueldo supera el tope salarial (${U.money(DT.E.wageCap(me))}). Ofrecé lo mismo que cobra hoy, liberá sueldos o pedile a la directiva que amplíe el tope.` };
    if (wage >= d.w || (wage >= d.w * 0.93 && U.chance(0.5))) {
      p.w = wage;
      p.cy = years;
      p.mor = Math.min(100, p.mor + 8);
      return { res: 'accept' };
    }
    return { res: 'counter', w: d.w, years: d.years, msg: `${p.n} pide ${U.money(d.w)} por año durante ${d.years} años.` };
  };

  // ---------- Futura venta ----------
  // Si el jugador tiene un % de futura venta a favor de otro club, se le paga.
  M.settleSellOn = function (p, fee, sellerTeam) {
    const so = p.sellOn;
    if (!so) return;
    delete p.sellOn;
    if (!sellerTeam || so.tid === sellerTeam.id) return;
    const owner = DT.G.teams[so.tid];
    if (!owner) return;
    const amt = Math.round(fee * so.pct);
    DT.E.add(sellerTeam, 'Fichajes', -amt);
    DT.E.add(owner, 'Venta de jugadores', amt);
    if (DT.isUser(owner.id)) DT.inbox({ title: 'Cobraste un porcentaje de futura venta', body: `${p.n} fue transferido por ${U.money(fee)} y te corresponde el ${Math.round(so.pct * 100)}%: ${U.money(amt)}.`, kind: 'money' });
  };

  // ---------- Ojeadores ----------
  M.scoutCost = (t) => U.round(20000 * (0.3 + DT.E.W(t)), 1000);
  M.known = function (p) {
    const G = DT.G;
    return !p.t || DT.isUser(p.t) || (p.loan && p.loan.from === G.user) || !!(G.scouted && G.scouted[p.id]);
  };
  M.scout = function (pid) {
    const G = DT.G;
    const me = DT.userTeam();
    const cost = M.scoutCost(me);
    if (me.cash < cost) return { ok: false, msg: 'No hay caja para pagar el viaje del ojeador.' };
    DT.E.add(me, 'Staff', -cost);
    G.scouted = G.scouted || {};
    G.scouted[pid] = G.year;
    const p = G.players[pid];
    const gap = p.pot - p.ovr;
    const txt = gap >= 15 ? 'Tiene condiciones de crack: puede crecer muchísimo.' : gap >= 8 ? 'Tiene buen margen de mejora.' : gap >= 3 ? 'Puede mejorar un poco más.' : 'Está en su techo: lo que ves es lo que hay.';
    return { ok: true, msg: `Informe del ojeador sobre ${p.n}: ${txt} Techo estimado: media ${Math.max(p.ovr, p.pot - 1)}–${p.pot + 1}.` };
  };

  // ---------- Préstamos de jugadores ----------
  // Ofertas de clubes para llevarse a préstamo a un jugador del usuario.
  M.loanOutOffers = function (pid) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    const cands = Object.values(G.teams).filter((t) => DT.inLeague(t) && !t.eur && t.id !== me.id && t.rep <= me.rep + 4 && t.squad.length < 32 && DT.W.teamLevel(t) <= p.ovr + 6 && t.cash > p.w * 0.5);
    U.shuffle(cands);
    return cands.slice(0, 3).map((t) => ({ tid: t.id, fee: U.round(DT.P.value(p) * U.rf(0, 0.06), 5000), starter: DT.W.teamLevel(t) <= p.ovr + 1 }));
  };
  M.loanOut = function (pid, tid, fee) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    const t = G.teams[tid];
    if (!DT.S.windowOpen()) return { ok: false, msg: 'El libro de pases está cerrado.' };
    if (me.squad.length <= 18) return { ok: false, msg: 'Te quedarías con muy pocos jugadores.' };
    DT.AI.release(me, p);
    p.t = t.id;
    p.num = null;
    p.loan = { from: me.id, y: G.year };
    t.squad.push(p.id);
    if (fee) { DT.E.add(me, 'Venta de jugadores', fee); DT.E.add(t, 'Fichajes', -fee); }
    DT.news(`${me.n} cedió a ${p.n} a ${t.n} hasta fin de temporada.`, 'transfer');
    return { ok: true, msg: `${p.n} se va a préstamo a ${t.n}. ${t.n} paga su sueldo y vuelve a fin de temporada.` };
  };
  // Pedido del usuario para traer a préstamo a un jugador de otro club.
  M.loanInFee = (p) => U.round(DT.P.value(p) * 0.08, 5000);
  M.loanIn = function (pid) {
    const G = DT.G;
    const p = G.players[pid];
    const me = DT.userTeam();
    const owner = G.teams[p.t];
    if (!DT.S.windowOpen()) return { ok: false, msg: 'El libro de pases está cerrado.' };
    if (p.loan) return { ok: false, msg: 'Ese jugador ya está cedido.' };
    if (owner.squad.length <= 20) return { ok: false, msg: `${owner.n} tiene el plantel corto y no cede jugadores.` };
    if (M.importance(p) >= 1.25 && p.age > 21) return { ok: false, msg: `${owner.n} no cede a un titular.` };
    if (!DT.P.willingToJoin(p, me)) return { ok: false, msg: `${p.n} no quiere ir a préstamo a ${me.n}.` };
    const fee = M.loanInFee(p);
    if (fee > M.budget(me)) return { ok: false, msg: `El préstamo cuesta ${U.money(fee)} y no tenés presupuesto.` };
    if (DT.E.payroll(me) + p.w > DT.E.wageCap(me)) return { ok: false, msg: `Su sueldo (${U.money(p.w)}) supera el tope salarial. Liberá sueldos o pedí más tope a la directiva.` };
    if (me.squad.length >= 34) return { ok: false, msg: 'El plantel está lleno.' };
    DT.AI.release(owner, p);
    p.t = me.id;
    p.num = null;
    p.loan = { from: owner.id, y: G.year };
    me.squad.push(p.id);
    if (fee) { DT.E.add(me, 'Fichajes', -fee); DT.E.add(owner, 'Venta de jugadores', fee); }
    DT.news(`${me.n} recibió a préstamo a ${p.n} (${owner.n}).`, 'transfer');
    return { ok: true, msg: `${p.n} llega a préstamo hasta fin de temporada. Pagaste ${U.money(fee)} y te hacés cargo del sueldo.` };
  };
  // Fin de temporada: los cedidos vuelven a su club.
  M.returnLoans = function () {
    const G = DT.G;
    for (const pid in G.players) {
      const p = G.players[pid];
      if (!p.loan) continue;
      const owner = G.teams[p.loan.from];
      const cur = p.t ? G.teams[p.t] : null;
      if (cur) DT.AI.release(cur, p);
      delete p.loan;
      if (owner) {
        p.t = owner.id;
        p.num = null;
        owner.squad.push(p.id);
        if (DT.isUser(owner.id)) DT.news(`${p.n} volvió de su préstamo en ${cur ? cur.n : 'otro club'}.`, 'squad');
      }
    }
  };

  // ---------- IA ----------
  const isForeignTarget = (p) => (p.age <= 23 && p.ovr >= 72) || (p.age <= 26 && p.ovr >= 77) || (p.age <= 29 && p.ovr >= 81);

  M.weekly = function () {
    const G = DT.G;
    if (!DT.S.windowOpen()) {
      if (G.week === 5 || G.week === 27) M.windowClose();
      return;
    }
    const teams = Object.values(G.teams).filter((t) => !t.eur && DT.inLeague(t));
    // Ventas al exterior
    for (const t of teams) {
      if (DT.isUser(t.id)) continue;
      for (const pid of t.squad.slice()) {
        const p = G.players[pid];
        if (p.loan || !isForeignTarget(p) || !U.chance(0.022)) continue;
        const fee = U.round(DT.P.value(p) * U.rf(0.9, 1.4), 50000);
        const club = U.pick(DT.FOREIGN_BUYERS);
        DT.E.add(t, 'Venta de jugadores', fee);
        M.settleSellOn(p, fee, t);
        DT.AI.release(t, p);
        p.from = t.n;
        M.goAbroad(p, fee, club);
        if (p.ovr >= 76 || fee >= 8e6) DT.news(`${club} compró a ${p.n} (${t.n}) por ${U.money(fee)}.`, 'world');
      }
    }
    // Pases entre clubes sudamericanos
    for (let k = 0; k < 14; k++) M.aiTransfer(teams);
    // Ofertas por jugadores del usuario
    M.offersForUser();
  };

  M.aiTransfer = function (teams) {
    const G = DT.G;
    const buyer = U.pick(teams);
    if (DT.isUser(buyer.id)) return;
    const budget = buyer.cash * 0.45;
    if (budget < 100000) return;
    const L = DT.W.teamLevel(buyer);
    const counts = DT.AI.countPos(buyer);
    const need = U.weighted(['P', 'D', 'M', 'A'], [counts.P < 3 ? 2 : 0.3, Math.max(0.3, 9 - counts.D), Math.max(0.3, 9 - counts.M), Math.max(0.3, 7 - counts.A)]);
    // candidatos: de clubes de igual o menor reputación
    const sellers = teams.filter((t) => t.id !== buyer.id && t.rep <= buyer.rep + 3);
    for (let tries = 0; tries < 6; tries++) {
      const s = U.pick(sellers);
      if (!s) return;
      const cands = s.squad.map((id) => G.players[id]).filter((p) => !p.loan && p.pos === need && p.ovr >= L + 1 && p.ovr <= L + 9 && p.age <= 31);
      if (!cands.length) continue;
      const p = U.pick(cands);
      const fee = M.askingPrice(p);
      if (fee > budget) continue;
      if (!DT.P.willingToJoin(p, buyer)) continue;
      if (DT.isUser(s.id)) {
        M.makeUserOffer(p, buyer, U.round(fee * U.rf(0.8, 1.05), 10000));
        return;
      }
      if (s.squad.length <= 18) continue;
      DT.E.add(buyer, 'Fichajes', -fee);
      DT.E.add(s, 'Venta de jugadores', fee);
      M.settleSellOn(p, fee, s);
      DT.AI.addToTeam(buyer, p, Math.max(p.w, DT.P.fairWage(p, buyer.cc)), U.ri(2, 4));
      if (fee >= 3e6 || p.real) DT.news(`${buyer.n} se reforzó con ${p.n} (ex ${s.n}) por ${U.money(fee)}.`, 'transfer');
      DT.AI.trimSquad(buyer, 31);
      return;
    }
  };

  M.makeUserOffer = function (p, buyer, fee) {
    const G = DT.G;
    if (G.inbox.some((m) => m.data && m.data.pid === p.id && !m.done)) return;
    const name = buyer ? buyer.n : U.pick(DT.FOREIGN_BUYERS);
    DT.inbox({
      title: `Oferta por ${p.n}`,
      body: `${name} ofrece ${U.money(fee)} por ${p.n} (${U.posName[p.pos]}, ${p.age} años, media ${p.ovr}). Valor estimado: ${U.money(DT.P.value(p))}.`,
      kind: 'transfer',
      actions: [
        { id: 'sell', label: `Aceptar ${U.money(fee)}` },
        ...(buyer ? [{ id: 'sellOn', label: `Aceptar ${U.money(U.round(fee * 0.85, 10000))} + 20% de futura venta`, sub: 'Cobrás menos ahora, pero te llevás el 20% si lo vuelven a vender.' }] : []),
        { id: 'counter', label: `Pedir ${U.money(U.round(fee * 1.25, 10000))}` },
        { id: 'reject', label: 'Rechazar' },
      ],
      data: { pid: p.id, buyer: buyer ? buyer.id : null, buyerName: name, fee },
    });
  };

  M.offersForUser = function () {
    const G = DT.G;
    const me = DT.userTeam();
    const pending = G.inbox.filter((m) => m.kind === 'transfer' && m.actions && !m.done).length;
    if (pending >= 3) return;
    for (const pid of me.squad) {
      const p = G.players[pid];
      if (p.loan) continue;
      let prob = 0.004 + (p.lst ? 0.22 : 0);
      if (isForeignTarget(p)) prob += 0.05;
      if (!U.chance(prob)) continue;
      if (isForeignTarget(p) && U.chance(0.6)) {
        M.makeUserOffer(p, null, U.round(DT.P.value(p) * U.rf(p.lst ? 0.85 : 1, 1.5), 50000));
      } else {
        const buyers = Object.values(G.teams).filter((t) => t.lg && !t.eur && t.id !== me.id && t.cash > DT.P.value(p) * 0.8 && t.rep >= me.rep - 18);
        if (!buyers.length) continue;
        const b = U.pick(buyers);
        M.makeUserOffer(p, b, U.round(DT.P.value(p) * U.rf(p.lst ? 0.7 : 0.85, 1.2), 10000));
      }
      return;
    }
  };

  // La IA con deudas vende jugadores; si la crisis es grave, entra un rescate.
  M.aiFinance = function (t) {
    const G = DT.G;
    let sales = 0;
    while (t.cash < 0 && sales < 3 && t.squad.length > 20) {
      const c = DT.AI.countPos(t);
      const cands = t.squad.map((id) => G.players[id]).filter((p) => !p.loan && c[p.pos] > (p.pos === 'P' ? 2 : 5)).sort((a, b) => DT.P.value(b) - DT.P.value(a));
      const p = cands[U.ri(0, Math.min(2, cands.length - 1))];
      if (!p) break;
      const fee = U.round(DT.P.value(p) * U.rf(0.8, 1.05), 10000);
      const club = U.pick(DT.FOREIGN_BUYERS);
      DT.E.add(t, 'Venta de jugadores', fee);
      M.settleSellOn(p, fee, t);
      DT.AI.release(t, p);
      p.from = t.n;
      M.goAbroad(p, fee, club);
      sales++;
    }
    const rev = DT.E.estimateRevenue(t);
    if (t.cash < -rev * 0.4) {
      const inj = Math.round(-t.cash - rev * 0.1);
      t.cash += inj;
      t.rep = Math.max(45, t.rep - 1.5);
      DT.news(`${t.n} recibió un salvataje financiero de ${U.money(inj)} para evitar la quiebra.`, 'world');
    }
  };

  M.windowClose = function () {
    const G = DT.G;
    for (const id in G.teams) {
      const t = G.teams[id];
      if (t.eur || DT.isUser(id)) continue;
      M.aiFinance(t);
      DT.AI.ensureSquad(t);
      DT.AI.trimSquad(t, 31);
    }
    // ofertas pendientes vencen
    for (const m of G.inbox) if (m.kind === 'transfer' && m.actions && !m.done) { m.done = true; m.result = 'Vencida: se cerró el libro de pases.'; }
  };

  return M;
})();

// ---- src/game/season.js ----
// Temporada: calendario, ligas, copas, torneos CONMEBOL y avance del tiempo.
DT.S = (function () {
  const U = DT.U;
  const S = {};

  S.LAST_WEEK = 45;
  const GS_WEEKS = [6, 8, 10, 13, 15, 17];
  const PO_WEEKS = [20, 21];
  const R16_WEEKS = [24, 25];
  const QF_WEEKS = [29, 30];
  const SF_WEEKS = [34, 35];
  const FINAL_WEEK = 40;
  const CUP_WEEKS = [4, 11, 19, 27, 32, 37, 42];
  const REC_WEEKS = [1, 2];
  const INT_WEEK = 45;
  S.windowOpen = () => DT.G.week <= 4 || (DT.G.week >= 21 && DT.G.week <= 26);

  S.PRIZES = {
    LIB: { group: 3e6, win: 330000, PO: 0, R16: 1.25e6, QF: 1.7e6, SF: 2.3e6, runner: 7e6, champ: 23e6 },
    SUD: { group: 900000, win: 115000, PO: 500000, R16: 600000, QF: 700000, SF: 1e6, runner: 2.5e6, champ: 6.5e6 },
  };
  S.STAGE_NAMES = { G: 'Fase de grupos', PO: 'Playoffs', R16: 'Octavos de final', QF: 'Cuartos de final', SF: 'Semifinal', F: 'Final' };

  // ---------- utilidades de partidos ----------
  function addMatch(o) {
    const S0 = DT.G.season;
    const m = { i: S0.nextMid++, c: o.c, h: o.h, a: o.a, w: o.w, s: o.s, p: 0, st: o.st, tie: o.tie || null, n: o.neutral ? 1 : 0, leg: o.leg || 0 };
    if (o.g !== undefined) m.g = o.g;
    S0.matches[m.i] = m;
    const k = o.w + '_' + o.s;
    (S0.sched[k] = S0.sched[k] || []).push(m.i);
    return m;
  }
  function addTie(o) {
    const S0 = DT.G.season;
    const t = { id: S0.nextTie++, c: o.c, stage: o.stage, a: o.a, b: o.b, legs: [], winner: null, single: !!o.single };
    S0.ties[t.id] = t;
    if (t.single) {
      const home = o.neutral ? (U.chance(0.5) ? t.a : t.b) : (o.homeFirst || t.a);
      const away = home === t.a ? t.b : t.a;
      t.legs.push(addMatch({ c: o.c, h: home, a: away, w: o.weeks[0], s: 0, st: o.stage, tie: t.id, neutral: o.neutral, leg: 1 }).i);
    } else {
      t.legs.push(addMatch({ c: o.c, h: t.a, a: t.b, w: o.weeks[0], s: 0, st: o.stage, tie: t.id, leg: 1 }).i);
      t.legs.push(addMatch({ c: o.c, h: t.b, a: t.a, w: o.weeks[1], s: 0, st: o.stage, tie: t.id, leg: 2 }).i);
    }
    return t;
  }

  // Calendario todos contra todos (método del círculo).
  function roundRobin(teams, double) {
    const list = teams.slice();
    if (list.length % 2) list.push(null);
    const n = list.length;
    const rounds = [];
    for (let r = 0; r < n - 1; r++) {
      const pairs = [];
      for (let i = 0; i < n / 2; i++) {
        const a = list[i], b = list[n - 1 - i];
        if (a && b) pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
      }
      rounds.push(pairs);
      list.splice(1, 0, list.pop());
    }
    if (double) {
      const second = rounds.map((rd) => rd.map(([a, b]) => [b, a]));
      return rounds.concat(second);
    }
    return rounds;
  }

  function newRow() { return { pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0 }; }

  S.sortTable = function (table, ids) {
    return ids.slice().sort((x, y) => {
      const a = table[x], b = table[y];
      return b.pts - a.pts || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf || (DT.G.teams[y].rep - DT.G.teams[x].rep);
    });
  };

  function updateRow(table, h, a, hg, ag) {
    const H = table[h], A = table[a];
    if (!H || !A) return;
    H.pj++; A.pj++;
    H.gf += hg; H.gc += ag; A.gf += ag; A.gc += hg;
    if (hg > ag) { H.g++; A.p++; H.pts += 3; }
    else if (hg < ag) { A.g++; H.p++; A.pts += 3; }
    else { H.e++; A.e++; H.pts++; A.pts++; }
  }

  // ---------- creación de la temporada ----------
  S.startSeason = function (first) {
    const G = DT.G;
    G.week = 0;
    G.slot = 0;
    G.season = { year: G.year, comps: {}, matches: {}, ties: {}, sched: {}, nextMid: 1, nextTie: 1, qual: null };
    const SS = G.season;
    for (const cc of DT.COUNTRY_ORDER) {
      const C = DT.COUNTRIES[cc];
      const ids = Object.values(G.teams).filter((t) => t.lg === cc).map((t) => t.id);
      // Liga
      const double = C.format === 2;
      const rounds = roundRobin(U.shuffle(ids.slice()), double);
      const comp = { id: 'L_' + cc, type: 'league', cc, name: C.league, teams: ids, table: {}, rounds: rounds.length };
      ids.forEach((id) => (comp.table[id] = newRow()));
      SS.comps[comp.id] = comp;
      rounds.forEach((rd, r) => {
        const w = Math.floor(1 + (r * 44) / rounds.length);
        rd.forEach(([h, a]) => addMatch({ c: comp.id, h, a, w, s: 1, st: r + 1 }));
      });
      // Segunda división (en los países que la tienen)
      const ids2 = Object.values(G.teams).filter((t) => t.d2 === cc).map((t) => t.id);
      if (C.div2 && ids2.length) {
        const r2 = roundRobin(U.shuffle(ids2.slice()), C.div2.format === 2);
        const c2 = { id: 'B_' + cc, type: 'league', div: 2, cc, name: C.div2.name, teams: ids2, table: {}, rounds: r2.length };
        ids2.forEach((id) => (c2.table[id] = newRow()));
        SS.comps[c2.id] = c2;
        r2.forEach((rd, r) => {
          const w = Math.floor(1 + (r * 44) / r2.length);
          rd.forEach(([h, a]) => addMatch({ c: c2.id, h, a, w, s: 1, st: r + 1 }));
        });
      }
      // Copa nacional: primera y segunda división
      S.createCup(cc, ids.concat(ids2));
    }
    // Torneos internacionales
    const qual = first ? S.initialQualifiers() : G.nextQual;
    S.createContinental('LIB', 'Copa Libertadores', qual.LIB);
    S.createContinental('SUD', 'Copa Sudamericana', qual.SUD);
    // Recopa
    const hl = G.holders.LIB, hs = G.holders.SUD;
    if (hl && hs && hl !== hs && G.teams[hl] && G.teams[hs]) {
      SS.comps.REC = { id: 'REC', type: 'tie', name: 'Recopa Sudamericana', champion: null };
      const t = addTie({ c: 'REC', stage: 'F', a: hs, b: hl, weeks: REC_WEEKS });
      SS.comps.REC.tie = t.id;
    }
    // Intercontinental: se define en la semana de la final de la Libertadores
    G.euroChamp = U.pick(Object.keys(G.europe));
    SS.comps.INT = { id: 'INT', type: 'tie', name: 'Copa Intercontinental', champion: null, tie: null };
    // Preparación de equipos
    for (const id in G.teams) {
      const t = G.teams[id];
      if (t.eur) continue;
      DT.E.resetCap(t);
      if (!DT.isUser(id)) {
        DT.AI.chooseFormation(t);
        if (!t.sponsor || first) t.sponsor = { name: 'Sponsor', amt: DT.E.sponsorBase(t), kind: 'fijo', bonus: 0 };
      }
      for (const pid of t.squad) {
        const p = G.players[pid];
        p.st = { pj: 0, g: 0, a: 0, rs: 0 };
        p.yc = 0;
      }
    }
    DT.Board.seasonStart();
  };

  S.createCup = function (cc, ids) {
    const G = DT.G;
    const C = DT.COUNTRIES[cc];
    const comp = { id: 'C_' + cc, type: 'cup', cc, name: C.cup, round: 0, rounds: 0, alive: ids.slice(), champion: null, ties: [] };
    G.season.comps[comp.id] = comp;
    let B = 1;
    while (B < ids.length) B *= 2;
    comp.rounds = Math.round(Math.log2(B));
    comp.weeks = CUP_WEEKS.slice(CUP_WEEKS.length - comp.rounds);
    // Los de mayor reputación quedan libres en la primera ronda.
    const byes = B - ids.length;
    const sorted = ids.slice().sort((a, b) => G.teams[b].rep - G.teams[a].rep);
    comp.byes = sorted.slice(0, byes);
    const playing = U.shuffle(sorted.slice(byes));
    S.drawCupRound(comp, playing);
  };

  S.drawCupRound = function (comp, teams) {
    const G = DT.G;
    const w = comp.weeks[comp.round];
    const isFinal = comp.round === comp.rounds - 1;
    comp.ties = [];
    for (let i = 0; i + 1 < teams.length; i += 2) {
      let a = teams[i], b = teams[i + 1];
      // juega de local el de menor jerarquía
      if (G.teams[a].rep > G.teams[b].rep) { const x = a; a = b; b = x; }
      const t = addTie({ c: comp.id, stage: isFinal ? 'F' : 'R' + (comp.round + 1), a, b, single: true, weeks: [w], neutral: isFinal, homeFirst: a });
      comp.ties.push(t.id);
    }
  };

  S.cupStageName = function (comp, stage) {
    if (stage === 'F') return 'Final';
    const r = +String(stage).slice(1);
    const left = comp.rounds - r + 1; // rondas restantes incluida esta
    if (left === 2) return 'Semifinal';
    if (left === 3) return 'Cuartos de final';
    if (left === 4) return 'Octavos de final';
    if (left === 5) return '16avos de final';
    return 'Ronda ' + r;
  };

  // Clasificados de la primera temporada: por reputación dentro de cada liga.
  S.initialQualifiers = function () {
    const G = DT.G;
    const res = { LIB: [], SUD: [] };
    for (const cc of DT.COUNTRY_ORDER) {
      const C = DT.COUNTRIES[cc];
      const ids = Object.values(G.teams).filter((t) => t.lg === cc).sort((a, b) => b.rep - a.rep).map((t) => t.id);
      res.LIB.push(...ids.slice(0, C.lib));
      res.SUD.push(...ids.slice(C.lib, C.lib + C.sud));
    }
    return res;
  };

  S.createContinental = function (id, name, teams) {
    const G = DT.G;
    const comp = { id, type: 'cont', name, teams: teams.slice(), groups: [], gtable: {}, stage: 'G', ko: {}, champion: null };
    G.season.comps[id] = comp;
    // Bombos por reputación, intentando no repetir país en un grupo.
    const sorted = teams.slice().sort((a, b) => G.teams[b].rep - G.teams[a].rep);
    const holder = id === 'LIB' ? G.holders.LIB : G.holders.SUD;
    if (holder && sorted.includes(holder)) { sorted.splice(sorted.indexOf(holder), 1); sorted.unshift(holder); }
    const groups = Array.from({ length: 8 }, () => []);
    for (let pot = 0; pot < 4; pot++) {
      const potTeams = U.shuffle(sorted.slice(pot * 8, pot * 8 + 8));
      const order = U.shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
      for (const tid of potTeams) {
        const cc = G.teams[tid].cc;
        let gi = order.findIndex((g) => groups[g].length === pot && !groups[g].some((x) => G.teams[x].cc === cc));
        if (gi < 0) gi = order.findIndex((g) => groups[g].length === pot);
        const g = order[gi];
        groups[g].push(tid);
      }
    }
    comp.groups = groups;
    teams.forEach((t) => (comp.gtable[t] = newRow()));
    groups.forEach((gr, gi) => {
      const rr = roundRobin(gr, true);
      rr.forEach((rd, r) => rd.forEach(([h, a]) => addMatch({ c: id, h, a, w: GS_WEEKS[r], s: 0, st: 'G', g: gi })));
    });
    // Premio por participar
    const P = S.PRIZES[id];
    teams.forEach((t) => DT.E.prize(G.teams[t], P.group, `${name}: fase de grupos`));
  };

  // ---------- simulación de una franja ----------
  S.slotMatches = function (w, s) {
    const G = DT.G;
    return (G.season.sched[w + '_' + s] || []).map((i) => G.season.matches[i]);
  };

  S.userMatchNow = function () {
    const G = DT.G;
    return S.slotMatches(G.week, G.slot).find((m) => !m.p && (m.h === G.user || m.a === G.user)) || null;
  };

  // ¿El partido debe definirse por penales si termina así?
  S.needsPens = function (match, hg, ag) {
    const G = DT.G;
    if (!match.tie) return false;
    const tie = G.season.ties[match.tie];
    if (tie.single) return hg === ag;
    if (match.leg !== 2) return false;
    const l1 = G.season.matches[tie.legs[0]];
    // en la vuelta, local = tie.b
    const aggB = l1.ag + hg, aggA = l1.hg + ag;
    return aggA === aggB;
  };

  function compType(match) {
    const c = match.c;
    if (c.startsWith('L_') || c.startsWith('B_')) return 'league';
    if (c.startsWith('C_')) return 'cup';
    return 'cont';
  }

  // Registra un partido jugado en su competición.
  S.record = function (match, sim) {
    const G = DT.G;
    const comp = G.season.comps[match.c];
    const home = G.teams[match.h], away = G.teams[match.a];
    // taquilla y viajes
    if (!match.n) {
      const type = compType(match);
      const stage = type === 'cup' ? (comp.round || 0) : 0;
      match.att = DT.E.matchIncome(home, away, type, stage);
    } else {
      match.att = Math.round(U.rf(0.75, 0.98) * 45000);
      if (!home.eur) DT.E.add(home, 'Taquilla', match.att * 15 * 0.3);
      if (!away.eur) DT.E.add(away, 'Taquilla', match.att * 15 * 0.3);
    }
    if (comp.type === 'cont' || comp.type === 'tie') {
      const tr = (t) => { if (!t.eur) DT.E.add(t, 'Viajes', -60000 * (0.5 + DT.E.W(t))); };
      tr(away);
      if (match.n) tr(home);
    }
    if (comp.type === 'league') {
      updateRow(comp.table, match.h, match.a, match.hg, match.ag);
    } else if (comp.type === 'cont' && match.st === 'G') {
      updateRow(comp.gtable, match.h, match.a, match.hg, match.ag);
      const P = S.PRIZES[comp.id];
      if (match.hg > match.ag) DT.E.prize(home, P.win);
      if (match.ag > match.hg) DT.E.prize(away, P.win);
    }
    if (match.tie) S.resolveTie(G.season.ties[match.tie], match);
    // Directiva y estadísticas del DT
    if (DT.isUser(match.h) || DT.isUser(match.a)) DT.Board.afterMatch(match);
  };

  S.resolveTie = function (tie, match) {
    const G = DT.G;
    if (tie.single) {
      if (match.hg !== match.ag) tie.winner = match.hg > match.ag ? match.h : match.a;
      else tie.winner = match.pen[0] > match.pen[1] ? match.h : match.a;
    } else if (match.leg === 2) {
      const l1 = G.season.matches[tie.legs[0]];
      const aggA = l1.hg + match.ag, aggB = l1.ag + match.hg;
      if (aggA !== aggB) tie.winner = aggA > aggB ? tie.a : tie.b;
      else tie.winner = match.pen[0] > match.pen[1] ? match.h : match.a;
    }
  };

  // Simula los partidos pendientes de la franja actual (excepto si se pide).
  S.simulateSlot = function () {
    const G = DT.G;
    for (const m of S.slotMatches(G.week, G.slot)) {
      if (m.p) continue;
      const sim = DT.Match.quick(m);
      if (S.needsPens(m, sim.s[0].goals, sim.s[1].goals)) DT.Match.penalties(sim);
      DT.Match.apply(sim);
      S.record(m, sim);
    }
  };

  // Recuperación física entre franjas.
  function recover() {
    const G = DT.G;
    for (const id in G.teams) {
      const t = G.teams[id];
      const rec = 7.5 + t.infra.train * 0.8;
      for (const pid of t.squad) {
        const p = G.players[pid];
        p.fit = Math.min(100, p.fit + rec * (p.age >= 32 ? 0.85 : 1));
      }
    }
    for (const pid in G.players) {
      const p = G.players[pid];
      if (!p.t) p.fit = Math.min(100, p.fit + 10);
    }
  }

  // Avanza la competencia luego de cada franja.
  S.progress = function () {
    const G = DT.G;
    const SS = G.season;
    const w = G.week;
    // Copas nacionales
    for (const cc of DT.COUNTRY_ORDER) {
      const comp = SS.comps['C_' + cc];
      if (!comp || comp.champion) continue;
      if (comp.weeks[comp.round] === w && G.slot === 0) {
        const winners = comp.ties.map((t) => SS.ties[t].winner);
        if (winners.some((x) => !x)) continue;
        const C = DT.COUNTRIES[cc];
        winners.forEach((tid) => DT.E.prize(G.teams[tid], C.cupPrize * 1e6 * 0.04 * Math.pow(1.6, comp.round)));
        if (comp.round === comp.rounds - 1) {
          comp.champion = winners[0];
          const tie = SS.ties[comp.ties[0]];
          comp.runner = tie.a === comp.champion ? tie.b : tie.a;
          DT.E.prize(G.teams[comp.champion], C.cupPrize * 1e6 * 0.6, `${comp.name}: campeón`);
          S.title(comp.champion, comp.name);
        } else {
          let next = winners;
          if (comp.round === 0) next = winners.concat(comp.byes);
          comp.round++;
          S.drawCupRound(comp, U.shuffle(next));
        }
      }
    }
    if (G.slot !== 0) return;
    // CONMEBOL
    for (const id of ['LIB', 'SUD']) {
      const comp = SS.comps[id];
      if (!comp || comp.champion) continue;
      if (w === GS_WEEKS[5] && comp.stage === 'G') S.endGroups(comp);
      else if (w === PO_WEEKS[1] && id === 'SUD' && comp.stage === 'PO') S.sudR16(comp);
      else if (w === R16_WEEKS[1] && comp.stage === 'R16') S.nextKO(comp, 'QF', QF_WEEKS);
      else if (w === QF_WEEKS[1] && comp.stage === 'QF') S.nextKO(comp, 'SF', SF_WEEKS);
      else if (w === SF_WEEKS[1] && comp.stage === 'SF') S.nextKO(comp, 'F', [FINAL_WEEK], true);
      else if (w === FINAL_WEEK && comp.stage === 'F') S.endContinental(comp);
    }
    if (w === FINAL_WEEK) {
      // armar la Intercontinental
      const lib = SS.comps.LIB;
      if (lib && lib.champion && !SS.comps.INT.tie) {
        const t = addTie({ c: 'INT', stage: 'F', a: lib.champion, b: G.euroChamp, single: true, neutral: true, weeks: [INT_WEEK] });
        SS.comps.INT.tie = t.id;
      }
    }
    if (w === REC_WEEKS[1] && SS.comps.REC && !SS.comps.REC.champion) {
      const t = SS.ties[SS.comps.REC.tie];
      if (t.winner) {
        SS.comps.REC.champion = t.winner;
        DT.E.prize(G.teams[t.winner], 1.65e6, 'Recopa Sudamericana: campeón');
        DT.E.prize(G.teams[t.winner === t.a ? t.b : t.a], 600000);
        S.title(t.winner, 'Recopa Sudamericana');
      }
    }
    if (w === INT_WEEK && SS.comps.INT.tie && !SS.comps.INT.champion) {
      const t = SS.ties[SS.comps.INT.tie];
      if (t.winner) {
        SS.comps.INT.champion = t.winner;
        DT.E.prize(G.teams[t.a], 5e6, 'Copa Intercontinental: participación');
        if (t.winner === t.a) DT.E.prize(G.teams[t.a], 10e6, 'Copa Intercontinental: campeón');
        if (!G.teams[t.winner].eur) S.title(t.winner, 'Copa Intercontinental');
        else DT.news(`${G.teams[t.winner].n} se quedó con la Copa Intercontinental ante ${G.teams[t.a].n}.`, 'world');
      }
    }
  };

  S.groupStandings = function (comp, gi) {
    return S.sortTable(comp.gtable, comp.groups[gi]);
  };

  S.endGroups = function (comp) {
    const G = DT.G;
    const SS = G.season;
    const first = [], second = [], third = [];
    comp.groups.forEach((g, gi) => {
      const st = S.groupStandings(comp, gi);
      first.push({ t: st[0], g: gi }); second.push({ t: st[1], g: gi }); third.push({ t: st[2], g: gi });
    });
    if (comp.id === 'LIB') {
      comp.thirds = third.map((x) => x.t);
      S.pairR16(comp, first, second);
      // Los terceros van a los playoffs de la Sudamericana
      const sud = SS.comps.SUD;
      if (sud) sud.libThirds = comp.thirds;
    } else {
      comp.winners = first.map((x) => x.t);
      comp.stage = 'PO';
      const libThirds = U.shuffle((comp.libThirds || []).slice());
      const runners = U.shuffle(second.map((x) => x.t));
      comp.ko.PO = [];
      for (let i = 0; i < 8; i++) {
        const a = runners[i], b = libThirds[i];
        if (!a || !b) continue;
        const t = addTie({ c: 'SUD', stage: 'PO', a, b, weeks: PO_WEEKS });
        comp.ko.PO.push(t.id);
        DT.E.prize(G.teams[a], S.PRIZES.SUD.PO);
        DT.E.prize(G.teams[b], S.PRIZES.SUD.PO);
      }
      // Los terceros de la Libertadores se suman a la Sudamericana.
      comp.teams.push(...libThirds);
    }
  };

  S.pairR16 = function (comp, first, second) {
    const G = DT.G;
    comp.stage = 'R16';
    const sec = U.shuffle(second.slice());
    // evitar cruces del mismo grupo
    for (let i = 0; i < first.length; i++) {
      if (sec[i].g === first[i].g) {
        const j = (i + 1) % sec.length;
        const x = sec[i]; sec[i] = sec[j]; sec[j] = x;
      }
    }
    comp.ko.R16 = [];
    for (let i = 0; i < 8; i++) {
      // el primero define de local (es "b": juega la vuelta en casa)
      const t = addTie({ c: comp.id, stage: 'R16', a: sec[i].t, b: first[i].t, weeks: R16_WEEKS });
      comp.ko.R16.push(t.id);
      DT.E.prize(G.teams[sec[i].t], S.PRIZES[comp.id].R16, `${comp.name}: octavos de final`);
      DT.E.prize(G.teams[first[i].t], S.PRIZES[comp.id].R16, `${comp.name}: octavos de final`);
    }
  };

  S.sudR16 = function (comp) {
    const G = DT.G;
    const poWinners = comp.ko.PO.map((t) => G.season.ties[t].winner);
    const first = comp.winners.map((t, i) => ({ t, g: i }));
    const second = U.shuffle(poWinners).map((t) => ({ t, g: -1 }));
    S.pairR16(comp, first, second);
  };

  S.nextKO = function (comp, stage, weeks, single) {
    const G = DT.G;
    const prev = comp.ko[comp.stage];
    const winners = prev.map((t) => G.season.ties[t].winner);
    comp.ko[stage] = [];
    comp.stage = stage;
    for (let i = 0; i + 1 < winners.length; i += 2) {
      let a = winners[i], b = winners[i + 1];
      if (G.teams[a].rep > G.teams[b].rep) { const x = a; a = b; b = x; }
      const t = addTie({ c: comp.id, stage, a, b, weeks, single, neutral: single });
      comp.ko[stage].push(t.id);
      if (stage !== 'F') {
        DT.E.prize(G.teams[a], S.PRIZES[comp.id][stage], `${comp.name}: ${S.STAGE_NAMES[stage].toLowerCase()}`);
        DT.E.prize(G.teams[b], S.PRIZES[comp.id][stage], `${comp.name}: ${S.STAGE_NAMES[stage].toLowerCase()}`);
      }
    }
    if (single) comp.venue = U.pick(DT.FINAL_VENUES);
  };

  S.endContinental = function (comp) {
    const G = DT.G;
    const tie = G.season.ties[comp.ko.F[0]];
    if (!tie.winner) return;
    comp.champion = tie.winner;
    comp.runner = tie.winner === tie.a ? tie.b : tie.a;
    comp.stage = 'done';
    DT.E.prize(G.teams[comp.champion], S.PRIZES[comp.id].champ, `${comp.name}: campeón`);
    DT.E.prize(G.teams[comp.runner], S.PRIZES[comp.id].runner, `${comp.name}: subcampeón`);
    S.title(comp.champion, comp.name);
  };

  // Registro de títulos.
  S.title = function (tid, compName) {
    const G = DT.G;
    const t = G.teams[tid];
    if (!t) return;
    t.titles = t.titles || [];
    t.titles.push({ y: G.year, c: compName });
    DT.news(`¡${t.n} campeón de la ${compName} ${G.year}!`, 'title');
    if (DT.isUser(tid)) {
      G.manager.titles.push({ y: G.year, c: compName, t: t.n });
      G.manager.rep = Math.min(100, G.manager.rep + (compName.includes('Libertadores') ? 8 : compName.includes('Intercontinental') ? 6 : compName.includes('Sudamericana') ? 5 : 3));
      DT.inbox({ title: `¡Campeones de la ${compName}!`, body: `El club levanta la ${compName} ${G.year}. La hinchada está de fiesta y la directiva te felicita.`, kind: 'title' });
      if (t.sponsor && t.sponsor.kind === 'titulos' && t.sponsor.bonus) {
        DT.E.add(t, 'Sponsors', t.sponsor.bonus);
        DT.news(`${t.sponsor.name} pagó el premio por título (${U.money(t.sponsor.bonus)}).`, 'money');
      }
    }
  };

  // ---------- avance del tiempo ----------
  // Devuelve {type: 'match'|'inbox'|'seasonEnd'|'fired'} para que la UI sepa qué mostrar.
  S.advance = function (opts) {
    const G = DT.G;
    let guard = 0;
    while (guard++ < 400) {
      if (G.pendingOffers) return { type: 'jobs' };
      if (G.week > S.LAST_WEEK) {
        DT.End.season();
        return { type: 'seasonEnd' };
      }
      const um = S.userMatchNow();
      if (um) return { type: 'match', match: um };
      S.simulateSlot();
      S.progress();
      recover();
      if (G.slot === 0) {
        G.slot = 1;
      } else {
        S.endWeek();
        G.slot = 0;
        G.week++;
        if (G.pendingOffers) return { type: 'jobs' };
        if (G.inbox.some((m) => m.actions && !m.done && !m.seen)) return { type: 'inbox' };
        if (opts && opts.oneWeek) return { type: 'week' };
      }
    }
    return { type: 'week' };
  };

  // Después de jugar el partido del usuario: completa la franja y sigue.
  S.afterUserMatch = function () {
    const G = DT.G;
    S.simulateSlot();
    S.progress();
    recover();
    if (G.slot === 0) G.slot = 1;
    else {
      S.endWeek();
      G.slot = 0;
      G.week++;
    }
  };

  S.endWeek = function () {
    const G = DT.G;
    for (const id in G.teams) {
      const t = G.teams[id];
      if (t.eur) continue;
      DT.E.weekly(t);
      for (const pid of t.squad) {
        const p = G.players[pid];
        if (p.inj > 0) {
          p.inj -= 1;
          if (t.infra.med >= 4 && p.inj > 0 && U.chance(0.15 * (t.infra.med - 3))) p.inj -= 1;
          if (p.inj <= 0 && DT.isUser(id)) DT.news(`${p.n} se recuperó de su lesión.`, 'squad');
        }
        if (p.nt > 0 && !p.played) p.nt = 0;
        DT.P.weeklyDevelop(p, t.infra.train, p.played);
        p.played = false;
        // la moral vuelve lentamente a 65
        p.mor += (65 - p.mor) * 0.04;
      }
    }
    DT.M.weekly();
    DT.Board.weekly();
    if (!DT.G.pendingOffers) DT.Ev.weekly();
    const ut = DT.userTeam();
    if (ut.anger > 0) ut.anger--;
  };

  // Partidos de la próxima fecha del usuario.
  S.userFixtures = function () {
    const G = DT.G;
    return Object.values(G.season.matches).filter((m) => m.h === G.user || m.a === G.user).sort((a, b) => a.w - b.w || a.s - b.s);
  };

  S.compName = function (cid) {
    const c = DT.G.season.comps[cid];
    return c ? c.name : cid;
  };

  S.matchLabel = function (m) {
    const G = DT.G;
    const comp = G.season.comps[m.c];
    if (!comp) return '';
    if (comp.type === 'league') return `${comp.name} · Fecha ${m.st}`;
    if (comp.type === 'cup') return `${comp.name} · ${S.cupStageName(comp, m.st)}`;
    if (comp.type === 'cont') return `${comp.name} · ${S.STAGE_NAMES[m.st]}${m.leg && !G.season.ties[m.tie || 0]?.single && m.st !== 'G' ? (m.leg === 1 ? ' (ida)' : ' (vuelta)') : ''}`;
    return `${comp.name}${m.leg === 1 && comp.id === 'REC' ? ' (ida)' : m.leg === 2 ? ' (vuelta)' : ''}`;
  };

  return S;
})();

// ---- src/game/end.js ----
// Cierre de temporada: campeones, clasificados, ascensos/descensos, contratos y juveniles.
DT.End = (function () {
  const U = DT.U;
  const End = {};

  End.season = function () {
    const G = DT.G;
    const SS = G.season;
    const hist = { y: G.year, champs: {}, scorers: {}, user: null };
    const finalPos = {};
    const qual = { LIB: [], SUD: [] };
    const relegatedAll = [];
    const promotedAll = [];
    const userTeam = DT.userTeam();

    // Ligas
    for (const cc of DT.COUNTRY_ORDER) {
      const C = DT.COUNTRIES[cc];
      const comp = SS.comps['L_' + cc];
      const order = DT.S.sortTable(comp.table, comp.teams);
      order.forEach((tid, i) => (finalPos[tid] = i + 1));
      G.prevTables[cc] = order.slice();
      const champ = order[0];
      DT.S.title(champ, comp.name);
      hist.champs['L_' + cc] = [champ, G.teams[champ].n];
      // premios por posición
      order.forEach((tid, i) => {
        const share = Math.pow(1 - i / order.length, 2);
        DT.E.prize(G.teams[tid], C.leaguePrize * 1e6 * share, i === 0 ? `${comp.name}: campeón` : null);
      });
      const cup = SS.comps['C_' + cc];
      if (cup && cup.champion) hist.champs['C_' + cc] = [cup.champion, G.teams[cup.champion].n];
      // goleadores
      const scorers = Object.values(G.players).filter((p) => p.t && G.teams[p.t].lg === cc && p.st.g > 0).sort((a, b) => b.st.g - a.st.g).slice(0, 3);
      hist.scorers[cc] = scorers.map((p) => [p.n, G.teams[p.t].n, p.st.g]);
      // clasificados internacionales
      let lib = order.slice(0, C.lib);
      let sud = order.slice(C.lib, C.lib + C.sud);
      if (cup && cup.champion && !lib.includes(cup.champion)) {
        sud = sud.filter((x) => x !== cup.champion);
        sud.unshift(lib.pop());
        lib.push(cup.champion);
        while (sud.length > C.sud) sud.pop();
      }
      qual.LIB.push(...lib);
      qual.SUD.push(...sud);
      // descensos
      const rel = order.slice(order.length - C.rel);
      relegatedAll.push(...rel.map((tid) => ({ tid, cc })));
      // segunda división: campeón, posiciones y ascensos
      const c2 = SS.comps['B_' + cc];
      if (c2) {
        const o2 = DT.S.sortTable(c2.table, c2.teams);
        o2.forEach((tid, i) => (finalPos[tid] = i + 1));
        G.prevTables['B_' + cc] = o2.slice();
        DT.S.title(o2[0], c2.name);
        hist.champs['B_' + cc] = [o2[0], G.teams[o2[0]].n];
        o2.forEach((tid, i) => DT.E.prize(G.teams[tid], C.leaguePrize * 1e6 * 0.15 * Math.pow(1 - i / o2.length, 2), i === 0 ? `${c2.name}: campeón` : null));
        promotedAll.push(...o2.slice(0, C.rel).map((tid) => ({ tid, cc })));
      }
    }
    for (const id of ['LIB', 'SUD', 'REC', 'INT']) {
      const c = SS.comps[id];
      if (c && c.champion) hist.champs[id] = [c.champion, G.teams[c.champion].n];
    }
    // Campeones vigentes clasifican a la Libertadores
    const lib = SS.comps.LIB, sud = SS.comps.SUD;
    G.holders = { LIB: lib && lib.champion, SUD: sud && sud.champion };
    End.fixQualifiers(qual, [G.holders.LIB, G.holders.SUD].filter(Boolean), relegatedAll.map((r) => r.tid));
    G.nextQual = qual;

    // Evaluación del DT
    const userPos = finalPos[G.user];
    const userRelegated = relegatedAll.some((r) => r.tid === G.user);
    const userComp = SS.comps[DT.divOf(userTeam)];
    hist.user = { team: userTeam.n, pos: userPos, of: userComp ? userComp.teams.length : 0, div: userComp ? userComp.name : '' };
    const userPromoted = promotedAll.some((r) => r.tid === G.user);
    End.reputation(finalPos, relegatedAll, promotedAll);

    // Ascensos y descensos
    for (const cc of DT.COUNTRY_ORDER) {
      const C = DT.COUNTRIES[cc];
      const rel = relegatedAll.filter((r) => r.cc === cc).map((r) => r.tid);
      const up = [];
      if (SS.comps['B_' + cc]) {
        // con segunda división: suben los primeros de la tabla y los que bajan juegan la segunda
        rel.forEach((tid) => { G.teams[tid].lg = null; G.teams[tid].d2 = cc; });
        for (const r of promotedAll.filter((x) => x.cc === cc)) {
          const t = G.teams[r.tid];
          t.d2 = null;
          t.lg = cc;
          up.push(t);
          DT.W.fillSquad(t);
        }
      } else {
        rel.forEach((tid) => (G.teams[tid].lg = null));
        const pool = Object.values(G.teams).filter((t) => t.cc === cc && !t.lg && !t.d2 && !rel.includes(t.id));
        for (let i = 0; i < rel.length && pool.length; i++) {
          const t = U.weighted(pool, pool.map((x) => Math.pow(x.rep - 40, 2)));
          pool.splice(pool.indexOf(t), 1);
          t.lg = cc;
          up.push(t);
          DT.W.fillSquad(t, { P: 3, D: 7, M: 7, A: 5 });
        }
      }
      DT.news(`${DT.COUNTRIES[cc].league}: descienden ${rel.map((id) => G.teams[id].n).join(' y ')}. Ascienden ${up.map((t) => t.n).join(' y ')}.`, 'world');
      hist.champs['REL_' + cc] = rel.map((id) => G.teams[id].n);
      hist.champs['UP_' + cc] = up.map((t) => t.n);
    }

    DT.Board.seasonEnd(userPos, userRelegated, userPromoted);

    // Finanzas: cierre del ejercicio
    for (const id in G.teams) if (!G.teams[id].eur) DT.E.closeSeason(G.teams[id]);

    // Jugadores: edad, retiros, contratos, juveniles
    End.players();

    G.history.unshift(hist);
    G.year++;
    DT.S.startSeason(false);
    DT.inbox({ title: `Arranca la temporada ${G.year}`, body: 'Revisá contratos, el mercado de pases está abierto hasta la semana 4.', kind: 'info' });
  };

  // Ajusta las listas a 32 equipos cada una.
  End.fixQualifiers = function (qual, holders, relegated) {
    const G = DT.G;
    const libSet = new Set(qual.LIB);
    for (const h of holders) {
      if (!libSet.has(h) && G.teams[h]) {
        qual.LIB.push(h);
        libSet.add(h);
        qual.SUD = qual.SUD.filter((x) => x !== h);
      }
    }
    const countBy = (list) => list.reduce((m, id) => ((m[G.teams[id].cc] = (m[G.teams[id].cc] || 0) + 1), m), {});
    while (qual.LIB.length > 32) {
      const c = countBy(qual.LIB);
      const top = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
      for (let i = qual.LIB.length - 1; i >= 0; i--) {
        const id = qual.LIB[i];
        if (G.teams[id].cc === top && !holders.includes(id)) { qual.LIB.splice(i, 1); qual.SUD.unshift(id); break; }
      }
    }
    while (qual.SUD.length > 32) {
      const c = countBy(qual.SUD);
      const top = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
      for (let i = qual.SUD.length - 1; i >= 0; i--) {
        if (G.teams[qual.SUD[i]].cc === top) { qual.SUD.splice(i, 1); break; }
      }
    }
    if (qual.SUD.length < 32) {
      const used = new Set(qual.LIB.concat(qual.SUD));
      const extra = Object.values(G.teams).filter((t) => t.lg && !used.has(t.id) && !relegated.includes(t.id)).sort((a, b) => b.rep - a.rep);
      while (qual.SUD.length < 32 && extra.length) qual.SUD.push(extra.shift().id);
    }
  };

  End.reputation = function (finalPos, relegated, promoted) {
    const G = DT.G;
    for (const cc of DT.COUNTRY_ORDER) {
      const ids = Object.values(G.teams).filter((t) => t.lg === cc).sort((a, b) => b.rep - a.rep).map((t) => t.id);
      const n = ids.length;
      ids.forEach((tid, expected) => {
        const t = G.teams[tid];
        const pos = finalPos[tid] || n;
        let d = U.clamp(((expected + 1 - pos) / n) * 5, -3, 3);
        if (pos === 1) d += 2;
        t.rep = U.clamp(Math.round((t.rep + d) * 10) / 10, 45, 99);
      });
    }
    for (const r of relegated) G.teams[r.tid].rep = Math.max(45, G.teams[r.tid].rep - 3);
    for (const r of promoted || []) G.teams[r.tid].rep = Math.min(99, Math.max(G.teams[r.tid].rep + 3, 58));
    const SS = G.season;
    for (const [id, bonus] of [['LIB', 3], ['SUD', 2], ['INT', 2], ['REC', 1]]) {
      const c = SS.comps[id];
      if (c && c.champion && G.teams[c.champion] && !G.teams[c.champion].eur) G.teams[c.champion].rep = Math.min(99, G.teams[c.champion].rep + bonus);
    }
    // los equipos de la B tienden a un nivel medio
    for (const id in G.teams) {
      const t = G.teams[id];
      if (!t.lg && !t.eur) t.rep += ((t.d2 ? 57 : 52) - t.rep) * 0.1;
    }
  };

  End.players = function () {
    const G = DT.G;
    const me = DT.userTeam();
    const leaving = [], retired = [];
    DT.M.returnLoans();
    for (const pid in G.players) {
      const p = G.players[pid];
      const team = p.t ? G.teams[p.t] : null;
      if (team && team.eur) continue;
      DT.P.ageUp(p);
      p.fit = 100; p.sus = 0; p.yc = 0;
      p.inj = Math.max(0, p.inj - 6);
      if (U.chance(DT.P.retireChance(p))) {
        if (team) {
          if (DT.isUser(team.id)) retired.push(p.n);
          DT.AI.release(team, p);
        }
        if (p.real && p.car.pj > 150) DT.news(`Se retiró ${p.n} (${p.car.pj} partidos, ${p.car.g} goles).`, 'world');
        delete G.players[pid];
        continue;
      }
      if (team) {
        p.cy -= 1;
        if (p.cy <= 0 && DT.isUser(team.id)) {
          leaving.push(p.n);
          DT.AI.release(team, p);
        }
      }
    }
    // Joyas de inferiores que esperaban a fin de temporada
    const promotedKids = [];
    for (const y of G.pendingYouth || []) {
      const t = G.teams[y.t];
      if (!t || !DT.isUser(t.id)) continue;
      const p = DT.P.create({ n: y.n, pos: y.pos, age: y.age + 1, ovr: y.ovr, pot: y.pot, t: t.id, cy: 4, yt: true });
      p.w = 15000;
      t.squad.push(p.id);
      promotedKids.push(p.id);
    }
    G.pendingYouth = [];
    // IA: renovaciones, juveniles y completar planteles
    for (const id in G.teams) {
      const t = G.teams[id];
      if (t.eur) continue;
      if (!DT.isUser(id)) DT.AI.renewals(t);
      const n = 2 + (t.infra.youth >= 4 ? 1 : 0) + (U.chance(0.4) ? 1 : 0);
      const kids = [];
      for (let i = 0; i < n; i++) {
        const k = DT.P.youth(t);
        t.squad.push(k.id);
        kids.push(k);
      }
      if (DT.isUser(id)) {
        // aviso en pantalla con los juveniles que subieron al plantel
        G.notices = (G.notices || []).concat([{ kind: 'youth', title: 'Suben juveniles al primer equipo', pids: promotedKids.concat(kids.map((k) => k.id)) }]);
        DT.inbox({ title: 'Suben juveniles de la cantera', body: kids.map((k) => `${k.n} (${U.posName[k.pos]}, ${k.age} años, media ${k.ovr}, potencial ${'★'.repeat(DT.P.stars(k.pot))})`).join('. ') + '.', kind: 'squad' });
      } else {
        DT.AI.ensureSquad(t);
        DT.AI.trimSquad(t, 30);
      }
    }
    // Libres: limitar la bolsa
    const free = Object.values(G.players).filter((p) => !p.t);
    if (free.length > 500) {
      free.sort((a, b) => a.ovr - b.ovr).slice(0, free.length - 500).forEach((p) => delete G.players[p.id]);
    }
    if (leaving.length) DT.inbox({ title: 'Contratos vencidos', body: `Se fueron libres: ${leaving.join(', ')}.`, kind: 'squad' });
    if (retired.length) DT.inbox({ title: 'Retiros', body: `Colgaron los botines: ${retired.join(', ')}.`, kind: 'squad' });
    DT.AI.autoLineup(me);
  };

  return End;
})();

// ---- src/game/actions.js ----
// Respuestas a los mensajes del inbox que requieren una decisión.
DT.Act = (function () {
  const U = DT.U;
  const A = {};

  A.resolve = function (msgId, idx) {
    const G = DT.G;
    const msg = G.inbox.find((m) => m.id === msgId);
    if (!msg || msg.done) return 'Este mensaje ya fue resuelto.';
    const act = msg.actions[idx];
    const me = DT.userTeam();
    let result = '';
    switch (act.id) {
      case 'sponsor': {
        const o = msg.data.offers[act.i];
        me.sponsor = Object.assign({}, o);
        result = `Firmaste con ${o.name}.`;
        break;
      }
      case 'sell': {
        const d = msg.data;
        const p = G.players[d.pid];
        if (!p || p.t !== me.id) { result = 'El jugador ya no está en el club.'; break; }
        if (!DT.S.windowOpen()) { result = 'El libro de pases está cerrado.'; break; }
        DT.M.sellUser(d.pid, d.buyer, d.fee, d.buyerName);
        result = `Vendiste a ${p.n} por ${U.money(d.fee)}.`;
        break;
      }
      case 'sellOn': {
        const d = msg.data;
        const p = G.players[d.pid];
        if (!p || p.t !== me.id) { result = 'El jugador ya no está en el club.'; break; }
        if (!DT.S.windowOpen()) { result = 'El libro de pases está cerrado.'; break; }
        const fee = U.round(d.fee * 0.85, 10000);
        DT.M.sellUser(d.pid, d.buyer, fee, d.buyerName);
        p.sellOn = { tid: me.id, pct: 0.2 };
        result = `Vendiste a ${p.n} por ${U.money(fee)} y te quedás con el 20% de una futura venta.`;
        break;
      }
      case 'counter': {
        const d = msg.data;
        const p = G.players[d.pid];
        if (!p || p.t !== me.id) { result = 'El jugador ya no está en el club.'; break; }
        const newFee = U.round(d.fee * 1.25, 10000);
        const ratio = newFee / DT.P.value(p);
        if (U.chance(U.clamp(1.4 - ratio * 0.6, 0.15, 0.8))) {
          DT.M.sellUser(d.pid, d.buyer, newFee, d.buyerName);
          result = `${d.buyerName} aceptó: vendiste a ${p.n} por ${U.money(newFee)}.`;
        } else {
          result = `${d.buyerName} no aceptó la contraoferta y se retiró.`;
        }
        break;
      }
      case 'reject':
        result = 'Rechazaste la oferta.';
        if (msg.data && G.players[msg.data.pid]) {
          const p = G.players[msg.data.pid];
          if (msg.data.fee > DT.P.value(p) * 1.2 && p.ovr >= 70) {
            p.mor = Math.max(10, p.mor - 12);
            result += ` ${p.n} quedó molesto: quería esa transferencia.`;
          }
        }
        break;
      case 'job':
        G.manager.career.push({ club: me.n, from: G.manager.clubs[G.manager.clubs.length - 1].from, to: G.year, why: 'Cambio de club' });
        DT.Board.takeJob(act.tid);
        result = `Sos el nuevo DT de ${G.teams[act.tid].n}.`;
        // cualquier otra oferta de trabajo pendiente queda sin efecto
        for (const m of G.inbox) if (m !== msg && m.actions && m.actions.some((a) => a.id === 'job')) m.done = true;
        break;
      case 'stay':
        result = `Seguís en ${me.n}.`;
        G.manager.conf = Math.min(100, G.manager.conf + 5);
        break;
      case 'ev':
        result = DT.Ev.apply(msg.data, act.i);
        break;
      default:
        result = 'Listo.';
    }
    msg.done = true;
    msg.result = result;
    msg.read = true;
    return result;
  };

  return A;
})();

  const DEFS = {
    pressLoss: {

      }),

        if (i === 1) { allMor(-5); conf(3); return 'La directiva valora la exigencia. En el vestuario cayó mal.'; }
        if (U.chance(0.55)) { const f = money(40000); DT.E.add(team(), 'Staff', -f); return `La liga te multó con ${U.money(f)} por tus declaraciones. La hinchada te banca.`; }
        allMor(2); return 'Tus declaraciones encendieron a la hinchada y no hubo sanción.';

    raise: {

        p.mor = Math.max(10, p.mor - 18); return `${p.n} está molesto y podría pedir salir.`;

  Ev.weekly = function () {
    const G = DT.G;
    G.evCd = G.evCd || {};
    // eventos sin responder por más de 2 semanas se resuelven con la última opción
    for (const m of G.inbox) {
      if (m.kind === 'event' && !m.done && m.actions && (G.week - m.w >= 3 || m.y !== G.year)) DT.Act.resolve(m.id, m.actions.length - 1);
    }
    if (G.inbox.some((m) => m.kind === 'event' && !m.done)) return;
    if (!U.chance(0.35)) return;
    const now = G.year * 100 + G.week;
    const keys = U.shuffle(Object.keys(DEFS));
    for (const k of keys) {
      if (G.evCd[k] && now - G.evCd[k] < 12) continue;
      const d = DEFS[k].cond();
      if (!d) continue;
      Ev.fire(k, d);
      G.evCd[k] = now;
      return;
    }
  };

  Ev.fire = function (k, d) {
    const m = DEFS[k].make(d);
    const data = Object.assign({ ev: k }, d);
    for (const key of Object.keys(m)) if (!['title', 'body', 'opts'].includes(key)) data[key] = m[key];
    DT.inbox({
      title: m.title,
      body: m.body,
      kind: 'event',
      actions: m.opts.map(([label, sub], i) => ({ id: 'ev', i, label, sub })),
      data,
    });
  };

  Ev.apply = function (data, i) {
    const def = DEFS[data.ev];
    return def ? def.apply(data, i) : 'Listo.';
  };

  Ev.DEFS = DEFS;
  return Ev;
})();

// ---- src/game/save.js ----
// Guardado compacto de la partida (jugadores y partidos como arrays).
DT.Save = (function () {
  const Save = {};
  const KEY = 'dtsud_save_v1';
  const PF = ['id', 'n', 'pos', 'age', 'ovr', 'pot', 't', 'w', 'cy', 'fit', 'mor', 'inj', 'sus', 'yc', 'xp'];
  const MF = ['i', 'c', 'h', 'a', 'w', 's', 'p', 'st', 'tie', 'n', 'leg', 'hg', 'ag', 'att', 'mvp'];

  Save.serialize = function () {
    const G = DT.G;
    const out = Object.assign({}, G);
    out.players = Object.values(G.players).map((p) => {
      const arr = PF.map((k) => (typeof p[k] === 'number' ? Math.round(p[k] * 100) / 100 : p[k]));
      arr.push([p.st.pj, p.st.g, p.st.a, Math.round(p.st.rs * 10) / 10], [p.car.pj, p.car.g], p.fm, (p.real ? 1 : 0) | (p.lst ? 2 : 0) | (p.yt ? 4 : 0) | (p.played ? 8 : 0), p.from || 0, (p.num || p.loan || p.sellOn || p.nt) ? { num: p.num, loan: p.loan, sellOn: p.sellOn, nt: p.nt } : 0);
      return arr;
    });
    const S = G.season;
    out.season = Object.assign({}, S);
    out.season.matches = Object.values(S.matches).map((m) => {
      const arr = MF.map((k) => (m[k] === undefined ? null : m[k]));
      arr.push(m.g === undefined ? null : m.g, m.pen || null, m.sc || null, m.ev || null);
      return arr;
    });
    out.teams = {};
    for (const id in G.teams) {
      // los planteles se reconstruyen desde los jugadores
      out.teams[id] = Object.assign({}, G.teams[id], { squad: undefined });
    }
    return out;
  };

  Save.deserialize = function (data) {
    const G = data;
    const players = {};
    for (const arr of data.players) {
      const p = {};
      PF.forEach((k, i) => (p[k] = arr[i]));
      let j = PF.length;
      const st = arr[j++], car = arr[j++];
      p.st = { pj: st[0], g: st[1], a: st[2], rs: st[3] };
      p.car = { pj: car[0], g: car[1] };
      p.fm = arr[j++] || [];
      const fl = arr[j++] || 0;
      p.real = !!(fl & 1); p.lst = !!(fl & 2); p.yt = !!(fl & 4); p.played = !!(fl & 8);
      const from = arr[j++];
      if (from) p.from = from;
      const ex = arr[j++];
      if (ex) {
        if (ex.num) p.num = ex.num;
        if (ex.loan) p.loan = ex.loan;
        if (ex.sellOn) p.sellOn = ex.sellOn;
        if (ex.nt) p.nt = ex.nt;
      }
      players[p.id] = p;
    }
    G.players = players;
    for (const id in G.teams) G.teams[id].squad = [];
    for (const pid in players) {
      const p = players[pid];
      if (p.t && G.teams[p.t]) G.teams[p.t].squad.push(p.id);
      else p.t = null;
    }
    const matches = {};
    for (const arr of data.season.matches) {
      const m = {};
      MF.forEach((k, i) => { if (arr[i] !== null) m[k] = arr[i]; });
      let j = MF.length;
      if (arr[j] !== null) m.g = arr[j];
      if (arr[j + 1]) m.pen = arr[j + 1];
      if (arr[j + 2]) m.sc = arr[j + 2];
      if (arr[j + 3]) m.ev = arr[j + 3];
      if (m.tie === undefined) m.tie = null;
      matches[m.i] = m;
    }
    G.season.matches = matches;
    // orden de planteles del usuario: respetar once
    DT.G = G;
    return G;
  };

  Save.toJSON = () => JSON.stringify(Save.serialize());

  // Compresión gzip + base64 cuando el navegador lo permite.
  async function gz(str) {
    if (typeof CompressionStream === 'undefined') return 'J' + str;
    const cs = new CompressionStream('gzip');
    const buf = await new Response(new Blob([str]).stream().pipeThrough(cs)).arrayBuffer();
    let bin = '';
    const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return 'Z' + btoa(bin);
  }
  async function gunz(s) {
    if (s[0] === 'J') return s.slice(1);
    if (s[0] === '{') return s;
    const bin = atob(s.slice(1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  }
  Save.pack = async () => gz(Save.toJSON());
  Save.unpack = async (s) => Save.deserialize(JSON.parse(await gunz(s.trim())));

  Save.local = async function () {
    try {
      const s = await Save.pack();
      localStorage.setItem(KEY, s);
      localStorage.setItem(KEY + '_meta', JSON.stringify(Save.meta()));
      return true;
    } catch (e) {
      return false;
    }
  };
  Save.meta = function () {
    const G = DT.G;
    const t = DT.userTeam();
    return { team: t.n, year: G.year, week: G.week, mgr: G.manager.n, at: Date.now() };
  };
  Save.localMeta = function () {
    try { return JSON.parse(localStorage.getItem(KEY + '_meta') || 'null'); } catch (e) { return null; }
  };
  Save.loadLocal = async function () {
    let s = null;
    try { s = localStorage.getItem(KEY); } catch (e) { s = null; }
    if (!s) return false;
    await Save.unpack(s);
    return true;
  };
  Save.clearLocal = function () {
    try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '_meta'); } catch (e) { /* sin acceso */ }
  };

  // Guardado en la nube (capability db del artifact), en partes de 200 KB.
  Save.cloud = { db: null, uid: null, ready: false };
  Save.initCloud = async function () {
    try {
      if (typeof window === 'undefined' || !window.claude || !window.claude.use) return false;
      const db = await window.claude.use('db');
      const user = await window.claude.use('user');
      if (!db || !user) return false;
      const uid = await user.id();
      if (!uid) return false;
      Save.cloud = { db, uid, ready: true };
      return true;
    } catch (e) {
      return false;
    }
  };
  const CHUNK = 200000;
  Save.cloudSave = async function () {
    const c = Save.cloud;
    if (!c.ready) return false;
    try {
      const s = await Save.pack();
      const parts = Math.ceil(s.length / CHUNK);
      for (let i = 0; i < parts; i++) {
        await c.db.doc(`data/users/${c.uid}/save_${i}`).set({ d: s.slice(i * CHUNK, (i + 1) * CHUNK) });
      }
      await c.db.doc(`data/users/${c.uid}/meta`).set(Object.assign(Save.meta(), { parts }));
      return true;
    } catch (e) {
      return false;
    }
  };
  Save.cloudMeta = async function () {
    const c = Save.cloud;
    if (!c.ready) return null;
    try {
      const snap = await c.db.doc(`data/users/${c.uid}/meta`).get();
      return snap && snap.exists ? snap.data() : null;
    } catch (e) {
      return null;
    }
  };
  Save.cloudLoad = async function () {
    const c = Save.cloud;
    const meta = await Save.cloudMeta();
    if (!meta) return false;
    let s = '';
    for (let i = 0; i < meta.parts; i++) {
      const snap = await c.db.doc(`data/users/${c.uid}/save_${i}`).get();
      if (!snap || !snap.exists) return false;
      s += snap.data().d;
    }
    await Save.unpack(s);
    return true;
  };

  return Save;
})();

  // Lista con un título por grupo. `items` ya viene ordenada; `posOf` devuelve el puesto de cada item.

  // Avisos que aparecen solos en pantalla (por ejemplo, juveniles que suben al plantel).
  UI.showNotices = function () {

    const n = G.notices.shift();
    if (n.kind === 'youth') {
      const ps = (n.pids || []).map((id) => G.players[id]).filter((p) => p && p.t === G.user).sort(UI.byPos);
      if (!ps.length) { UI.showNotices(); return; }
      UI.modal(`<span class="kicker">Cantera</span><h2>${U.esc(n.title)}</h2>
        <div class="small">${ps.length === 1 ? 'Este chico se suma' : `Estos ${ps.length} chicos se suman`} al plantel profesional. Tocá un jugador para ver su ficha.</div>
        <section class="card"><div class="list">${ps.map((p) => `<div class="li" data-a="player" data-id="${p.id}">${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">${p.age} años · ${U.money(p.w)}/año</div></div>${UI.stars(p.pot)}<span class="ovr">${p.ovr}</span></div>`).join('')}</div></section>

  UI.setDesk = function (on, save) {

  };
  UI.loadLayout = function () {
    let v = null;

  UI.layoutSwitch = () => `<div class="seg layout-sw" role="group" aria-label="Modo de pantalla">

  UI.A.setLayout = (d) => {

  UI.renderTop = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const pend = G.inbox.filter((m) => m.actions && !m.done).length;
    const tabs = [['home', 'Inicio'], ['squad', 'Plantel'], ['comp', 'Torneos'], ['market', 'Mercado'], ['club', 'Club']];
    const tabBtns = tabs.map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-a="tab" data-tab="${k}" aria-label="${l}">${UI.icon(k)}${l}${k === 'home' && pend ? '<span class="dot"></span>' : ''}</button>`).join('');
    // en modo ordenador las pestañas van arriba, dentro de la barra del club

    $('#top').innerHTML = `${UI.badge(t)}<div class="club"><b>${U.esc(t.n)}</b><span class="small muted">${UI.dateLabel()}${DT.S.windowOpen() ? ' · <span style="color:var(--accent);font-weight:600">Pases abiertos</span>' : ''}</span></div>${top}<div class="cash"><span class="up" style="display:block">Caja</span><span style="color:${t.cash < 0 ? 'var(--loss)' : 'inherit'}">${U.money(t.cash)}</span></div>`;
    const nav = $('#tabs');
    nav.hidden = UI.desk;
    nav.innerHTML = UI.desk ? '' : `<div class="inner">${tabBtns}</div>`;
  };

  UI.renderCTA = function () {
    const el = $('#cta');
    if (!DT.G || DT.G.pendingOffers) { el.innerHTML = ''; return; }
    const um = DT.S.userMatchNow();
    let label = 'Continuar';
    if (um) {
      const opp = DT.team(um.h === DT.G.user ? um.a : um.h);
      label = `Jugar vs ${opp.s}`;
    } else if (DT.G.week > DT.S.LAST_WEEK) label = 'Cerrar temporada';
    el.innerHTML = um
      ? `<div class="inner" style="display:flex;gap:8px"><button class="btn primary big" style="flex:1" data-a="advance">${label}</button><button class="btn big" style="background:var(--surface);box-shadow:none" data-a="quickMatch">Simular</button></div>`
      : `<div class="inner"><button class="btn primary block big" data-a="advance">${label}</button></div>`;
  };

  UI.render = function () {
    if (!DT.G) return;
    UI.renderTop();
    const main = $('#main');
    const scr = DT.Screens[UI.tab] || DT.Screens.home;
    main.innerHTML = scr();

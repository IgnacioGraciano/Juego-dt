    UI.showNotices();
  };

  UI.A.quickMatch = () => {
    const um = DT.S.userMatchNow();
    if (um) DT.MatchUI.quick(um);
  };
  UI.A.tab = (d) => {
    UI.tab = d.tab;
    UI.sel = null;
    UI.render();
    window.scrollTo(0, 0);
  };
  UI.A.sub = (d) => {
    UI.sub[d.k] = d.v;
    UI.sel = null;
    UI.render();
  };

  // Delegación de eventos.
  UI.bind = function () {
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-a]');
      if (!el) return;
      const fn = UI.A[el.dataset.a];
      if (fn) {
        e.preventDefault();
        fn(el.dataset, el, e);
      }
    });
    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-c]');
      if (!el) return;
      const fn = UI.A[el.dataset.c];
      if (fn) fn(el.dataset, el, e);
    });
    document.addEventListener('input', (e) => {
      const el = e.target.closest('[data-i]');
      if (!el) return;
      const fn = UI.A[el.dataset.i];
      if (fn) fn(el.dataset, el, e);
    });
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') UI.closeModal();
    });
  };

  // Gráfico de línea simple (evolución de caja).
  UI.lineChart = function (values, opts) {
    if (!values || values.length < 2) return '<div class="empty small">El gráfico aparece después de la primera semana.</div>';
    const W = 320, H = 120, pl = 44, pr = 8, pt = 10, pb = 18;
    let min = Math.min(0, ...values), max = Math.max(...values);
    if (max === min) max = min + 1;
    const x = (i) => pl + (i / (values.length - 1)) * (W - pl - pr);
    const y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
    const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `${x(0)},${y(Math.max(min, 0))} ${pts} ${x(values.length - 1)},${y(Math.max(min, 0))}`;
    const ticks = [max, (max + min) / 2, min];
    const last = values[values.length - 1];
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(opts && opts.label || 'Evolución')}">
      ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 4}" y="${y(t) + 3}" text-anchor="end">${U.money(t, true)}</text>`).join('')}
      ${min < 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--loss)" stroke-dasharray="3 3" stroke-width="1"/>` : ''}
      <polygon points="${area}" fill="var(--accent)" fill-opacity="0.12"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${x(values.length - 1)}" cy="${y(last)}" r="3.5" fill="var(--accent)"/>
      <text x="${pl}" y="${H - 4}">Semana 0</text><text x="${W - pr}" y="${H - 4}" text-anchor="end">Ahora</text>
    </svg>`;
  };

  return UI;
})();

// ---- src/ui/screens.js ----
// Pantallas: Inicio, Plantel y Torneos.
DT.Screens = (function () {
  const U = DT.U;
  const UI = DT.UI;
  const A = UI.A;
  const Sc = {};

  // ================= INICIO =================
  Sc.home = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const parts = [];
    const pending = G.inbox.filter((m) => m.actions && !m.done);
    if (pending.length) {
      parts.push(`<section class="card"><div class="row between"><h2>Decisiones pendientes</h2><span class="pill gold">${pending.length}</span></div>${pending.map(Sc.msg).join('')}</section>`);
    }
    parts.push(Sc.nextMatchCard());
    // Directiva
    const M = G.manager;
    const conf = Math.round(M.conf);
    parts.push(`<section class="card">
      <div class="row between"><span class="up">Directiva</span><span class="small ${conf < 30 ? '' : 'muted'}" style="${conf < 30 ? 'color:var(--loss);font-weight:700' : ''}">Confianza ${conf}/100</span></div>
      <div class="bar ${conf < 30 ? 'bad' : conf < 50 ? 'warn' : ''}"><i style="width:${conf}%"></i></div>
      <div class="small">${M.obj ? U.esc(M.obj.text) : ''}</div>
    </section>`);
    // Tabla resumida
    if (G.season.comps[DT.divOf(t)]) {
      const comp = G.season.comps[DT.divOf(t)];
      const order = DT.S.sortTable(comp.table, comp.teams);
      const me = order.indexOf(t.id);
      const show = new Set([0, 1, 2, me - 1, me, me + 1].filter((i) => i >= 0 && i < order.length));
      const rows = [...show].sort((a, b) => a - b).map((i) => {
        const id = order[i], r = comp.table[id], tm = G.teams[id];
        return `<tr class="${id === t.id ? 'me' : ''}"><td>${i + 1}</td><td class="team" data-a="team" data-id="${id}">${U.esc(tm.n)}</td><td>${r.pj}</td><td>${r.gf - r.gc > 0 ? '+' : ''}${r.gf - r.gc}</td><td><b>${r.pts}</b></td></tr>`;
      }).join('');
      parts.push(`<section class="card"><div class="row between"><h3>${U.esc(comp.name)}</h3><button class="btn sm" data-a="tab" data-tab="comp">Ver tabla</button></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div></section>`);
    }
    // Últimos resultados
    const played = DT.S.userFixtures().filter((m) => m.p).slice(-5).reverse();
    if (played.length) {
      parts.push(`<section class="card"><h3>Últimos partidos</h3><div class="list">${played.map(Sc.fixtureRow).join('')}</div></section>`);
    }
    // Mensajes y noticias
    const msgs = G.inbox.filter((m) => !(m.actions && !m.done)).slice(0, 6);
    if (msgs.length) parts.push(`<section class="card"><h3>Mensajes</h3>${msgs.map(Sc.msg).join('')}</section>`);
    parts.push(`<section class="card"><h3>Noticias</h3><ul class="news">${G.news.slice(0, 10).map((n) => `<li><span class="tiny muted">S${n.w} · </span>${U.esc(n.t)}</li>`).join('') || '<li class="muted">Todavía no hay noticias.</li>'}</ul></section>`);
    return parts.join('');
  };

  Sc.msg = function (m) {
    const pending = m.actions && !m.done;
    m.seen = true;
    return `<div class="msg ${pending ? 'pending' : ''} ${m.kind === 'title' ? 'title' : ''}">
      <div class="row between"><b>${U.esc(m.title)}</b><span class="tiny muted">S${m.w} ${m.y}</span></div>
      <div class="small">${U.esc(m.body)}</div>
      ${pending ? `<div class="actions">${m.actions.map((a, i) => `<button class="btn sm ${i === 0 ? 'primary' : ''}" data-a="msgAct" data-id="${m.id}" data-i="${i}">${U.esc(a.label)}${a.sub ? `<span class="tiny" style="display:block;font-weight:500;opacity:.8">${U.esc(a.sub)}</span>` : ''}</button>`).join('')}</div>` : ''}
      ${m.result ? `<div class="tiny muted">${U.esc(m.result)}</div>` : ''}
    </div>`;
  };
  A.msgAct = (d) => {
    const res = DT.Act.resolve(+d.id, +d.i);
    UI.toast(res);
    DT.Main.autosave();
    UI.render();
  };

  Sc.nextMatchCard = function () {
    const G = DT.G;
    const next = DT.S.userFixtures().find((m) => !m.p);
    if (!next) {
      return `<section class="card"><span class="kicker">Temporada ${G.year}</span><div class="small">No te quedan partidos esta temporada. Tocá Continuar para avanzar hasta el cierre.</div></section>`;
    }
    const h = G.teams[next.h], a = G.teams[next.a];
    const now = next.w === G.week && next.s === G.slot;
    const when = now ? 'Hoy' : next.w === G.week ? 'Este fin de semana' : `Semana ${next.w}`;
    const comp = G.season.comps[next.c];
    const venue = next.n ? (comp.venue || 'Cancha neutral') : h.stad;
    return `<section class="card">
      <div class="row between"><span class="kicker">${U.esc(DT.S.matchLabel(next))}</span><span class="pill ${now ? 'gold' : ''}">${when}</span></div>
      <div class="matchup">
        <div class="t" data-a="team" data-id="${h.id}">${UI.badge(h, 'l')}<b>${U.esc(h.n)}</b><span class="tiny muted">Media ${DT.AI.rating(h)}</span><span>${UI.formChips(h.form)}</span></div>
        <div class="vs">vs</div>
        <div class="t" data-a="team" data-id="${a.id}">${UI.badge(a, 'l')}<b>${U.esc(a.n)}</b><span class="tiny muted">Media ${DT.AI.rating(a)}</span><span>${UI.formChips(a.form)}</span></div>
      </div>
      <div class="small muted" style="text-align:center">${U.esc(venue)}</div>
      ${(() => {
        if (next.w !== G.week) return '';
        const t = DT.userTeam();
        const list = (t.autoXI ? [] : DT.AI.lineupIssues(t)).concat(DT.AI.lineupWarnings(t));
        return list.length ? `<div class="msg pending small">${list.map(U.esc).join('<br>')}<div><button class="btn sm" data-a="tab" data-tab="squad">Revisar el once</button></div></div>` : '';
      })()}
      ${DT.isDerby(next.h, next.a) ? `<div style="text-align:center"><span class="pill gold">${U.esc(DT.isDerby(next.h, next.a))}</span></div>` : ''}
    </section>`;
  };

  Sc.fixtureRow = function (m) {
    const G = DT.G;
    const h = G.teams[m.h], a = G.teams[m.a];
    let res = '';
    if (m.p) {
      const mine = m.h === G.user ? m.hg : m.ag, theirs = m.h === G.user ? m.ag : m.hg;
      let r = mine > theirs ? 'G' : mine < theirs ? 'P' : 'E';
      if (m.pen) { const pm = m.h === G.user ? m.pen[0] : m.pen[1], pt = m.h === G.user ? m.pen[1] : m.pen[0]; r = pm > pt ? 'G' : 'P'; }
      res = `<span class="res ${r}">${r}</span>`;
    }
    return `<div class="li" data-a="matchInfo" data-id="${m.i}">
      ${res}<div class="name">${U.esc(h.s)} ${m.p ? `${m.hg}-${m.ag}${m.pen ? ` (${m.pen[0]}-${m.pen[1]} p)` : ''}` : 'vs'} ${U.esc(a.s)}<div class="sub ellipsis">${U.esc(DT.S.matchLabel(m))} · S${m.w}</div></div>
    </div>`;
  };

  A.matchInfo = (d) => {
    const G = DT.G;
    const m = G.season.matches[+d.id];
    if (!m) return;
    const h = G.teams[m.h], a = G.teams[m.a];
    const scorers = (m.sc || []).map(([side, pid, min]) => {
      const p = G.players[pid];
      return `<div class="small">${min}' ${p ? U.esc(p.n) : 'Jugador'} <span class="muted">(${U.esc(side === 0 ? h.s : a.s)})</span></div>`;
    }).join('');
    const mvp = m.mvp && G.players[m.mvp] ? `<div class="small">Figura: <b>${U.esc(G.players[m.mvp].n)}</b></div>` : '';
    UI.modal(`<span class="kicker">${U.esc(DT.S.matchLabel(m))}</span>
      <div class="matchup"><div class="t">${UI.badge(h, 'l')}<b>${U.esc(h.n)}</b></div><div class="score">${m.p ? `${m.hg}-${m.ag}` : 'vs'}</div><div class="t">${UI.badge(a, 'l')}<b>${U.esc(a.n)}</b></div></div>
      ${m.pen ? `<div class="small" style="text-align:center">Penales ${m.pen[0]}-${m.pen[1]}</div>` : ''}
      ${m.att ? `<div class="small muted" style="text-align:center">Público: ${U.num(m.att)}</div>` : ''}
      <div class="stack">${scorers || (m.p ? '<div class="small muted">Sin goles.</div>' : `<div class="small muted">Se juega en la semana ${m.w}.</div>`)}${mvp}</div>`);
  };

  // ================= PLANTEL =================
  Sc.squad = function () {
    const v = UI.sub.squad;
    const seg = `<div class="seg">${[['xi', 'Once'], ['tac', 'Táctica'], ['list', 'Plantel']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-a="sub" data-k="squad" data-v="${k}">${l}</button>`).join('')}</div>`;
    return seg + (v === 'xi' ? Sc.xi() : v === 'tac' ? Sc.tactics() : Sc.squadList());
  };

  const shortN = (p) => {
    const parts = p.n.split(' ');
    return parts.length > 1 ? parts.slice(1).join(' ') : p.n;
  };

  Sc.xi = function () {
    const G = DT.G;
    const t = DT.userTeam();
    if (!t.xi || t.xi.length !== 11) DT.AI.autoLineup(t);
    if (!t.bench) t.bench = DT.AI.pickBench(t, t.xi);
    const F = DT.FORMATIONS[t.tac.f];
    const issues = DT.AI.lineupIssues(t);
    const toks = t.xi.map((pid, i) => {
      const p = G.players[pid];
      const [fx, fy] = F.xy[i];
      // en modo ordenador la cancha es horizontal: el arco propio a la izquierda
      const x = UI.desk ? 100 - fy : fx, y = UI.desk ? fx : fy;
      if (!p) return `<button class="tok ${UI.sel && UI.sel.type === 'xi' && UI.sel.i === i ? 'sel' : ''}" style="left:${x}%;top:${y}%" data-a="pickXI" data-i="${i}"><span class="c">?</span><span class="n">Vacío</span></button>`;
      const bad = !DT.P.available(p) || DT.AI.posFactor(p.pos, F.l[i]) < 1;
      return `<button class="tok ${UI.sel && UI.sel.type === 'xi' && UI.sel.i === i ? 'sel' : ''} ${bad ? 'bad' : ''}" style="left:${x}%;top:${y}%;--c:${t.c1}" data-a="pickXI" data-i="${i}" aria-label="${U.esc(p.n)}">
        <span class="c">${p.ovr}</span><span class="n">${U.esc(shortN(p))}</span><span class="f"><i style="width:${Math.round(p.fit)}%;background:${p.fit < 60 ? '#ff9a8a' : p.fit < 78 ? '#f5c86a' : '#7be0a6'}"></i></span></button>`;
    }).join('');
    const inXI = new Set(t.xi);
    const bench = (t.bench || []).filter((id) => G.players[id] && !inXI.has(id));
    const reserves = t.squad.filter((id) => !inXI.has(id) && !bench.includes(id)).map((id) => G.players[id]).sort(UI.byPos);
    const benchPs = bench.map((id) => G.players[id]).sort(UI.byPos);
    const row = (p, type) => `<div class="li ${UI.sel && UI.sel.pid === p.id ? 'sel' : ''}" data-a="pickRes" data-id="${p.id}" data-type="${type}">
      ${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">${p.age} años ${UI.status(p)}</div></div>${UI.fitBar(p.fit)}<span class="ovr">${p.ovr}</span></div>`;
    const prev = DT.Match.preview(t);
    return `
      <section class="card">
        <div class="row between"><h2>${U.esc(t.tac.f)}</h2><span class="small muted">${DT.MENTALITY[t.tac.m]} · Presión ${DT.PRESSURE[t.tac.p].toLowerCase()}</span></div>
        <div class="grid3 small tab-nums" style="text-align:center"><div><span class="up">Ataque</span><br><b>${prev.att}</b></div><div><span class="up">Medio</span><br><b>${prev.mid}</b></div><div><span class="up">Defensa</span><br><b>${prev.def}</b></div></div>
        <label class="toggle small"><input type="checkbox" id="autoxi" data-c="autoXI" ${t.autoXI ? 'checked' : ''}> Elegir el once automáticamente antes de cada partido</label>
        ${issues.length ? `<div class="small" style="color:var(--loss)">${issues.map(U.esc).join(' ')}</div>` : ''}
        <div class="pitch ${UI.desk ? 'h' : ''}"><div class="lines"></div><div class="box top"></div><div class="box bot"></div>${toks}</div>
        <div class="small muted">Tocá un jugador y después otro (en la cancha, el banco o los suplentes) para intercambiarlos. En rojo: lesionado, suspendido o fuera de su puesto.</div>
        <button class="btn block" data-a="autoXI">Armar el mejor once</button>
      </section>
      <section class="card"><h3>Banco de suplentes</h3><div class="list">${UI.grouped(benchPs, (p) => row(p, 'bench')) || '<div class="empty small">Sin suplentes.</div>'}</div></section>
      <section class="card"><h3>Resto del plantel</h3><div class="list">${UI.grouped(reserves, (p) => row(p, 'res')) || '<div class="empty small">No hay más jugadores.</div>'}</div></section>`;
  };

  function manualEdit(t) {
    t.autoXI = false;
  }
  A.autoXI = (d, el) => {
    const t = DT.userTeam();
    if (el && el.type === 'checkbox') {
      t.autoXI = el.checked;
      if (t.autoXI) DT.AI.autoLineup(t);
    } else {
      DT.AI.autoLineup(t);
      UI.toast('Once armado con los mejores disponibles.');
    }
    UI.sel = null;
    UI.render();
  };
  A.pickXI = (d) => {
    const t = DT.userTeam();
    const i = +d.i;
    const s = UI.sel;
    if (!s) { UI.sel = { type: 'xi', i }; UI.render(); return; }
    if (s.type === 'xi') {
      if (s.i !== i) { const x = t.xi[i]; t.xi[i] = t.xi[s.i]; t.xi[s.i] = x; manualEdit(t); }
    } else {
      const old = t.xi[i];
      t.xi[i] = s.pid;
      if (s.from === 'bench') t.bench = t.bench.map((b) => (b === s.pid ? old : b)).filter(Boolean);
      manualEdit(t);
    }
    UI.sel = null;
    UI.render();
  };
  A.pickRes = (d) => {
    const t = DT.userTeam();
    const pid = +d.id;
    const s = UI.sel;
    if (!s) { UI.sel = { type: 'res', pid, from: d.type }; UI.render(); return; }
    if (s.pid === pid) { UI.sel = null; DT.UI.A.player({ id: pid }); UI.render(); return; }
    if (s.type === 'xi') {
      const old = t.xi[s.i];
      t.xi[s.i] = pid;
      if (d.type === 'bench') t.bench = t.bench.map((b) => (b === pid ? old : b)).filter(Boolean);
      manualEdit(t);
    } else if (s.from !== d.type) {
      // banco <-> resto
      const benchPid = s.from === 'bench' ? s.pid : pid;
      const resPid = s.from === 'bench' ? pid : s.pid;
      t.bench = t.bench.map((b) => (b === benchPid ? resPid : b));
    }
    UI.sel = null;
    UI.render();
  };

  Sc.tactics = function () {
    const t = DT.userTeam();
    const prev = DT.Match.preview(t);
    const forms = Object.keys(DT.FORMATIONS);
    const MDESC = ['Todos atrás: muy difícil de vencer, casi no ataca.', 'Prioriza el orden defensivo y sale de contra.', 'Balance entre ataque y defensa.', 'Busca el arco rival con más gente, deja espacios.', 'Todo al ataque: muchas llegadas para ambos lados.'];
    const PDESC = ['Espera en su campo: menos desgaste y menos tarjetas.', 'Presión normal.', 'Presiona arriba: gana el medio, pero cansa más y suma tarjetas.'];
    return `
      <section class="card">
        <h3>Formación</h3>
        <div class="chips" style="flex-wrap:wrap">${forms.map((f) => `<button class="chip ${t.tac.f === f ? 'on' : ''}" data-a="setForm" data-f="${f}">${f}</button>`).join('')}</div>
        <div class="grid3 small tab-nums" style="text-align:center"><div><span class="up">Ataque</span><br><b style="font-size:1.3rem">${prev.att}</b></div><div><span class="up">Medio</span><br><b style="font-size:1.3rem">${prev.mid}</b></div><div><span class="up">Defensa</span><br><b style="font-size:1.3rem">${prev.def}</b></div></div>
      </section>
      <section class="card">
        <h3>Mentalidad</h3>
        <div class="seg">${DT.MENTALITY.map((m, i) => `<button class="${t.tac.m === i ? 'on' : ''}" data-a="setMent" data-v="${i}">${['M. def', 'Def', 'Equil', 'Of', 'M. of'][i]}</button>`).join('')}</div>
        <div class="small"><b>${DT.MENTALITY[t.tac.m]}.</b> ${MDESC[t.tac.m]}</div>
      </section>
      <section class="card">
        <h3>Presión</h3>
        <div class="seg">${DT.PRESSURE.map((m, i) => `<button class="${t.tac.p === i ? 'on' : ''}" data-a="setPress" data-v="${i}">${m}</button>`).join('')}</div>
        <div class="small">${PDESC[t.tac.p]}</div>
      </section>
      <section class="card flat small muted">Consejo: si jugás dos partidos por semana, rotá a los cansados (barra de físico baja). Un jugador fuera de su puesto rinde bastante menos.</section>`;
  };
  A.setForm = (d) => {
    const t = DT.userTeam();
    t.tac.f = d.f;
    // reacomodar el once a la nueva formación
    if (t.autoXI) DT.AI.autoLineup(t);
    else t.xi = DT.AI.pickXI(t);
    UI.render();
  };
  A.setMent = (d) => { DT.userTeam().tac.m = +d.v; UI.render(); };
  A.setPress = (d) => { DT.userTeam().tac.p = +d.v; UI.render(); };

  Sc.squadList = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const sort = UI.sub.squadSort || 'pos';
    const ps = t.squad.map((id) => G.players[id]);
    const sorters = {
      pos: UI.byPos,
      ovr: (a, b) => b.ovr - a.ovr,
      age: (a, b) => a.age - b.age,
      val: (a, b) => DT.P.value(b) - DT.P.value(a),
      w: (a, b) => b.w - a.w,
      cy: (a, b) => a.cy - b.cy,
      g: (a, b) => b.st.g - a.st.g,
    };
    ps.sort(sorters[sort]);
    const rowOf = (p) => `<div class="li" data-a="player" data-id="${p.id}">
        ${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">${p.age} años · ${U.money(p.w)}/año · ${p.cy} ${p.cy === 1 ? 'año' : 'años'} ${sort === 'g' ? `· ${p.st.g} goles` : ''} ${UI.status(p)}</div></div>
        <div class="stack" style="gap:3px;align-items:flex-end">${UI.stars(p.pot)}${UI.fitBar(p.fit)}</div><span class="ovr">${p.ovr}</span></div>`;
    const payroll = DT.E.payroll(t), cap = DT.E.wageCap(t);
    return `
      <section class="card">
        <div class="kv"><div><span>Jugadores</span><b>${ps.length}</b></div><div><span>Edad prom.</span><b>${U.avg(ps, (p) => p.age).toFixed(1)}</b></div><div><span>Media</span><b>${DT.AI.rating(t)}</b></div></div>
        <div class="row between small"><span>Masa salarial: <b>${U.money(payroll)}</b>/año · tope ${U.money(cap)}</span><button class="btn sm" data-a="capRaise">Pedir más</button></div>
        <div class="bar ${payroll > cap ? 'bad' : payroll > cap * 0.9 ? 'warn' : ''}"><i style="width:${Math.min(100, (payroll / cap) * 100)}%"></i></div>
        <div class="chips">${[['pos', 'Puesto'], ['ovr', 'Media'], ['age', 'Edad'], ['val', 'Valor'], ['w', 'Sueldo'], ['cy', 'Contrato'], ['g', 'Goles']].map(([k, l]) => `<button class="chip ${sort === k ? 'on' : ''}" data-a="squadSort" data-v="${k}">${l}</button>`).join('')}</div>
      </section>
      <section class="card"><div class="list">${sort === 'pos' ? UI.grouped(ps, rowOf) : ps.map(rowOf).join('')}</div></section>`;
  };
  A.squadSort = (d) => { UI.sub.squadSort = d.v; UI.render(); };

  // ================= TORNEOS =================
  Sc.comp = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const SS = G.season;
    if (!UI.compSel || (!SS.comps[UI.compSel] && !['OTH', 'CAL'].includes(UI.compSel))) UI.compSel = DT.divOf(t) || 'LIB';
    const cc = UI.compCountry || t.cc;
    const hasB = !!SS.comps['B_' + cc];
    const chips = [
      ['L_' + cc, hasB ? 'Primera' : 'Liga'],
      ...(hasB ? [['B_' + cc, 'Segunda']] : []),
      ['C_' + cc, 'Copa'],
      ['LIB', 'Libertadores'],
      ['SUD', 'Sudamericana'],
      ['OTH', 'Recopa e Intercontinental'],
      ['CAL', 'Mi calendario'],
    ];
    const head = `<div class="chips">${DT.COUNTRY_ORDER.map((c) => `<button class="chip ${cc === c ? 'on' : ''}" data-a="compCountry" data-cc="${c}">${DT.COUNTRIES[c].flag} ${c}</button>`).join('')}</div>
      <div class="chips">${chips.map(([id, l]) => `<button class="chip ${UI.compSel === id ? 'on' : ''}" data-a="compSel" data-id="${id}">${l}</button>`).join('')}</div>`;
    let body = '';
    const sel = UI.compSel;
    if (sel === 'CAL') body = Sc.calendar();
    else if (sel === 'OTH') body = Sc.otherComps();
    else {
      const comp = SS.comps[sel];
      if (!comp) body = '<div class="empty">Competencia no disponible.</div>';
      else if (comp.type === 'league') body = Sc.league(comp);
      else if (comp.type === 'cup') body = Sc.cup(comp);
      else if (comp.type === 'cont') body = Sc.continental(comp);
    }
    return head + body;
  };
  A.compCountry = (d) => {
    UI.compCountry = d.cc;
    if (UI.compSel && /^[LBC]_/.test(UI.compSel)) {
      UI.compSel = UI.compSel.slice(0, 2) + d.cc;
      if (!DT.G.season.comps[UI.compSel]) UI.compSel = 'L_' + d.cc;
    }
    UI.round = null;
    UI.render();
  };
  A.compSel = (d) => { UI.compSel = d.id; UI.round = null; UI.render(); };

  Sc.league = function (comp) {
    const G = DT.G;
    const v = UI.sub.compView;
    const C = DT.COUNTRIES[comp.cc];
    const seg = `<div class="seg">${[['table', 'Tabla'], ['round', 'Fechas'], ['scorers', 'Goleadores']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-a="sub" data-k="compView" data-v="${k}">${l}</button>`).join('')}</div>`;
    let body = '';
    if (v === 'table') {
      const order = DT.S.sortTable(comp.table, comp.teams);
      const n = order.length;
      const second = comp.div === 2;
      const rows = order.map((id, i) => {
        const r = comp.table[id], tm = G.teams[id];
        const zone = second ? (i < C.rel ? 'lib' : '') : i < C.lib ? 'lib' : i < C.lib + C.sud ? 'sud' : i >= n - C.rel ? 'rel' : '';
        return `<tr class="${DT.isUser(id) ? 'me' : ''}"><td class="zone ${zone}">${i + 1}</td><td class="team" data-a="team" data-id="${id}">${U.esc(tm.n)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf - r.gc > 0 ? '+' : ''}${r.gf - r.gc}</td><td><b>${r.pts}</b></td></tr>`;
      }).join('');
      body = `<section class="card"><h3>${U.esc(comp.name)} ${G.year}</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${second
    ? `<div class="legend"><span><i style="background:var(--lib)"></i>Ascenso a ${U.esc(C.league)}</span></div><div class="tiny muted">Suben los ${C.rel} primeros. En la segunda división no hay descenso.</div></section>`
    : `<div class="legend"><span><i style="background:var(--lib)"></i>Libertadores</span><span><i style="background:var(--sud)"></i>Sudamericana</span><span><i style="background:var(--rel)"></i>Descenso${C.div2 ? ` a ${U.esc(C.div2.name)}` : ''}</span></div>
        <div class="tiny muted">El campeón de la ${U.esc(C.cup)} también clasifica a la Libertadores.</div></section>`}`;
    } else if (v === 'round') {
      const all = Object.values(G.season.matches).filter((m) => m.c === comp.id);
      const nextR = (all.filter((m) => !m.p).sort((a, b) => a.st - b.st)[0] || { st: comp.rounds }).st;
      const r = U.clamp(UI.round || nextR, 1, comp.rounds);
      const ms = all.filter((m) => m.st === r);
      body = `<section class="card">
        <div class="row between"><button class="btn sm" data-a="round" data-v="${r - 1}" ${r <= 1 ? 'disabled' : ''}>◀</button><h3>Fecha ${r} <span class="small muted">· semana ${ms[0] ? ms[0].w : ''}</span></h3><button class="btn sm" data-a="round" data-v="${r + 1}" ${r >= comp.rounds ? 'disabled' : ''}>▶</button></div>
        <div class="list">${ms.map(Sc.resultRow).join('')}</div></section>`;
    } else {
      const ps = Object.values(G.players).filter((p) => p.t && DT.divOf(G.teams[p.t]) === comp.id && p.st.g > 0).sort((a, b) => b.st.g - a.st.g || a.st.pj - b.st.pj).slice(0, 20);
      body = `<section class="card"><h3>Goleadores</h3><div class="list">${ps.map((p, i) => `<div class="li" data-a="player" data-id="${p.id}"><span class="muted tab-nums" style="width:20px">${i + 1}</span>${UI.badge(G.teams[p.t], 's')}<div class="name">${U.esc(p.n)}<div class="sub">${U.esc(G.teams[p.t].n)} · ${p.st.pj} PJ · ${p.st.a} asist.</div></div><span class="ovr">${p.st.g}</span></div>`).join('') || '<div class="empty small">Todavía no hubo goles.</div>'}</div></section>`;
    }
    return seg + body;
  };
  A.round = (d) => { UI.round = +d.v; UI.render(); };

  Sc.resultRow = function (m) {
    const G = DT.G;
    const h = G.teams[m.h], a = G.teams[m.a];
    const me = DT.isUser(m.h) || DT.isUser(m.a);
    return `<div class="li" data-a="matchInfo" data-id="${m.i}" style="${me ? 'background:var(--accent-soft)' : ''}">
      <div class="name" style="text-align:right">${U.esc(h.n)}</div>${UI.badge(h, 's')}
      <b class="tab-nums" style="min-width:52px;text-align:center">${m.p ? `${m.hg} - ${m.ag}` : '–'}</b>
      ${UI.badge(a, 's')}<div class="name">${U.esc(a.n)}</div></div>`;
  };

  Sc.tieRow = function (tid) {
    const G = DT.G;
    const tie = G.season.ties[tid];
    const a = G.teams[tie.a], b = G.teams[tie.b];
    const legs = tie.legs.map((i) => G.season.matches[i]);
    let detail;
    if (tie.single) {
      const m = legs[0];
      detail = m.p ? `${G.teams[m.h].s} ${m.hg}-${m.ag} ${G.teams[m.a].s}${m.pen ? ` (pen. ${m.pen[0]}-${m.pen[1]})` : ''}` : `Semana ${m.w}`;
    } else {
      detail = legs.map((m, k) => (m.p ? `${k === 0 ? 'Ida' : 'Vuelta'} ${m.hg}-${m.ag}${m.pen ? ` (pen. ${m.pen[0]}-${m.pen[1]})` : ''}` : `${k === 0 ? 'Ida' : 'Vuelta'} S${m.w}`)).join(' · ');
    }
    const me = DT.isUser(tie.a) || DT.isUser(tie.b);
    const w = tie.winner;
    return `<div class="li" style="${me ? 'background:var(--accent-soft)' : ''}" data-a="matchInfo" data-id="${tie.legs[tie.legs.length - 1]}">
      <div class="name"><span style="${w && w !== tie.a ? 'opacity:.5' : ''}">${U.esc(a.n)}</span> <span class="muted">vs</span> <span style="${w && w !== tie.b ? 'opacity:.5' : ''}">${U.esc(b.n)}</span><div class="sub">${detail}</div></div>
      ${w ? `<span class="pill ok">${U.esc(G.teams[w].s)}</span>` : ''}</div>`;
  };

  Sc.cup = function (comp) {
    const G = DT.G;
    const ties = Object.values(G.season.ties).filter((t) => t.c === comp.id);
    const stages = [...new Set(ties.map((t) => t.stage))];
    const body = stages.reverse().map((st) => `<section class="card"><h3>${DT.S.cupStageName(comp, st)}</h3><div class="list">${ties.filter((t) => t.stage === st).map((t) => Sc.tieRow(t.id)).join('')}</div></section>`).join('');
    return `<section class="card"><div class="row between"><h3>${U.esc(comp.name)} ${G.year}</h3>${comp.champion ? `<span class="pill gold">Campeón: ${U.esc(G.teams[comp.champion].n)}</span>` : ''}</div><div class="small muted">Eliminación directa a un partido; empate se define por penales. ${comp.byes.length ? `Arrancan en la 2ª ronda: ${comp.byes.map((id) => G.teams[id].s).join(', ')}.` : ''}</div></section>${body}`;
  };

  Sc.continental = function (comp) {
    const G = DT.G;
    const v = UI.sub.contView || 'groups';
    const seg = `<div class="seg">${[['groups', 'Grupos'], ['ko', 'Eliminatorias']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-a="sub" data-k="contView" data-v="${k}">${l}</button>`).join('')}</div>`;
    let body = '';
    if (v === 'groups') {
      body = comp.groups.map((g, gi) => {
        const order = DT.S.groupStandings(comp, gi);
        return `<section class="card"><h3>Grupo ${'ABCDEFGH'[gi]}</h3><div class="tablewrap"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${order.map((id, i) => {
          const r = comp.gtable[id];
          const zone = i < 2 ? 'lib' : i === 2 ? 'sud' : '';
          return `<tr class="${DT.isUser(id) ? 'me' : ''}"><td class="zone ${zone}">${i + 1}</td><td class="team" data-a="team" data-id="${id}">${DT.COUNTRIES[G.teams[id].cc].flag} ${U.esc(G.teams[id].n)}</td><td>${r.pj}</td><td>${r.gf - r.gc}</td><td><b>${r.pts}</b></td></tr>`;
        }).join('')}</tbody></table></div></section>`;
      }).join('');
      body = `<div class="legend"><span><i style="background:var(--lib)"></i>Octavos</span><span><i style="background:var(--sud)"></i>${comp.id === 'LIB' ? 'Pasa a playoffs de la Sudamericana' : 'Playoffs vs. terceros de la Libertadores'}</span></div>` + body;
    } else {
      const order = ['F', 'SF', 'QF', 'R16', 'PO'];
      body = order.filter((st) => comp.ko[st]).map((st) => `<section class="card"><h3>${DT.S.STAGE_NAMES[st]}${st === 'F' && comp.venue ? ` <span class="small muted">· ${U.esc(comp.venue)}</span>` : ''}</h3><div class="list">${comp.ko[st].map(Sc.tieRow).join('')}</div></section>`).join('') || '<div class="empty">Las eliminatorias empiezan después de la fase de grupos (semana 17).</div>';
    }
    const champ = comp.champion ? `<span class="pill gold">Campeón: ${U.esc(G.teams[comp.champion].n)}</span>` : '';
    return `<section class="card"><div class="row between"><h3>${U.esc(comp.name)} ${G.year}</h3>${champ}</div><div class="small muted">32 equipos en 8 grupos. Octavos, cuartos y semis a ida y vuelta; final única.</div></section>${seg}${body}`;
  };

  Sc.otherComps = function () {
    const G = DT.G;
    const SS = G.season;
    const parts = [];
    if (SS.comps.REC && SS.comps.REC.tie) parts.push(`<section class="card"><h3>Recopa Sudamericana</h3><div class="small muted">Campeón de la Libertadores vs. campeón de la Sudamericana del año anterior.</div><div class="list">${Sc.tieRow(SS.comps.REC.tie)}</div></section>`);
    else parts.push('<section class="card"><h3>Recopa Sudamericana</h3><div class="small muted">No se disputa este año.</div></section>');
    const it = SS.comps.INT;
    parts.push(`<section class="card"><h3>Copa Intercontinental</h3><div class="small muted">El campeón de la Libertadores enfrenta al campeón de Europa (${U.esc(G.teams[G.euroChamp].n)}) en la semana 45.</div>${it.tie ? `<div class="list">${Sc.tieRow(it.tie)}</div>` : ''}</section>`);
    return parts.join('');
  };

  Sc.calendar = function () {
    const fx = DT.S.userFixtures();
    return `<section class="card"><h3>Mis partidos ${DT.G.year}</h3><div class="list">${fx.map(Sc.fixtureRow).join('') || '<div class="empty">Sin partidos.</div>'}</div></section>`;
  };

  return Sc;
})();

// Pantallas: Mercado, Club, fichas de jugador y equipo, negociaciones.
(function () {
  const U = DT.U;
  const UI = DT.UI;
  const A = UI.A;
  const Sc = DT.Screens;

  // ================= MERCADO =================
  Sc.market = function () {

    const v = UI.sub.market;
    const open = DT.S.windowOpen();
    const seg = `<div class="seg">${[['search', 'Buscar'], ['free', 'Libres'], ['mine', 'Mis ventas']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-a="sub" data-k="market" data-v="${k}">${l}</button>`).join('')}</div>`;
    const head = `<section class="card">
      <div class="row between"><span class="up">Libro de pases</span>${open ? '<span class="pill ok">Abierto</span>' : '<span class="pill">Cerrado</span>'}</div>
      <div class="small">${open ? 'Podés comprar y vender hasta la semana ' + (G.week <= 4 ? 4 : 26) + '.' : `Abre en la semana ${G.week < 21 ? 21 : 0 + ' de la próxima temporada'}. Los jugadores libres se pueden fichar siempre.`}</div>
      <div class="kv"><div><span>Presupuesto</span><b>${U.money(DT.M.budget(t))}</b></div><div><span>Sueldos/año</span><b>${U.money(DT.E.payroll(t))}</b></div><div><span>Tope sueldos</span><b>${U.money(DT.E.wageCap(t))}</b></div></div>
    </section>`;
    if (v === 'mine') return seg + head + Sc.mySales();
    const f = UI.filters;
    const free = v === 'free';
    let ps = Object.values(G.players).filter((p) => (free ? !p.t : p.t && p.t !== t.id && !G.teams[p.t].eur));
    if (f.pos) ps = ps.filter((p) => p.pos === f.pos);
    if (!free && f.cc) ps = ps.filter((p) => G.teams[p.t].cc === f.cc && DT.inLeague(G.teams[p.t]));
    if (f.age < 40) ps = ps.filter((p) => p.age <= f.age);
    if (f.minOvr) ps = ps.filter((p) => p.ovr >= f.minOvr);
    if (f.q) { const q = f.q.toLowerCase(); ps = ps.filter((p) => p.n.toLowerCase().includes(q)); }
    const withVal = ps.map((p) => ({ p, v: DT.P.value(p) }));
    let list = withVal;
    if (!free && f.max) list = list.filter((x) => x.v <= f.max);
    const sorters = { ovr: (a, b) => b.p.ovr - a.p.ovr, pot: (a, b) => b.p.pot - a.p.pot, val: (a, b) => a.v - b.v, age: (a, b) => a.p.age - b.p.age };
    list.sort(sorters[f.sort] || sorters.ovr);
    const total = list.length;
    list = list.slice(0, 60);
    const opt = (val, cur, label) => `<option value="${val}" ${String(cur) === String(val) ? 'selected' : ''}>${label}</option>`;
    const filters = `<section class="card">
      <div class="chips">${[['', 'Todos'], ['P', 'Arqueros'], ['D', 'Defensores'], ['M', 'Mediocampistas'], ['A', 'Delanteros']].map(([k, l]) => `<button class="chip ${f.pos === k ? 'on' : ''}" data-a="fPos" data-v="${k}">${l}</button>`).join('')}</div>
      <input type="text" id="fq" placeholder="Buscar por nombre" value="${U.esc(f.q)}" data-c="fQ">
      <div class="grid2">
        ${free ? '' : `<select id="fcc" data-c="fSel" data-k="cc" aria-label="Liga">${opt('', f.cc, 'Liga: todas')}${DT.COUNTRY_ORDER.map((c) => opt(c, f.cc, DT.COUNTRIES[c].name)).join('')}</select>`}
        ${free ? '' : `<select id="fmax" data-c="fSel" data-k="max" aria-label="Valor máximo">${[[0, 'Valor: todos'], [300000, 'Hasta $300 K'], [1e6, 'Hasta $1 M'], [3e6, 'Hasta $3 M'], [6e6, 'Hasta $6 M'], [12e6, 'Hasta $12 M'], [25e6, 'Hasta $25 M']].map(([a, b]) => opt(a, f.max, b)).join('')}</select>`}
        <select id="fage" data-c="fSel" data-k="age" aria-label="Edad máxima">${[[40, 'Edad: todas'], [21, 'Sub 21'], [23, 'Sub 23'], [27, 'Hasta 27'], [30, 'Hasta 30']].map(([a, b]) => opt(a, f.age, b)).join('')}</select>
        <select id="fmin" data-c="fSel" data-k="minOvr" aria-label="Media mínima">${[[0, 'Media: todas'], [60, 'Media 60+'], [65, 'Media 65+'], [70, 'Media 70+'], [75, 'Media 75+'], [80, 'Media 80+']].map(([a, b]) => opt(a, f.minOvr, b)).join('')}</select>
        <select id="fsort" data-c="fSel" data-k="sort" aria-label="Ordenar">${[['ovr', 'Orden: media'], ['pot', 'Orden: potencial'], ['val', 'Orden: precio'], ['age', 'Orden: edad']].map(([a, b]) => opt(a, f.sort, b)).join('')}</select>
      </div>
    </section>`;
    const rows = list.map(({ p, v: val }) => {
      const tm = p.t ? G.teams[p.t] : null;
      return `<div class="li" data-a="player" data-id="${p.id}">${UI.pos(p)}
        <div class="name">${U.esc(p.n)}<div class="sub ellipsis">${tm ? U.esc(tm.n) : 'Libre'} · ${p.age} años · ${free ? `pide ${U.money(DT.P.demand(p, t).w)}/año` : U.money(val)}</div></div>
        ${UI.potOf(p)}<span class="ovr">${p.ovr}</span></div>`;
    }).join('');
    return seg + head + filters + `<section class="card"><div class="small muted">${total} jugadores${total > 60 ? ' (se muestran los primeros 60)' : ''}</div><div class="list">${rows || '<div class="empty">No hay jugadores con esos filtros.</div>'}</div></section>`;
  };
  A.fPos = (d) => { UI.filters.pos = d.v; UI.render(); };
  A.fQ = (d, el) => { UI.filters.q = el.value.trim(); UI.render(); };
  A.fSel = (d, el) => { const k = d.k; UI.filters[k] = ['max', 'age', 'minOvr'].includes(k) ? +el.value : el.value; UI.render(); };

  Sc.mySales = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const listed = t.squad.map((id) => G.players[id]).filter((p) => p.lst);
    const offers = G.inbox.filter((m) => m.kind === 'transfer' && m.actions && !m.done);
    return `<section class="card"><h3>Ofertas recibidas</h3>${offers.map(Sc.msg).join('') || '<div class="small muted">No hay ofertas. Poné jugadores en venta para atraer compradores; las ofertas llegan con el libro de pases abierto.</div>'}</section>
      <section class="card"><h3>Jugadores en venta</h3><div class="list">${listed.map((p) => `<div class="li" data-a="player" data-id="${p.id}">${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">Valor ${U.money(DT.P.value(p))}</div></div><span class="ovr">${p.ovr}</span></div>`).join('') || '<div class="small muted">Ninguno. Abrí la ficha de un jugador y tocá "Poner en venta".</div>'}</div></section>
      <section class="card"><h3>Cedidos a préstamo</h3><div class="list">${Object.values(G.players).filter((p) => p.loan && p.loan.from === t.id).map((p) => `<div class="li" data-a="player" data-id="${p.id}">${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">En ${U.esc(G.teams[p.t].n)} · ${p.st.pj} PJ · ${p.st.g} goles</div></div><span class="ovr">${p.ovr}</span></div>`).join('') || '<div class="small muted">No tenés jugadores cedidos.</div>'}</div></section>
      <section class="card"><h3>Vendidos al exterior</h3><div class="list">${G.abroad.slice(0, 15).map((x) => `<div class="li"><div class="name">${U.esc(x.n)}<div class="sub">${U.esc(x.from || '')} → ${U.esc(x.club)} · ${x.y}</div></div><b class="tab-nums">${U.money(x.fee)}</b></div>`).join('') || '<div class="small muted">Todavía no hubo ventas al exterior.</div>'}</div></section>`;
  };

  // ================= FICHA DE JUGADOR =================
  A.player = (d) => {
    const G = DT.G;
    const p = G.players[+d.id];
    if (!p) return;
    const me = DT.userTeam();
    const mine = p.t === me.id;
    const tm = p.t ? G.teams[p.t] : null;
    const val = DT.P.value(p);
    const avg = DT.P.avgRating(p);
    let actions = '';
    const known = DT.M.known(p);
    if (mine && p.loan) {
      actions = `<div class="small muted">Está a préstamo desde ${U.esc(G.teams[p.loan.from] ? G.teams[p.loan.from].n : 'otro club')} y vuelve a fin de temporada.</div><button class="btn block" data-a="editName" data-id="${p.id}">Editar nombre</button>`;
    } else if (mine) {
      actions = `<div class="grid2">
        <button class="btn" data-a="renewOpen" data-id="${p.id}">Renovar contrato</button>
        <button class="btn" data-a="toggleList" data-id="${p.id}">${p.lst ? 'Quitar de venta' : 'Poner en venta'}</button>
        <button class="btn" data-a="loanOutOpen" data-id="${p.id}">Ceder a préstamo</button>
        <button class="btn" data-a="editName" data-id="${p.id}">Editar nombre</button>
        <button class="btn danger" data-a="releaseOpen" data-id="${p.id}">Rescindir</button>
      </div>`;
    } else if (tm && !tm.eur) {
      actions = `<button class="btn primary block" data-a="buyOpen" data-id="${p.id}">Hacer una oferta</button>
        <div class="grid2">
          <button class="btn" data-a="loanInOpen" data-id="${p.id}">Pedir a préstamo</button>
          <button class="btn" data-a="compare" data-id="${p.id}">Comparar</button>
          ${known ? '' : `<button class="btn" data-a="scout" data-id="${p.id}">Enviar ojeador (${U.money(DT.M.scoutCost(me))})</button>`}
          <button class="btn" data-a="editName" data-id="${p.id}">Editar nombre</button>
        </div>`;
    } else if (!tm) {
      actions = `<button class="btn primary block" data-a="contractOpen" data-id="${p.id}" data-fee="0">Ofrecer contrato (libre)</button><button class="btn block" data-a="compare" data-id="${p.id}">Comparar con mi plantel</button>`;
    }
    UI.modal(`
      <div class="row">${tm ? UI.badge(tm, 'l') : ''}<div class="grow"><h2>${U.esc(p.n)}</h2><div class="small muted">${U.posLong[p.pos]} · ${p.age} años · ${tm ? `<span data-a="team" data-id="${tm.id}" style="text-decoration:underline">${U.esc(tm.n)}</span>` : 'Jugador libre'}</div></div><div class="score" style="font-size:2.4rem">${p.ovr}</div></div>
      <div class="row wrap">${UI.status(p)} ${UI.morale(p.mor)} ${p.yt ? '<span class="pill">Cantera</span>' : ''}</div>
      <div class="kv">
        <div><span>Potencial</span><b>${UI.potOf(p)}</b></div>
        <div><span>Valor</span><b>${U.money(val)}</b></div>
        <div><span>Sueldo/año</span><b>${U.money(p.w)}</b></div>
        <div><span>Contrato</span><b>${p.t ? `${p.cy} ${p.cy === 1 ? 'año' : 'años'}` : '—'}</b></div>
        <div><span>Físico</span><b>${Math.round(p.fit)}%</b></div>
        <div><span>Moral</span><b>${Math.round(p.mor)}</b></div>
      </div>
      <h3>Temporada ${G.year}</h3>
      <div class="kv"><div><span>Partidos</span><b>${p.st.pj}</b></div><div><span>Goles</span><b>${p.st.g}</b></div><div><span>Asist.</span><b>${p.st.a}</b></div><div><span>Promedio</span><b>${avg ? avg.toFixed(2) : '—'}</b></div><div><span>Carrera PJ</span><b>${p.car.pj}</b></div><div><span>Carrera goles</span><b>${p.car.g}</b></div></div>
      ${p.fm.length ? `<div class="small">Últimas notas: ${p.fm.map((r) => `<b>${r.toFixed(1)}</b>`).join(' · ')}</div>` : ''}
      ${mine && p.cy <= 1 ? '<div class="small" style="color:var(--warn)">Termina contrato a fin de año: si no renueva, se va libre.</div>' : ''}
      ${actions}`);
  };

  A.team = (d) => {
    const G = DT.G;
    const t = G.teams[d.id];
    if (!t) return;
    const ps = t.squad.map((id) => G.players[id]).sort(UI.byPos);
    const titles = (t.titles || []).slice(-8).reverse();
    UI.modal(`
      <div class="row">${UI.badge(t, 'xl')}<div class="grow"><h2>${U.esc(t.n)}</h2><div class="small muted">${t.eur ? 'Europa' : `${DT.COUNTRIES[t.cc].flag} ${U.esc(DT.COUNTRIES[t.cc].name)} · ${U.esc(DT.divName(t))}`}</div></div></div>
      ${t.eur ? '' : `<div class="kv"><div><span>Media</span><b>${DT.AI.rating(t)}</b></div><div><span>Reputación</span><b>${Math.round(t.rep)}</b></div><div><span>Socios</span><b>${U.num(t.socios)}</b></div><div><span>Estadio</span><b class="ellipsis" style="font-size:.95rem">${U.esc(t.stad)}</b></div><div><span>Capacidad</span><b>${U.num(t.cap)}</b></div><div><span>Formación</span><b>${t.tac.f}</b></div></div>`}
      ${titles.length ? `<div class="small">Títulos recientes: ${titles.map((x) => `${U.esc(x.c)} ${x.y}`).join(' · ')}</div>` : ''}
      <div class="list">${UI.grouped(ps, (p) => `<div class="li" data-a="player" data-id="${p.id}">${UI.pos(p)}<div class="name">${U.esc(p.n)}<div class="sub">${p.age} años · ${U.money(DT.P.value(p))}</div></div>${UI.potOf(p)}<span class="ovr">${p.ovr}</span></div>`)}</div>`);
  };

  A.scout = (d) => {
    const r = DT.M.scout(+d.id);
    if (!r.ok) { UI.toast(r.msg); return; }
    A.player(d);
    UI.toast(r.msg, 5200);
  };

  A.compare = (d) => {
    const G = DT.G;
    const p = G.players[+d.id];
    const me = DT.userTeam();
    const mine = me.squad.map((id) => G.players[id]).filter((x) => x.pos === p.pos).sort((a, b) => b.ovr - a.ovr).slice(0, 2);
    const cols = [p].concat(mine);
    const row = (label, f, best) => {
      const vals = cols.map(f);
      const nums = vals.map((v) => (typeof v === 'number' ? v : null));
      const bi = best ? nums.indexOf(best === 'max' ? Math.max(...nums.filter((x) => x !== null)) : Math.min(...nums.filter((x) => x !== null))) : -1;
      return `<tr><td style="text-align:left" class="muted">${label}</td>${vals.map((v, i) => `<td style="${i === bi ? 'color:var(--win);font-weight:700' : ''}">${typeof v === 'number' && label !== 'Edad' && label !== 'Media' && label !== 'Partidos' && label !== 'Goles' && label !== 'Contrato' ? (label === 'Promedio' ? (v ? v.toFixed(2) : '—') : U.money(v)) : v}</td>`).join('')}</tr>`;
    };
    UI.modal(`<h3>Comparar ${U.esc(U.posLong[p.pos].toLowerCase())}s</h3>
      <div class="tablewrap"><table><thead><tr><th></th>${cols.map((c, i) => `<th style="text-align:right;${i === 0 ? 'color:var(--accent)' : ''}">${U.esc(c.n.split(' ').slice(-1)[0])}</th>`).join('')}</tr></thead><tbody>
        ${row('Media', (c) => c.ovr, 'max')}
        ${row('Edad', (c) => c.age)}
        <tr><td style="text-align:left" class="muted">Potencial</td>${cols.map((c) => `<td>${UI.potOf(c)}</td>`).join('')}</tr>
        ${row('Valor', (c) => DT.P.value(c))}
        ${row('Sueldo', (c) => c.w, 'min')}
        ${row('Contrato', (c) => (c.t ? c.cy : 0))}
        ${row('Partidos', (c) => c.st.pj, 'max')}
        ${row('Goles', (c) => c.st.g, 'max')}
        ${row('Promedio', (c) => DT.P.avgRating(c), 'max')}
      </tbody></table></div>
      <div class="small muted">La primera columna es el jugador que estás mirando; las otras, tus mejores ${U.esc(U.posLong[p.pos].toLowerCase())}s.</div>
      <button class="btn block" data-a="player" data-id="${p.id}">Volver a la ficha</button>`);
  };

  A.loanOutOpen = (d) => {
    const G = DT.G;
    const p = G.players[+d.id];
    if (!DT.S.windowOpen()) { UI.toast('Las cesiones se hacen con el libro de pases abierto (semanas 0–4 y 21–26).'); return; }
    const offs = DT.M.loanOutOffers(p.id);
    UI.modal(`<h3>Ceder a ${U.esc(p.n)}</h3><div class="small muted">Se va hasta fin de temporada, el otro club le paga el sueldo y vuelve con más minutos encima.</div>
      <div class="list">${offs.map((o) => `<div class="li" data-a="loanOutDo" data-id="${p.id}" data-tid="${o.tid}" data-fee="${o.fee}">${UI.badge(G.teams[o.tid])}<div class="name">${U.esc(G.teams[o.tid].n)}<div class="sub">${o.starter ? 'Sería titular' : 'Pelearía el puesto'} · ${o.fee ? `paga ${U.money(o.fee)}` : 'sin cargo'}</div></div><span class="btn sm primary">Ceder</span></div>`).join('') || '<div class="empty small">Ningún club lo pidió por ahora.</div>'}</div>
      <button class="btn block" data-a="player" data-id="${p.id}">Volver</button>`);
  };
  A.loanOutDo = (d) => {
    const r = DT.M.loanOut(+d.id, d.tid, +d.fee);
    UI.closeModal();
    UI.toast(r.msg, 4000);
    if (r.ok) DT.Main.autosave();
    UI.render();
  };
  A.loanInOpen = (d) => {
    const G = DT.G;
    const p = G.players[+d.id];
    if (!DT.S.windowOpen()) { UI.toast('Los préstamos se piden con el libro de pases abierto (semanas 0–4 y 21–26).'); return; }
    UI.modal(`<h3>Pedir a préstamo a ${U.esc(p.n)}</h3>
      <div class="small">Viene hasta fin de temporada. Costo del préstamo: <b>${U.money(DT.M.loanInFee(p))}</b> y te hacés cargo de su sueldo (${U.money(p.w)}/año). Los clubes no suelen ceder a sus titulares, salvo juveniles.</div>
      <button class="btn primary block" data-a="loanInDo" data-id="${p.id}">Pedirlo</button><button class="btn block" data-a="player" data-id="${p.id}">Volver</button>`);
  };
  A.loanInDo = (d) => {
    const r = DT.M.loanIn(+d.id);
    UI.closeModal();
    UI.toast(r.msg, 4000);
    if (r.ok) DT.Main.autosave();
    UI.render();
  };
  A.capRaise = () => {
    const r = DT.Board.askCapRaise();
    UI.toast(r.msg, 4500);
    if (NEG.pid && document.querySelector('#modal:not([hidden]) [data-a="negContract"]')) { NEG.msg = r.msg; renderContract(); }
    else UI.render();
  };

  A.toggleList = (d) => {
    const p = DT.G.players[+d.id];
    p.lst = !p.lst;
    UI.toast(p.lst ? `${p.n} está en venta. Las ofertas llegan con el mercado abierto.` : `${p.n} ya no está en venta.`);
    A.player(d);
    UI.render();
  };

  A.editName = (d) => {
    const p = DT.G.players[+d.id];
    UI.modal(`<h3>Editar nombre</h3><div class="small muted">Corregí o actualizá el nombre del jugador.</div><input type="text" id="newname" value="${U.esc(p.n)}" maxlength="40"><button class="btn primary block" data-a="saveName" data-id="${p.id}">Guardar</button>`);
  };
  A.saveName = (d) => {
    const p = DT.G.players[+d.id];
    const v = (document.getElementById('newname').value || '').trim();
    if (v) p.n = v;
    A.player(d);
    UI.render();
  };

  A.releaseOpen = (d) => {
    const p = DT.G.players[+d.id];
    const cost = DT.M.releaseCost(p);
    UI.modal(`<h3>Rescindir a ${U.esc(p.n)}</h3><div class="small">Hay que pagarle la mitad de lo que le queda de contrato: <b>${U.money(cost)}</b>. Queda libre y puede firmar con otro club.</div><button class="btn danger block" data-a="releaseDo" data-id="${p.id}">Confirmar rescisión</button><button class="btn block" data-a="player" data-id="${p.id}">Volver</button>`);
  };
  A.releaseDo = (d) => {
    const me = DT.userTeam();
    if (me.squad.length <= 16) { UI.toast('No podés quedarte con menos de 16 jugadores.'); return; }
    DT.M.releaseUser(+d.id);
    UI.closeModal();
    UI.toast('Contrato rescindido.');
    UI.render();
  };

  // ---------- negociaciones ----------
  const NEG = {};
  function stepFor(v) {
    if (v >= 1e7) return 500000;
    if (v >= 2e6) return 100000;
    if (v >= 5e5) return 25000;
    if (v >= 1e5) return 10000;
    return 2000;
  }
  A.buyOpen = (d) => {
    const G = DT.G;
    const p = G.players[+d.id];
    if (!DT.S.windowOpen()) { UI.toast('El libro de pases está cerrado. Abre en las semanas 0–4 y 21–26.'); return; }
    NEG.pid = p.id;
    NEG.fee = U.round(DT.P.value(p), stepFor(DT.P.value(p)));
    NEG.msg = '';
    NEG.counter = null; // la contraoferta es de otra negociación
    renderBuy();
  };
  function renderBuy() {
    const G = DT.G;
    const p = G.players[NEG.pid];
    const tm = G.teams[p.t];
    const imp = DT.M.importance(p);
    const hint = imp >= 1.5 ? 'Es una de las figuras del equipo: van a pedir bastante más que su valor.' : imp >= 1.25 ? 'Es titular: pedirán algo más que su valor.' : 'No es titular: podrían aceptar cerca de su valor.';
    UI.modal(`<h3>Oferta por ${U.esc(p.n)}</h3>
      <div class="small muted">${U.esc(tm.n)} · media ${p.ovr} · ${p.age} años · contrato ${p.cy} ${p.cy === 1 ? 'año' : 'años'}</div>
      <div class="small">Valor de mercado: <b>${U.money(DT.P.value(p))}</b>. ${hint}${p.cy <= 1 ? ' Le queda poco contrato: puede salir más barato.' : ''}</div>
      <div class="stepper"><button class="btn" data-a="negFee" data-v="-1">−</button><div class="val">${U.money(NEG.fee)}</div><button class="btn" data-a="negFee" data-v="1">+</button></div>
      <div class="row wrap">${[0.8, 1, 1.2, 1.5].map((k) => `<button class="chip" data-a="negFeeSet" data-v="${k}">${k === 1 ? 'Valor' : (k > 1 ? '+' : '') + Math.round((k - 1) * 100) + '%'}</button>`).join('')}</div>
      <div class="small muted">Presupuesto disponible: ${U.money(DT.M.budget(DT.userTeam()))}</div>
      ${NEG.msg ? `<div class="msg pending small">${U.esc(NEG.msg)}</div>` : ''}
      ${NEG.counter ? `<button class="btn gold block" data-a="negAcceptCounter">Aceptar ${U.money(NEG.counter)}</button>` : ''}
      <button class="btn primary block" data-a="negSend">Enviar oferta</button>`);
  }
  A.negFee = (d) => { NEG.fee = Math.max(0, NEG.fee + (+d.v) * stepFor(NEG.fee)); renderBuy(); };
  A.negFeeSet = (d) => { const p = DT.G.players[NEG.pid]; NEG.fee = U.round(DT.P.value(p) * +d.v, stepFor(DT.P.value(p))); renderBuy(); };
  A.negSend = () => {
    const r = DT.M.offer(NEG.pid, NEG.fee);
    NEG.counter = null;
    if (r.res === 'accept') { contractStep(NEG.pid, r.fee, `${DT.team(DT.G.players[NEG.pid].t).n} aceptó ${U.money(r.fee)}. Ahora negociá con el jugador.`); return; }
    if (r.res === 'counter') NEG.counter = r.fee;
    NEG.msg = r.msg || '';
    renderBuy();
  };
  A.negAcceptCounter = () => {
    const me = DT.userTeam();
    if (NEG.counter > DT.M.budget(me)) { NEG.msg = 'No tenés presupuesto para esa cifra.'; renderBuy(); return; }
    contractStep(NEG.pid, NEG.counter, 'Acuerdo entre clubes. Ahora negociá con el jugador.');
  };

  function contractStep(pid, fee, msg) {
    const p = DT.G.players[pid];
    const d = DT.P.demand(p, DT.userTeam());
    NEG.pid = pid;
    NEG.fee = fee;
    NEG.wage = U.round(d.w * 0.9, 1000);
    NEG.years = d.years;
    NEG.msg = msg || '';
    NEG.mode = 'sign';
    NEG.counter = null;
    renderContract();
  }
  A.contractOpen = (d) => contractStep(+d.id, +d.fee || 0, 'Jugador libre: no hay que pagar transferencia.');
  A.renewOpen = (d) => {
    const p = DT.G.players[+d.id];
    const dm = DT.M.renewDemand(p);
    NEG.pid = p.id; NEG.fee = 0; NEG.wage = U.round(Math.max(p.w, dm.w * 0.92), 1000); NEG.years = dm.years; NEG.mode = 'renew';
    NEG.msg = p.mor < 30 ? `${p.n} está disconforme y difícilmente quiera renovar.` : '';
    renderContract();
  };
  function renderContract() {
    const p = DT.G.players[NEG.pid];
    const me = DT.userTeam();
    const payroll = DT.E.payroll(me) - (p.t === me.id ? p.w : 0);
    UI.modal(`<h3>${NEG.mode === 'renew' ? 'Renovación' : 'Contrato'}: ${U.esc(p.n)}</h3>
      ${NEG.fee ? `<div class="small">Transferencia acordada: <b>${U.money(NEG.fee)}</b></div>` : ''}
      <div class="small muted">Sueldo actual: ${U.money(p.w)}/año. Masa salarial con este contrato: ${U.money(payroll + NEG.wage)} (tope ${U.money(DT.E.wageCap(me))}).</div>
      <span class="up">Sueldo anual</span>
      <div class="stepper"><button class="btn" data-a="negWage" data-v="-1">−</button><div class="val">${U.money(NEG.wage)}</div><button class="btn" data-a="negWage" data-v="1">+</button></div>
      <span class="up">Años de contrato</span>
      <div class="seg">${[1, 2, 3, 4, 5].map((y) => `<button class="${NEG.years === y ? 'on' : ''}" data-a="negYears" data-v="${y}">${y}</button>`).join('')}</div>
      ${NEG.msg ? `<div class="msg pending small">${U.esc(NEG.msg)}</div>` : ''}
      ${payroll + NEG.wage > DT.E.wageCap(me) ? `<button class="btn block" data-a="capRaise">Pedirle a la directiva más tope salarial</button>` : ''}
      <button class="btn primary block" data-a="negContract">Ofrecer contrato</button>`);
  }
  A.negWage = (d) => { NEG.wage = Math.max(12000, NEG.wage + (+d.v) * stepFor(NEG.wage) / 2); renderContract(); };
  A.negYears = (d) => { NEG.years = +d.v; renderContract(); };
  A.negContract = () => {
    const p = DT.G.players[NEG.pid];
    if (NEG.mode === 'renew') {
      const r = DT.M.renew(NEG.pid, NEG.wage, NEG.years);
      if (r.res === 'accept') { UI.closeModal(); UI.toast(`${p.n} renovó por ${NEG.years} ${NEG.years === 1 ? 'año' : 'años'}.`); DT.Main.autosave(); UI.render(); return; }
      NEG.msg = r.msg;
      renderContract();
      return;
    }
    const me = DT.userTeam();
    if (me.squad.length >= 34) { NEG.msg = 'El plantel está lleno (34 jugadores). Vendé o rescindí antes.'; renderContract(); return; }
    if (NEG.fee && NEG.fee > DT.M.budget(me)) { NEG.msg = 'Ya no tenés presupuesto para pagar la transferencia.'; renderContract(); return; }
    const r = DT.M.contractTalk(NEG.pid, NEG.wage, NEG.years);
    if (r.res === 'accept') {
      DT.M.completeSigning(NEG.pid, NEG.fee, NEG.wage, NEG.years);
      UI.closeModal();
      UI.toast(`¡${p.n} es nuevo jugador del club!`);
      DT.Main.autosave();
      UI.render();
      return;
    }
    NEG.msg = r.msg;
    renderContract();
  };

  // ================= CLUB =================
  Sc.club = function () {
    const v = UI.sub.club;
    const seg = `<div class="seg five">${[['fin', 'Finanzas'], ['stad', 'Estadio'], ['board', 'Directiva'], ['hist', 'Historial'], ['game', 'Partida']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-a="sub" data-k="club" data-v="${k}">${l}</button>`).join('')}</div>`;
    const f = { fin: Sc.finance, stad: Sc.stadium, board: Sc.board, hist: Sc.history, game: Sc.gameOpts }[v] || Sc.finance;
    return seg + f();
  };

  Sc.finance = function () {
    const G = DT.G;
    const t = DT.userTeam();
    const L = t.fin.cur;
    const tot = DT.E.totals(t);
    const res = tot.inc - tot.exp;
    const maxCat = Math.max(1, ...Object.values(L.inc), ...Object.values(L.exp));
    const bars = (obj, color) => Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="stack" style="gap:3px"><div class="row between small"><span>${U.esc(k)}</span><b class="tab-nums">${U.money(v)}</b></div><div class="bar"><i style="width:${(v / maxCat) * 100}%;background:${color}"></i></div></div>`).join('') || '<div class="small muted">Sin movimientos todavía.</div>';
    const rev = DT.E.estimateRevenue(t);
    const lastHome = DT.S.userFixtures().filter((m) => m.p && m.h === t.id && m.att).slice(-1)[0];
    const loans = t.loans.map((l, i) => `<div class="li"><div class="name">Préstamo de ${U.money(l.amt)}<div class="sub">Cuota ${U.money(l.pay)}/semana · faltan ${l.left} semanas · cancelar hoy: ${U.money(DT.E.loanRemaining(l))}</div></div><button class="btn sm" data-a="repay" data-i="${i}">Cancelar</button></div>`).join('');
    const opts = DT.E.loanOptions(t).map((o, i) => `<button class="btn block" data-a="loan" data-i="${i}" ${DT.E.canBorrow(t, o) ? '' : 'disabled'}>${U.money(o.amt)} · ${Math.round(o.rate * 100)}% anual · ${Math.round(o.weeks / 46)} ${o.weeks > 46 ? 'temporadas' : 'temporada'}<span class="tiny" style="display:block;font-weight:500">Cuota ${U.money(o.pay)}/semana · total a devolver ${U.money(o.total)}</span></button>`).join('');
    const hist = t.fin.hist.slice().reverse();
    return `
      <section class="card">
        <div class="kv"><div><span>Caja</span><b style="color:${t.cash < 0 ? 'var(--loss)' : 'inherit'}">${U.money(t.cash)}</b></div><div><span>Para fichajes</span><b>${U.money(DT.M.budget(t))}</b></div><div><span>Deuda</span><b>${U.money(DT.E.debt(t))}</b></div></div>
        <div class="small muted">Ingresos estimados por temporada: ${U.money(rev)}. La directiva reserva 4 semanas de sueldos y no permite compras si la caja es negativa.</div>
        <div class="row between small"><span>Sueldos <b>${U.money(DT.E.payroll(t))}</b>/año</span><span>Tope <b>${U.money(DT.E.wageCap(t))}</b></span></div>
        <div class="bar ${DT.E.payroll(t) > DT.E.wageCap(t) ? 'bad' : DT.E.payroll(t) > DT.E.wageCap(t) * 0.92 ? 'warn' : ''}"><i style="width:${Math.min(100, (DT.E.payroll(t) / DT.E.wageCap(t)) * 100)}%"></i></div>
        <button class="btn block" data-a="capRaise" ${(t.capAsks || 0) >= 2 ? 'disabled' : ''}>Pedir más tope salarial a la directiva (${2 - (t.capAsks || 0)} pedidos disponibles)</button>
        ${UI.lineChart(t.fin.bal, { label: 'Evolución de la caja en la temporada' })}
      </section>
      <section class="card">
        <div class="row between"><h3>Temporada ${G.year}</h3><b class="tab-nums" style="color:${res < 0 ? 'var(--loss)' : 'var(--win)'}">${res >= 0 ? '+' : ''}${U.money(res)}</b></div>
        <div class="up">Ingresos · ${U.money(tot.inc)}</div>${bars(L.inc, 'var(--win)')}
        <div class="up">Gastos · ${U.money(tot.exp)}</div>${bars(L.exp, 'var(--loss)')}
      </section>
      <section class="card">
        <h3>Entradas y socios</h3>
        <div class="row between"><div class="grow"><b>Precio de la entrada</b><div class="small muted">Referencia ${U.money(DT.E.refTicket(t))}${lastHome ? ` · último partido: ${U.num(lastHome.att)} de ${U.num(t.cap)}` : ''}</div></div>
          <div class="stepper" style="width:150px"><button class="btn sm" data-a="price" data-k="ticket" data-v="-1">−</button><div class="val" style="font-size:1.1rem">$${t.ticket}</div><button class="btn sm" data-a="price" data-k="ticket" data-v="1">+</button></div></div>
        <div class="row between"><div class="grow"><b>Cuota mensual de socio</b><div class="small muted">Referencia $${DT.COUNTRIES[t.cc].socio} · ${U.num(t.socios)} socios</div></div>
          <div class="stepper" style="width:150px"><button class="btn sm" data-a="price" data-k="fee" data-v="-1">−</button><div class="val" style="font-size:1.1rem">$${t.fee}</div><button class="btn sm" data-a="price" data-k="fee" data-v="1">+</button></div></div>
        <div class="small muted">Entradas caras llenan menos el estadio. Una cuota alta recauda más por socio pero con el tiempo se van socios; los buenos resultados atraen nuevos.</div>
      </section>
      <section class="card">
        <h3>Sponsor principal</h3>
        <div class="small">${t.sponsor ? `<b>${U.esc(t.sponsor.name)}</b>: ${U.money(t.sponsor.amt)} por temporada${t.sponsor.bonus ? ` + ${U.money(t.sponsor.bonus)} ${t.sponsor.kind === 'titulos' ? 'por cada título' : 'si se cumple el objetivo'}` : ''}. Otros sponsors aportan ${U.money(DT.E.sponsorBase(t) * 0.2)}.` : 'Sin sponsor.'}</div>
      </section>
      <section class="card">
        <h3>Préstamos</h3>
        ${loans ? `<div class="list">${loans}</div>` : '<div class="small muted">No tenés préstamos activos.</div>'}
        <div class="up">Pedir un préstamo</div>${opts}
      </section>
      ${hist.length ? `<section class="card"><h3>Balances anteriores</h3><div class="tablewrap"><table><thead><tr><th>Año</th><th>Resultado</th><th>Ingresos</th><th>Gastos</th><th>Caja</th></tr></thead><tbody>${hist.map((h) => `<tr><td>${h.y}</td><td style="text-align:left;color:${h.inc - h.exp < 0 ? 'var(--loss)' : 'var(--win)'}">${U.money(h.inc - h.exp)}</td><td>${U.money(h.inc)}</td><td>${U.money(h.exp)}</td><td>${U.money(h.cash)}</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
  };
  A.price = (d) => {
    const t = DT.userTeam();
    if (d.k === 'ticket') t.ticket = U.clamp(t.ticket + +d.v, 1, 200);
    else t.fee = U.clamp(t.fee + +d.v, 1, 80);
    UI.render();
  };
  A.loan = (d) => {
    const t = DT.userTeam();
    const o = DT.E.loanOptions(t)[+d.i];
    if (!DT.E.canBorrow(t, o)) { UI.toast('El banco no presta más: la deuda sería demasiado alta.'); return; }
    DT.E.takeLoan(t, o);
    UI.toast(`Recibiste ${U.money(o.amt)}.`);
    DT.Main.autosave();
    UI.render();
  };
  A.repay = (d) => {
    const t = DT.userTeam();
    if (!DT.E.repayLoan(t, +d.i)) UI.toast('No hay caja suficiente para cancelarlo.');
    else UI.toast('Préstamo cancelado.');
    UI.render();
  };

  Sc.stadium = function () {
    const t = DT.userTeam();
    const pips = (lvl) => `<span class="tab-nums" style="letter-spacing:2px;color:var(--accent)">${'■'.repeat(lvl)}<span style="opacity:.25">${'■'.repeat(5 - lvl)}</span></span>`;
    const proj = t.proj.map((p) => `<div class="stack" style="gap:4px"><div class="row between small"><b>${U.esc(p.label)}</b><span>${p.left} sem.</span></div><div class="bar"><i style="width:${((p.total - p.left) / p.total) * 100}%"></i></div></div>`).join('');
    const stadBusy = DT.E.busy(t, 'stadium');
    const exp = DT.E.STADIUM.map((o, i) => `<button class="btn block" data-a="build" data-k="stadium" data-i="${i}" ${stadBusy || t.cap + o.seats > 110000 ? 'disabled' : ''}>+${U.num(o.seats)} lugares · ${U.money(DT.E.stadiumCost(t, o.seats))}<span class="tiny" style="display:block;font-weight:500">${o.weeks} semanas de obra</span></button>`).join('');
    const fac = Object.keys(DT.E.INFRA).map((k) => {
      const I = DT.E.INFRA[k];
      const lvl = t.infra[k];
      const busy = DT.E.busy(t, k);
      return `<section class="card"><div class="row between"><h3>${I.n}</h3>${pips(lvl)}</div><div class="small muted">${I.d}</div>
        ${lvl >= 5 ? '<div class="small">Nivel máximo.</div>' : `<button class="btn block" data-a="build" data-k="${k}" ${busy ? 'disabled' : ''}>${busy ? 'Obra en curso' : `Mejorar a nivel ${lvl + 1} · ${U.money(DT.E.infraCost(t, k))} · ${DT.E.infraWeeks(t, k)} semanas`}</button>`}</section>`;
    }).join('');
    return `<section class="card"><span class="up">Estadio</span><h2>${U.esc(t.stad)}</h2>
        <div class="kv"><div><span>Capacidad</span><b>${U.num(t.cap)}</b></div><div><span>Socios</span><b>${U.num(t.socios)}</b></div><div><span>Mantenimiento</span><b>${U.money(DT.E.upkeepAnnual(t))}</b></div></div>
        <div class="small muted">Demanda estimada de público: ${U.num(DT.E.demandBase(t))} personas por partido (antes de precio y rendimiento). Ampliar conviene si el estadio se llena seguido.</div>
        ${exp}</section>
      ${proj ? `<section class="card"><h3>Obras en curso</h3>${proj}</section>` : ''}
      ${fac}
      <section class="card flat small muted">Cada nivel de infraestructura suma gastos de staff y mantenimiento. Gasto anual actual en staff: ${U.money(DT.E.staffAnnual(t))}.</section>`;
  };
  A.build = (d) => {
    const t = DT.userTeam();
    const r = d.k === 'stadium' ? DT.E.startProject(t, 'stadium', DT.E.STADIUM[+d.i]) : DT.E.startProject(t, d.k);
    UI.toast(r.ok ? 'Obra iniciada.' : r.msg);
    if (r.ok) DT.Main.autosave();
    UI.render();
  };

  Sc.board = function () {
    const G = DT.G;
    const M = G.manager;
    const t = DT.userTeam();
    const conf = Math.round(M.conf);

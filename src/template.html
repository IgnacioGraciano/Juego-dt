<title>DT Sudamericano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna única de celular (máx. 560px), barra superior del club, contenido, botón Continuar fijo y pestañas abajo.
   Con html.desk (modo ordenador) usa todo el ancho: pestañas arriba y tarjetas en columnas. */
:root {
  --bg: #eef0ea;
  --surface: #ffffff;
  --surface-2: #f6f7f2;
  --ink: #142030;
  --muted: #5e6a74;
  --line: #d9ddd3;
  --accent: #1d7348;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe3;
  --gold: #b8860b;
  --gold-soft: #f6ebc9;
  --win: #1f8a4c;
  --draw: #8b8f98;
  --loss: #c0392b;
  --warn: #c77700;
  --lib: #1d7348;
  --sud: #2f6fb5;
  --rel: #c0392b;
  --pitch-a: #2f7d4f;
  --pitch-b: #2a7247;
  --pitch-line: rgba(255, 255, 255, 0.55);
  --shadow: 0 1px 2px rgba(20, 32, 48, 0.08), 0 4px 14px rgba(20, 32, 48, 0.06);
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif-condensed, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1622; --surface: #152132; --surface-2: #1a283b; --ink: #e7edf3; --muted: #93a1b0; --line: #26364b;
    --accent: #3fae74; --accent-ink: #06150d; --accent-soft: #173a2a; --gold: #e2b54a; --gold-soft: #3a3020;
    --win: #43b87a; --draw: #8b95a3; --loss: #e06b5e; --warn: #e5a03a; --lib: #3fae74; --sud: #5b9be0; --rel: #e06b5e;
    --pitch-a: #1f5a39; --pitch-b: #1c5234; --pitch-line: rgba(255, 255, 255, 0.4);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1622; --surface: #152132; --surface-2: #1a283b; --ink: #e7edf3; --muted: #93a1b0; --line: #26364b;
  --accent: #3fae74; --accent-ink: #06150d; --accent-soft: #173a2a; --gold: #e2b54a; --gold-soft: #3a3020;
  --win: #43b87a; --draw: #8b95a3; --loss: #e06b5e; --warn: #e5a03a; --lib: #3fae74; --sud: #5b9be0; --rel: #e06b5e;
  --pitch-a: #1f5a39; --pitch-b: #1c5234; --pitch-line: rgba(255, 255, 255, 0.4);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); }
.num, td, .tab-nums { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.tiny { font-size: 0.75rem; }
.up { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; font-weight: 600; color: var(--muted); }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 8px; padding-inline: 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
#top .club { flex: 1; min-width: 0; }
#top .club > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .club b { font-family: var(--display); font-size: 1.2rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .cash { text-align: right; font-family: var(--display); font-size: 1.1rem; font-weight: 600; }
#main { flex: 1; padding-block: 12px 150px; padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; }
#cta { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 25; pointer-events: none; }
#cta .inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 8px; }
#cta button { pointer-events: auto; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
#tabs button { border: 0; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
#tabs button svg { width: 22px; height: 22px; }
#tabs button.on { color: var(--accent); }
#tabs button .dot { position: absolute; top: 5px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn { border: 0; border-radius: 9px; padding: 11px 14px; font-weight: 700; background: var(--surface-2); color: var(--ink); cursor: pointer; border: 1px solid var(--line); text-align: center; }
.btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.gold { background: var(--gold); color: #1d1503; border-color: transparent; }
.btn.danger { color: var(--loss); }
.btn.block { width: 100%; }
.btn.big { padding: 15px; font-size: 1.05rem; font-family: var(--display); letter-spacing: 0.03em; text-transform: uppercase; box-shadow: 0 6px 18px rgba(29, 115, 72, 0.35); }
.btn.sm { padding: 7px 10px; font-size: 0.85rem; border-radius: 7px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; overflow-x: auto; }
.seg button { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 5px; border-radius: 7px; font-weight: 600; font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.seg.five button { font-size: 0.76rem; padding-inline: 2px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Escudos: forma de escudo con los colores del club */
.badge { --c1: #ccc; --c2: #333; --bt: #111; width: 34px; height: 38px; flex: none; display: inline-grid; place-items: center; background: linear-gradient(135deg, var(--c1) 0 58%, var(--c2) 58% 100%); clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); font-family: var(--display); font-weight: 700; font-size: 0.72rem; color: var(--bt); letter-spacing: 0.02em; padding-bottom: 6px; position: relative; }
.badge.s { width: 22px; height: 25px; font-size: 0.5rem; padding-bottom: 4px; }
.badge.l { width: 56px; height: 62px; font-size: 1.05rem; padding-bottom: 10px; }
.badge.xl { width: 72px; height: 80px; font-size: 1.3rem; padding-bottom: 12px; }
.badge-wrap { filter: drop-shadow(0 0 0.6px var(--muted)); display: inline-flex; }
/* Escudos reales: se ve el escudo dibujado hasta que la imagen termina de cargar (sin conexión queda el dibujado) */
.crest-wrap { position: relative; flex: none; align-items: center; justify-content: center; }
.crest-wrap .crest { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
.crest-wrap.crest-ok { filter: none; }
.crest-wrap.crest-ok .crest { opacity: 1; }
.crest-wrap.crest-ok > .badge { visibility: hidden; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .crest-wrap .crest { filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.35)); } }
:root[data-theme="dark"] .crest-wrap .crest { filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.35)); }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.slot:last-of-type { border-bottom: 0; }
.slot .slotn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 0.8rem; flex: none; }
.slot.empty { opacity: 0.75; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.ach { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; opacity: 0.6; }
.ach .ic { font-size: 1.4rem; width: 30px; text-align: center; flex: none; }
.ach.on { opacity: 1; border-color: var(--gold); background: var(--gold-soft); }
/* Resumen semanal: compacto para que "Seguir" quede a la vista */
.wk { gap: 10px !important; padding-block: 12px 0 !important; min-height: 100%; }
.wk-head { text-align: center; }
.wk-head h2 { font-size: 1.5rem; text-transform: uppercase; }
.wk-body { display: flex; flex-direction: column; gap: 10px; }
.wk-card { padding: 10px 12px; gap: 6px; }
.wk-card table td { padding-block: 5px; }
.wk-line { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.wk-line:last-child { border-bottom: 0; }
.wk-line .small { font-size: 0.8rem; }
.dotc { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dotc.bad { background: var(--loss); } .dotc.ok { background: var(--win); } .dotc.warn { background: var(--warn); } .dotc.gold { background: var(--gold); }
.wk-foot { position: sticky; bottom: 0; margin-top: auto; background: linear-gradient(transparent, var(--bg) 22%); padding-block: 14px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 4px; }
html.desk .wk { min-height: 0; }
html.desk .wk-foot { position: static; max-width: 420px; width: 100%; margin: 6px auto 0; }
html.desk .wk-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 14px; }
.tension { display: flex; flex-direction: column; gap: 4px; }
.tension .bar { height: 8px; }
.diffpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.diffpick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.diffpick button b { font-family: var(--display); font-size: 1.1rem; }
.diffpick button span { font-size: 0.78rem; color: var(--muted); }
.diffpick button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--win); border-color: currentColor; background: transparent; }
.pill.bad { color: var(--loss); border-color: currentColor; background: transparent; }
.pill.warn { color: var(--warn); border-color: currentColor; background: transparent; }
.pill.gold { color: var(--gold); border-color: currentColor; background: transparent; }
.res { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 0.7rem; font-weight: 700; color: #fff; }
.res.G { background: var(--win); } .res.E { background: var(--draw); } .res.P { background: var(--loss); }

.pos { display: inline-grid; place-items: center; width: 34px; padding: 2px 0; border-radius: 5px; font-size: 0.68rem; font-weight: 700; color: #fff; flex: none; }
.pos.P { background: #b7791f; } .pos.D { background: #2f6fb5; } .pos.M { background: #1d7348; } .pos.A { background: #c0392b; }
.ovr { font-family: var(--display); font-weight: 700; font-size: 1.15rem; min-width: 26px; text-align: right; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--loss); }
.stars { color: var(--gold); letter-spacing: -1px; font-size: 0.8rem; white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); min-width: 0; cursor: pointer; }
.li:last-child { border-bottom: 0; }
.li .name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .sub { font-size: 0.78rem; color: var(--muted); font-weight: 400; }

.tablewrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; text-align: right; padding: 6px 4px; }
td { padding: 7px 3px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td.team { max-width: 128px; overflow: hidden; text-overflow: ellipsis; }
tr.me td { background: var(--accent-soft); font-weight: 700; }
td.zone { border-left: 3px solid transparent; text-align: center; width: 28px; color: var(--muted); }
td.zone.lib { border-left-color: var(--lib); } td.zone.sud { border-left-color: var(--sud); } td.zone.rel { border-left-color: var(--rel); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* Próximo partido */
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.matchup .t { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.matchup .t b { font-family: var(--display); font-size: 1.05rem; line-height: 1.1; }
.matchup .vs { font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--muted); }
.score { font-family: var(--display); font-weight: 700; font-size: 2.6rem; letter-spacing: 0.04em; }
.kicker { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.8rem; font-weight: 600; color: var(--accent); }

/* Cancha */
.pitch { position: relative; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 68 / 92; border-radius: 10px; overflow: hidden; background: repeating-linear-gradient(180deg, var(--pitch-a) 0 10%, var(--pitch-b) 10% 20%); }
.pitch .lines { position: absolute; inset: 4%; border: 2px solid var(--pitch-line); border-radius: 2px; }
.pitch .lines::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--pitch-line); }
.pitch .lines::after { content: ''; position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border: 2px solid var(--pitch-line); border-radius: 50%; transform: translate(-50%, -50%); }
.pitch .box { position: absolute; left: 25%; width: 50%; height: 14%; border: 2px solid var(--pitch-line); }
.pitch .box.top { top: 4%; border-top: 0; } .pitch .box.bot { bottom: 4%; border-bottom: 0; }
.tok { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 74px; cursor: pointer; border: 0; background: none; padding: 0; }
.tok .c { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.05rem; background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); border: 3px solid var(--c, #fff); }
.tok .n { font-size: 0.7rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tok .f { width: 34px; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.35); overflow: hidden; }
.tok .f i { display: block; height: 100%; background: #7be0a6; }
.tok.sel .c { outline: 3px solid var(--gold); outline-offset: 2px; }
.tok.bad .c { background: #ffd9d4; color: #8a1c10; }
.tok .slot { font-size: 0.6rem; font-weight: 700; color: rgba(255, 255, 255, 0.85); }
.li.sel { background: var(--gold-soft); }

/* Modal y overlay */
#modal { position: fixed; inset: 0; z-index: 60; background: rgba(8, 14, 22, 0.55); display: flex; align-items: flex-end; justify-content: center; }
#modal .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; display: flex; flex-direction: column; gap: 12px; }
#modal .sheet .close { align-self: flex-end; }
#overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#overlay .wrap { max-width: 560px; margin: 0 auto; padding-block: 14px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; max-width: calc(100% - 32px); box-shadow: var(--shadow); text-align: center; }

/* Partido en vivo: encabezado, cancha y controles */
.mhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; background: #101a28; color: #f1f5f9; border-radius: 12px; padding: 10px; }
.mhead .mt { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.mhead .mt b { display: block; max-width: 100%; font-family: var(--display); font-size: 0.95rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mhead .mt .meta { font-size: 0.68rem; color: #a9b6c4; white-space: nowrap; }
#note:empty, #lineups:empty { display: none; }
.mhead .mc { text-align: center; }
.mhead .sc { font-family: var(--display); font-size: 2.1rem; font-weight: 700; line-height: 1; }
.mhead .min { font-family: var(--display); font-weight: 600; color: #7be0a6; }
.mhead .wx { grid-column: 1 / -1; text-align: center; font-size: 0.7rem; color: #a9b6c4; }
.pitchwrap { border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); background: var(--pitch-a); }
.pitchwrap canvas { display: block; width: 100%; height: auto; aspect-ratio: 111 / 74; }
.mctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.mctl .seg { flex: none; }
.seg.sm button { padding: 5px 9px; font-size: 0.8rem; flex: none; }
/* Partido en vivo */
.scoreboard { background: #101a28; color: #f1f5f9; border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.scoreboard .t { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.scoreboard .t b { font-family: var(--display); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.scoreboard .sc { font-family: var(--display); font-size: 2.8rem; font-weight: 700; line-height: 1; }
.scoreboard .min { font-family: var(--display); font-size: 1rem; color: #7be0a6; font-weight: 600; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.ev { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; padding: 6px 2px; border-bottom: 1px dashed var(--line); }
.ev .m { font-family: var(--display); font-weight: 700; color: var(--muted); min-width: 30px; }
.ev.goal { font-weight: 700; }
.ev.goal .m { color: var(--accent); }
.ev .ic { width: 12px; height: 16px; border-radius: 2px; flex: none; margin-top: 2px; }
